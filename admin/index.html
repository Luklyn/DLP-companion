<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration – Theme Parks Companion</title>
<link rel="icon" href="../icon.png">
<style>
:root{--bg:#F4F5F8;--ink:#161A22;--mut:#5B6475;--line:#E3E6EC;--acc:#2B59D9;--accd:#2249B5;--ok:#0B6140;--okbg:#E7F5EE;--warn:#7A4B00;--warnbg:#FFF1D6;--err:#9B1C1C;--errbg:#FDE8E8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
aside{flex:0 0 244px;max-width:100%;padding:20px 14px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
main{flex:999 1 560px;min-width:0;padding:28px 32px 56px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#3A4254;font-weight:500;text-align:left}
.nav:hover{background:#EEF0F5}
.nav.on{background:#E8EEFD;color:#1D45B8;font-weight:600}
.nav .sp{margin-left:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.pad{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #CDD2DC;background:#fff;color:var(--ink);font-weight:600}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--accd)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.inp,.cell{width:100%;border:1px solid #CDD2DC;border-radius:10px;background:#fff;color:var(--ink)}
.inp{min-height:44px;padding:0 12px}
.cell{min-height:36px;padding:0 8px;border-color:#D5D9E1;border-radius:8px;font-size:13px}
.cell.todo{border-color:#E08A1E}
.lbl{display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:#4A5366;letter-spacing:.02em}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#ECEEF3;color:#3A4254}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.err{background:var(--errbg);color:var(--err)}.chip.blue{background:#E8EEFD;color:#1D45B8}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #D5D9E1;background:#fff;color:#3A4254;font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
h1{margin:0;font-size:26px;letter-spacing:-.01em}h2{margin:0;font-size:17px}h3{margin:0;font-size:15px}
.sub{margin:4px 0 0;color:var(--mut)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sc{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th{padding:10px 8px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#4A5366;background:var(--bg);white-space:nowrap}
td{padding:8px;border-top:1px solid #ECEEF3;vertical-align:middle}
.note{padding:12px 14px;border-radius:10px;font-size:13px}
.note.warn{background:var(--warnbg);color:#6B4200}.note.err{background:var(--errbg);color:var(--err)}.note.ok{background:var(--okbg);color:var(--ok)}.note.info{background:#ECEEF3;color:#3A4254}
.bars{display:flex;align-items:flex-end;gap:3px;height:180px}.bars i{flex:1 1 0;min-width:2px;border-radius:3px 3px 0 0;background:var(--acc)}
.meter{height:10px;border-radius:6px;background:#ECEEF3}.meter i{display:block;height:10px;border-radius:6px}
.tl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tl li{display:flex;gap:12px;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 26px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid #CDD2DC;border-top-color:var(--acc);display:inline-block;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{padding:12px 0;border-top:1px solid #ECEEF3;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
ul.plain li:first-child{border-top:0}
.toast{position:fixed;right:20px;bottom:20px;max-width:380px;padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:20}
.toast.err{background:var(--err)}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
</style>
</head>
<body>
<div class="shell">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
'use strict';
/* =====================================================================
   Administration Theme Parks Companion – page statique (GitHub Pages)
   Tout passe par l'API GitHub avec un jeton personnel stocké dans ce navigateur.
   ===================================================================== */
const REPO = 'Luklyn/DLP-companion';
const BRANCH = 'main';
const SYNC_BRANCH = 'auto/sync-places';
const WORKFLOW = 'sync-places.yml';
const GH = 'https://api.github.com';
const TP = 'https://api.themeparks.wiki/v1';
const KINDS = ['attractions', 'restaurants', 'shows'];
const KIND_LABEL = { attractions: 'Attraction', restaurants: 'Restaurant', shows: 'Spectacle / rencontre' };
const TP_KIND = { ATTRACTION: 'attractions', SHOW: 'shows', DINING: 'restaurants', RESTAURANT: 'restaurants' };
const ORDER = {
  attractions: ['Code', 'UUID Themeparks.wiki', 'Nom', 'Description', 'Parc', 'Land', 'Type', 'Taille mini', 'Coordonnées GPS (lat)', 'Coordonnées GPS (lng)', 'Statut inconnu'],
  restaurants: ['Code', 'UUID Themeparks.wiki', 'Nom', 'Description', 'Menu', 'Tarif', 'Type', 'Parc', 'Land', 'Coordonnées GPS (lat)', 'Coordonnées GPS (lng)', 'Statut inconnu'],
  shows: ['Code', 'UUID Themeparks.wiki', 'Nom', 'Description', 'Type', 'Parc', 'Land', 'Coordonnées GPS (lat)', 'Coordonnées GPS (lng)', 'Statut inconnu']
};

/* ---------- stockage (jamais bloquant) ---------- */
const store = {
  get(k, s) { try { return (s ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } },
  set(k, v, s) { try { (s ? sessionStorage : localStorage).setItem(k, v); } catch (e) { /* ignoré */ } },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { /* ignoré */ } }
};
let token = '';   // jamais écrit en clair : seul le coffre chiffré (mot de passe) est conservé

/* ---------- état ---------- */
const S = {
  unlocked: false, gateErr: '', gateBusy: false, view: 'dash', period: '30', conn: null /* {login, push} */, connErr: '', busy: {},
  parks: null, sites: {}, counts: {}, releases: null,
  park: null, cands: null, cRun: null, cMsg: '', checked: false, checkErr: '', rows: [], skippedPark: 0, knownCount: 0,
  urls: { attractions: '', shows: '', restaurants: '' }, run: null /* {id,status,since,url} */, fetchMsg: '', enriched: false,
  pending: JSON.parse(store.get('tpc_admin_pending') || '{}'),
  mode: 'direct', msg: '', pub: null /* {steps, step, url, err} */, prs: null, history: null,
  np: { name: '', id: '', idTouched: false, country: 'FR', api1: '', api2: '', s1: '', s2: '', s3: '', color: '#2B59D9' }, npTest: null
};
function savePending() { store.set('tpc_admin_pending', JSON.stringify(S.pending)); }

/* ---------- utilitaires ---------- */
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = (s) => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const fmt = (n) => new Intl.NumberFormat('fr-FR').format(n);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, err ? 7000 : 3500); }
function b64dec(b) { const bin = atob(String(b).replace(/\s/g, '')); const u = Uint8Array.from(bin, (c) => c.charCodeAt(0)); return new TextDecoder().decode(u); }
function ago(iso) { const d = (Date.now() - new Date(iso).getTime()) / 60000; if (d < 1) return 'à l’instant'; if (d < 60) return `il y a ${Math.round(d)} min`; if (d < 1440) return `il y a ${Math.round(d / 60)} h`; return `il y a ${Math.round(d / 1440)} j`; }

/* ---------- API GitHub ---------- */
async function gh(path, opt = {}) {
  const headers = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (token) headers.Authorization = 'Bearer ' + token;
  if (opt.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(GH + path, { method: opt.method || 'GET', headers, body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).message; } catch (e) { /* ignoré */ }
    const e = new Error(`GitHub ${r.status}${m ? ' : ' + m : ''}`); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
const needToken = () => { if (!token) { toast('Connectez-vous avec un jeton GitHub pour cette action.', true); return true; } return false; };
async function readFile(path, ref = BRANCH) {
  if (token) {
    try { const j = await gh(`/repos/${REPO}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(ref)}`); return b64dec(j.content); }
    catch (e) { if (e.status === 404) return null; throw e; }
  }
  if (ref !== BRANCH) throw new Error('Connexion GitHub requise');
  const r = await fetch('../' + path + '?t=' + Date.now()); return r.ok ? r.text() : null;
}
async function readJson(path, fallback, ref) { const t = await readFile(path, ref); if (t == null) return fallback; try { return JSON.parse(t); } catch (e) { return fallback; } }
async function tp(path) { const r = await fetch(TP + path); if (!r.ok) throw new Error(`themeparks.wiki ${r.status}`); return r.json(); }
function entityId(v) {
  v = String(v || '').trim(); const m = v.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  if (m) return m[0].toLowerCase(); const m2 = v.match(/\/entity\/([^/?#]+)/); return m2 ? m2[1] : v;
}

/* ---------- données ---------- */
async function loadBase() {
  S.parks = await readJson('parks.json', { resorts: [] });
  S.sites = await readJson('tools/importer/sites.json', {});
  if (!S.park || !S.parks.resorts.find((r) => r.id === S.park)) S.park = S.parks.resorts[0]?.id;
  await Promise.all(S.parks.resorts.map(async (r) => {
    const c = {};
    await Promise.all([...KINDS, 'ignored'].map(async (k) => { const d = await readJson(r.dataPath + k + '.json', []).catch(() => []); c[k] = Array.isArray(d) ? d.length : 0; }));
    S.counts[r.id] = c;
  }));
  try { S.releases = await gh(`/repos/${REPO}/releases?per_page=30`); } catch (e) { S.releases = null; }
}
async function connect(tok) {
  S.connErr = '';
  try {
    const old = token; token = tok.trim();
    const repo = await gh(`/repos/${REPO}`);
    const me = await gh('/user');
    S.conn = { login: me.login, push: !!(repo.permissions && repo.permissions.push) };
    if (!S.conn.push) { S.connErr = 'Ce jeton n’a pas le droit d’écrire dans le dépôt.'; token = old; S.conn = null; return false; }
    return true;
  } catch (e) { token = ''; S.conn = null; S.connErr = e.status === 401 ? 'Jeton refusé par GitHub.' : e.message; return false; }
}

/* ---------- coffre : le jeton est chiffré (AES-GCM) avec une clé dérivée du mot de passe (PBKDF2) ---------- */
const enc = new TextEncoder();
const toB64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
const fromB64 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function vaultSeal(pw, tok) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const key = await deriveKey(pw, salt, iter);
  const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(tok));
  store.set('tpc_admin_vault', JSON.stringify({ v: 1, iter, salt: toB64(salt), iv: toB64(iv), data: toB64(data) }));
}
async function vaultOpen(pw) {
  const v = JSON.parse(store.get('tpc_admin_vault'));
  const key = await deriveKey(pw, fromB64(v.salt), v.iter);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(v.iv) }, key, fromB64(v.data));   // échoue si le mot de passe est faux
  return new TextDecoder().decode(plain);
}
const hasVault = () => !!store.get('tpc_admin_vault');
let idleTimer = null;
function armIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(lock, 30 * 60 * 1000); }
function lock() { token = ''; S.conn = null; S.unlocked = false; S.gateErr = ''; S.pending = S.pending; clearTimeout(idleTimer); render(); }
async function unlockWith(pw) {
  S.gateBusy = true; S.gateErr = ''; render();
  try {
    let tok;
    try { tok = await vaultOpen(pw); } catch (e) { S.gateErr = 'Mot de passe incorrect.'; S.gateBusy = false; render(); return; }
    if (!(await connect(tok))) { S.gateBusy = false; render(); return; }
    S.unlocked = true; armIdle();
    try { await loadBase(); } catch (e) { toast('Chargement impossible : ' + e.message, true); }
    S.gateBusy = false; render(); loadDeployExtras();
  } catch (e) { S.gateErr = e.message; S.gateBusy = false; render(); }
}
async function setupWith(tok, pw, pw2) {
  S.gateErr = '';
  if (!tok) { S.gateErr = 'Collez d’abord votre jeton GitHub.'; render(); return; }
  if (pw.length < 10) { S.gateErr = 'Le mot de passe doit faire au moins 10 caractères.'; render(); return; }
  if (pw !== pw2) { S.gateErr = 'Les deux mots de passe ne correspondent pas.'; render(); return; }
  S.gateBusy = true; render();
  if (!(await connect(tok))) { S.gateBusy = false; render(); return; }
  await vaultSeal(pw, token);
  S.unlocked = true; armIdle();
  try { await loadBase(); } catch (e) { toast('Chargement impossible : ' + e.message, true); }
  S.gateBusy = false; render(); loadDeployExtras();
}
function forgetDevice() { store.del('tpc_admin_vault'); store.del('tpc_admin_pending'); S.pending = {}; lock(); }
function gateHtml() {
  const first = !hasVault();
  return `<section class="card pad" style="display:flex;flex-direction:column;gap:14px;max-width:560px;margin:8vh auto 0;width:100%">
    <div class="brand" style="padding:0"><div class="logo">TP</div><div><div style="font-weight:700;font-size:15px">Theme Parks</div><div style="font-size:12px;color:var(--mut)">Administration</div></div></div>
    <h2>${first ? 'Première connexion sur cet appareil' : 'Accès à l’administration'}</h2>
    ${first ? `<p class="sub">Collez votre jeton GitHub et choisissez un mot de passe. Le jeton est chiffré sur cet appareil avec ce mot de passe : sans lui, il est illisible.</p>
      <div><label class="lbl" for="g-tok">Jeton d’accès personnel GitHub</label><input id="g-tok" class="inp mono" type="password" autocomplete="off" placeholder="github_pat_…"><div class="hint">Dépôt ${REPO} · droits Contents, Pull requests et Actions (lecture/écriture).</div></div>
      <div><label class="lbl" for="g-pw">Mot de passe (10 caractères minimum)</label><input id="g-pw" class="inp" type="password" autocomplete="new-password"></div>
      <div><label class="lbl" for="g-pw2">Confirmer le mot de passe</label><input id="g-pw2" class="inp" type="password" autocomplete="new-password"></div>`
    : `<div><label class="lbl" for="g-pw">Mot de passe</label><input id="g-pw" class="inp" type="password" autocomplete="current-password"></div>`}
    ${S.gateErr ? `<div class="note err" role="alert">${esc(S.gateErr)}</div>` : ''}
    <div class="row"><button class="btn pri" data-act="${first ? 'setup' : 'unlock'}" ${S.gateBusy ? 'disabled' : ''}>${S.gateBusy ? 'Vérification…' : (first ? 'Enregistrer et entrer' : 'Déverrouiller')}</button>
    ${first ? '' : '<button class="btn" data-act="forget">Oublier cet appareil</button>'}</div>
    ${first ? '' : '<p class="hint">« Oublier cet appareil » supprime le jeton chiffré enregistré ici ; vous devrez en coller un à nouveau.</p>'}
  </section>`;
}

/* ---------- pending (modifications en attente) ---------- */
async function currentContent(path) {
  if (S.pending[path]) return S.pending[path].content;
  return (await readFile(path)) ?? '[]';
}
async function stage(path, content, note) {
  const prev = S.pending[path];
  const orig = prev ? prev.orig : ((await readFile(path)) ?? null);
  S.pending[path] = { path, content, orig, note: (prev && prev.note ? prev.note + ' ; ' : '') + note };
  savePending();
}
const jsonText = (v) => JSON.stringify(v, null, 2) + '\n';

/* ============================== VUES ============================== */
function sideHtml() {
  const n = Object.keys(S.pending).length;
  const nav = (v, label, ico, extra) => `<button class="nav ${S.view === v ? 'on' : ''}" data-go="${v}">${ico}${label}${extra || ''}</button>`;
  const I = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  return `<div class="brand"><div class="logo">TP</div><div><div style="font-weight:700;font-size:15px">Theme Parks</div><div style="font-size:12px;color:var(--mut)">Administration</div></div></div>
  ${nav('dash', 'Tableau de bord', I('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'))}
  ${nav('parks', 'Parcs et lieux', I('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'))}
  ${nav('newpark', 'Ajouter un parc', I('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'))}
  ${nav('deploy', 'Déploiement', I('<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5c0 3-3 3.5-8 5"/>'), n ? `<span class="sp chip blue">${n}</span>` : '')}
  <div style="margin-top:auto;padding:14px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)">
    <div style="font-weight:600;color:var(--ink)">${REPO}</div>
    ${S.conn ? `<div style="display:flex;align-items:center;gap:6px;margin-top:4px"><span style="width:8px;height:8px;border-radius:50%;background:#0F7B4F"></span>Connecté : ${esc(S.conn.login)}</div><button class="btn sm" style="margin-top:8px" data-act="lock">Verrouiller</button>` : ''}
  </div>`;
}

function loginCard() { return ''; }

/* ---------- tableau de bord ---------- */
function dashView() {
  const ex = { '7': [48210, 6.2, 1126, 11.8, 7], '30': [196540, 12.4, 4312, 15.3, 30], '90': [544800, 21.9, 10980, 27.0, 30] }[S.period];
  const seed = [52, 61, 58, 66, 71, 64, 79, 84, 76, 70, 68, 82, 91, 96, 88, 84, 79, 86, 94, 101, 97, 90, 85, 92, 104, 112, 108, 99, 95, 118];
  const bars = seed.slice(seed.length - ex[4]).map((h) => `<i style="height:${Math.round(h * 1.4)}px"></i>`).join('');
  let apk = null, rel = '';
  if (S.releases) {
    apk = 0; S.releases.forEach((r) => (r.assets || []).forEach((a) => { if (/\.apk$/i.test(a.name)) apk += a.download_count; }));
    const last = S.releases[0]; rel = last ? `Dernière version : ${esc(last.name || last.tag_name)}` : '';
  }
  const kpi = (label, value, note, tag) => `<div class="card pad" style="display:flex;flex-direction:column;gap:6px"><div style="font-size:13px;color:#4A5366;font-weight:600">${label}</div><div style="font-size:34px;font-weight:700;letter-spacing:-.02em">${value}</div><div style="font-size:12px;color:var(--mut)">${note}</div>${tag}</div>`;
  const exTag = '<span class="chip warn" style="align-self:flex-start">Exemple</span>';

async function doCands() {
  if (needToken()) return;
  const r = resortById(S.park); S.busy.cand = true; S.cands = null; S.cProg = null; S.cMsg = 'Lancement de la recherche…'; S.cRun = { status: 'queued' }; render();
  const since = Date.now() - 5000;
  try {
    const inputs = { resort: r.id, site_candidates: 'true', list_attractions: S.urls.attractions.trim(), list_shows: S.urls.shows.trim(), list_restaurants: S.urls.restaurants.trim() };
    await gh(`/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, { method: 'POST', body: { ref: BRANCH, inputs } });
    let live = true;
    (async () => { while (live && S.park === r.id) { await sleep(9000); if (!live) break; try { await pullProgress(r, since); } catch (e) { /* facultatif */ } } })();
    let run; try { run = await watchRun(since, r.id, (x, msg) => { S.cRun = x; S.cMsg = msg; render(); }); } finally { live = false; }
    if (!run) S.cMsg = 'La recherche est toujours en cours chez GitHub. Réessayez dans quelques minutes.';
    else if (run.conclusion !== 'success') S.cMsg = 'La recherche a échoué. Ouvrez l’exécution pour voir le détail.';
    else await loadCands(since, r);
  } catch (e) { S.cMsg = 'Échec : ' + e.message; S.cRun = null; }
  S.busy.cand = false; render();
}
function mapCands(list, r) {
  const park = (r.parks || [])[0]?.value || '';
  return list.filter((x) => x.nom).map((x) => ({ kind: KINDS.includes(x.kind) ? x.kind : 'restaurants', nom: x.nom, url: x.url, land: x.land || '', type: x.type || '', height: x.height || '', menu: x.menu || '', park, selected: true }));
}
/* pendant la recherche, le workflow publie sa progression : le tableau se remplit au fil des fiches lues */
async function pullProgress(r, since) {
  const p = await readJson(`site-candidates/${r.id}.progress.json`, null, SYNC_BRANCH);
  if (!p || !Array.isArray(p.items) || (p.started || 0) * 1000 < since - 5000) return;
  S.cProg = { done: p.done || 0, total: p.total || 0 }; S.cands = mapCands(p.items, r); render();
}
async function loadCands(since, r) {
  let b = null; try { b = await gh(`/repos/${REPO}/branches/${encodeURIComponent(SYNC_BRANCH)}`); } catch (e) { /* absente */ }
  if (!b || new Date(b.commit.commit.committer.date).getTime() < since) { S.cands = []; S.cMsg = 'La recherche n’a produit aucun résultat.'; S.cRun = null; return; }
  const list = await readJson(`site-candidates/${r.id}.json`, [], SYNC_BRANCH);
  S.cands = mapCands(list, r); S.cProg = null;
  S.cRun = null; S.cMsg = `${S.cands.length} lieu${S.cands.length > 1 ? 'x' : ''} trouvé${S.cands.length > 1 ? 's' : ''} sur le site.`;
}
async function doAddCands() {
  const r = resortById(S.park); const chosen = S.cands.filter((x) => x.selected); if (!chosen.length) return;
  S.busy.addc = true; render();
  try {
    const prefix = (r.id.replace(/[^a-z]/g, '').slice(0, 3) || 'NEW').toUpperCase(), letter = { attractions: 'A', restaurants: 'R', shows: 'S' };
    for (const k of KINDS) {
      const items = chosen.filter((x) => x.kind === k); if (!items.length) continue;
      const path = r.dataPath + k + '.json'; const cur = JSON.parse(await currentContent(path));
      const names = new Set(cur.map((x) => NORM(x.Nom))), codes = new Set(cur.map((x) => String(x.Code)));
      let n = 1, added = 0;
      for (const x of items) {
        if (names.has(NORM(x.nom))) continue;
        let code; do { code = `${prefix}${letter[k]}${String(n++).padStart(2, '0')}`; } while (codes.has(code)); codes.add(code);
        const rec = { Code: code, Nom: x.nom.trim() };
        if (x.type) rec.Type = x.type; rec.Parc = x.park || (r.parks[0] && r.parks[0].value);
        if (x.land) rec.Land = x.land; if (k === 'attractions' && x.height) rec['Taille mini'] = x.height; if (k === 'restaurants' && x.menu) rec.Menu = x.menu;
        rec['Statut inconnu'] = 'oui'; cur.push(rec); added++;
      }
      if (added) await stage(path, jsonText(cur), `+${added} lieu${added > 1 ? 'x' : ''} (site)`);
    }
    S.msg = S.msg || `Lieux du site ${r.name}`; S.cands = null; S.cMsg = ''; S.view = 'deploy'; S.pub = null;
    toast(`${chosen.length} lieu(x) prêts à être publiés.`);
  } catch (e) { toast('Impossible de préparer les modifications : ' + e.message, true); }
  S.busy.addc = false; render();
}

async function doCheck() {
  const r = resortById(S.park); const cfg = S.sites[r.id] || {};
  S.busy.check = true; S.checkErr = ''; S.checked = false; S.rows = []; S.enriched = false; S.run = null; S.fetchMsg = ''; render();
  try {
    const cid = entityId(r.themeparksId);
    const [children, live] = await Promise.all([tp(`/entity/${cid}/children`), tp(`/entity/${cid}/live`).catch(() => null)]);
    const liveSet = new Set(((live && live.liveData) || []).map((x) => x.id));
    const data = {}; for (const k of KINDS) data[k] = await readJson(r.dataPath + k + '.json', []);
    const ignored = new Set((await readJson(r.dataPath + 'ignored.json', [])).map((u) => String(u).toLowerCase()));
    const known = new Set(); KINDS.forEach((k) => data[k].forEach((x) => known.add(String(x['UUID Themeparks.wiki'] || '').toLowerCase())));
    const allowNoLive = new Set(cfg.add_without_live || []);
    const parkOf = {}; (r.parks || []).forEach((p) => { parkOf[p.themeparksParkId] = p.value; });
    let skipped = 0; const rows = [];
    for (const c of children.children || []) {
      const kind = TP_KIND[c.entityType]; if (!kind) continue;
      const id = String(c.id).toLowerCase();
      if (known.has(id) || ignored.has(id)) continue;
      if (!liveSet.has(c.id) && !allowNoLive.has(kind)) continue;
      const park = parkOf[c.parentId];
      if (!park) { skipped++; continue; }
      const loc = c.location || {};
      rows.push({ id: c.id, uuid: id, code: c.externalId || ('api-' + id.slice(0, 8)), api: c.name || '', kind, park, lat: loc.latitude ?? '', lng: loc.longitude ?? '', live: liveSet.has(c.id), nom: c.name || '', land: '', type: '', height: '', menu: '', selected: true, rec: null });
    }
    rows.sort((a, b) => a.kind.localeCompare(b.kind) || a.api.localeCompare(b.api));
    S.rows = rows; S.skippedPark = skipped; S.knownCount = known.size; S.checked = true;
    S.urls = { attractions: '', shows: '', restaurants: '' };
  } catch (e) { S.checkErr = 'Vérification impossible : ' + e.message; }
  S.busy.check = false; render();
}

async function doEnrich() {
  if (needToken()) return;
  const r = resortById(S.park);
  S.busy.enrich = true; S.fetchMsg = 'Lancement de la synchronisation…'; S.run = { status: 'queued' }; render();
  const since = Date.now() - 5000;
  try {
    const inputs = { resort: r.id, list_attractions: S.urls.attractions.trim(), list_shows: S.urls.shows.trim(), list_restaurants: S.urls.restaurants.trim() };
    await gh(`/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, { method: 'POST', body: { ref: BRANCH, inputs } });
    await pollRun(since, r.id);
  } catch (e) { S.fetchMsg = 'Échec : ' + e.message; S.run = null; }
  S.busy.enrich = false; render();
}
async function watchRun(since, resortId, report) {
  let run = null;
  for (let i = 0; i < 160 && S.park === resortId; i++) {
    await sleep(i === 0 ? 6000 : 15000);
    const list = await gh(`/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=5`);
    run = (list.workflow_runs || []).filter((x) => new Date(x.created_at).getTime() >= since).sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
    if (run) {
      report({ id: run.id, status: run.status, conclusion: run.conclusion, url: run.html_url }, run.status === 'completed' ? '' : (run.status === 'queued' ? 'En file d’attente chez GitHub…' : 'Lecture des pages du site en cours…'));
      if (run.status === 'completed') return run;
    }
  }
  return null;
}
async function pollRun(since, resortId) {
  let run = null;
  for (let i = 0; i < 160 && S.park === resortId; i++) {
    await sleep(i === 0 ? 6000 : 15000);
    const list = await gh(`/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=5`);
    run = (list.workflow_runs || []).filter((x) => new Date(x.created_at).getTime() >= since).sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
    if (run) {
      S.run = { id: run.id, status: run.status, conclusion: run.conclusion, url: run.html_url };
      S.fetchMsg = run.status === 'completed' ? '' : (run.status === 'queued' ? 'En file d’attente chez GitHub…' : 'Lecture des fiches du site en cours…');
      render();
      if (run.status === 'completed') break;
    }
  }
  if (!run || run.status !== 'completed') { S.fetchMsg = 'La synchronisation est toujours en cours chez GitHub. Réessayez « Récupérer les informations » dans quelques minutes.'; return; }
  if (run.conclusion !== 'success') { S.fetchMsg = 'La synchronisation a échoué. Ouvrez l’exécution pour voir le détail.'; return; }
  await applyBranch(since, resortId);
}
async function applyBranch(since, resortId) {
  const r = resortById(resortId);
  let b = null; try { b = await gh(`/repos/${REPO}/branches/${encodeURIComponent(SYNC_BRANCH)}`); } catch (e) { /* absente */ }
  const when = b ? new Date(b.commit.commit.committer.date).getTime() : 0;
  if (!b || when < since) { S.enriched = true; S.fetchMsg = 'La synchronisation n’a trouvé aucune fiche à enrichir : les noms de l’API sont conservés, complétez à la main.'; S.run = null; return; }
  let hit = 0;
  for (const k of KINDS) {
    const list = await readJson(r.dataPath + k + '.json', [], SYNC_BRANCH);
    const by = {}; list.forEach((x) => { by[String(x['UUID Themeparks.wiki'] || '').toLowerCase()] = x; });
    S.rows.forEach((row) => {
      const rec = row.kind === k ? by[row.uuid] : null; if (!rec) return;
      row.rec = rec; hit++;
      row.nom = rec.Nom || row.nom; row.land = rec.Land || ''; row.type = rec.Type || ''; row.height = rec['Taille mini'] || ''; row.menu = rec.Menu || '';
    });
  }
  S.enriched = true; S.run = null;
  S.fetchMsg = `Terminé : ${hit} lieu${hit > 1 ? 'x' : ''} enrichi${hit > 1 ? 's' : ''} depuis le site, ${S.rows.length - hit} sans fiche trouvée (à compléter).`;
}

function buildRecord(x, existingCodes) {
  const rec = {};
  const base = Object.assign({}, x.rec || {});
  base.Code = base.Code || x.code; base['UUID Themeparks.wiki'] = x.uuid;
  base.Nom = x.nom || x.api; base.Parc = base.Parc || x.park;
  if (x.land) base.Land = x.land; else delete base.Land;
  if (x.type) base.Type = x.type; else delete base.Type;
  if (x.kind === 'attractions') { if (x.height) base['Taille mini'] = x.height; else delete base['Taille mini']; }
  if (x.kind === 'restaurants') { if (x.menu) base.Menu = x.menu; else delete base.Menu; }
  if (base['Coordonnées GPS (lat)'] == null && x.lat !== '') base['Coordonnées GPS (lat)'] = x.lat;
  if (base['Coordonnées GPS (lng)'] == null && x.lng !== '') base['Coordonnées GPS (lng)'] = x.lng;
  if (!x.live) base['Statut inconnu'] = 'oui';
  let code = String(base.Code), n = 2; while (existingCodes.has(code)) code = base.Code + '-' + n++;
  base.Code = code; existingCodes.add(code);
  ORDER[x.kind].forEach((k) => { if (base[k] !== undefined && base[k] !== null && base[k] !== '') rec[k] = base[k]; });
  return rec;
}
async function doValidate() {
  const r = resortById(S.park); const chosen = S.rows.filter((x) => x.selected);

      items.forEach((x) => cur.push(buildRecord(x, codes)));

async function doIgnore() {

async function loadDeployExtras() {
  try { S.prs = await gh(`/repos/${REPO}/pulls?state=open&per_page=10`); } catch (e) { S.prs = []; }
  try { S.history = await gh(`/repos/${REPO}/commits?sha=${BRANCH}&per_page=8`); } catch (e) { S.history = []; }
  if (S.view === 'deploy') render();
}
async function doPublish() {
  if (needToken()) return;
  const files = Object.values(S.pending); if (!files.length) return;
  S.busy.pub = true; S.pub = { step: 0, err: '' }; render();
  try {
    // refuse d'écraser un fichier modifié entre-temps sur main
    for (const f of files) {
      const now = await readFile(f.path);
      if ((now ?? null) !== (f.orig ?? null)) throw new Error(`« ${f.path} » a changé sur GitHub depuis la préparation. Annulez les modifications et refaites la vérification.`);
    }
    const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`); const head = ref.object.sha;
    const commit = await gh(`/repos/${REPO}/git/commits/${head}`);
    const tree = await gh(`/repos/${REPO}/git/trees`, { method: 'POST', body: { base_tree: commit.tree.sha, tree: files.map((f) => ({ path: f.path, mode: '100644', type: 'blob', content: f.content })) } });
    const msg = (S.msg || 'Mise à jour des données').trim();
    const nc = await gh(`/repos/${REPO}/git/commits`, { method: 'POST', body: { message: msg, tree: tree.sha, parents: [head] } });
    if (S.mode === 'direct') {
      await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: { sha: nc.sha } });
      S.pub = { step: 1, err: '', url: `https://github.com/${REPO}/commit/${nc.sha}` }; render();
      await waitPages(nc.sha);
    } else {
      const branch = 'admin/maj-' + new Date().toISOString().replace(/[-:T]/g, '').slice(0, 12);
      await gh(`/repos/${REPO}/git/refs`, { method: 'POST', body: { ref: 'refs/heads/' + branch, sha: nc.sha } });
      const pr = await gh(`/repos/${REPO}/pulls`, { method: 'POST', body: { title: msg, head: branch, base: BRANCH, body: 'Modifications préparées depuis la page d’administration.\n\n' + files.map((f) => `- \`${f.path}\` : ${f.note}`).join('\n') } });
      S.pub = { step: 2, err: '', url: pr.html_url };
    }
    S.pending = {}; savePending(); S.msg = '';
    loadDeployExtras();
  } catch (e) { S.pub = { step: S.pub ? S.pub.step : 0, err: e.message }; }
  S.busy.pub = false; render();
}
async function waitPages(sha) {
  for (let i = 0; i < 24; i++) {
    await sleep(5000);
    try { const b = await gh(`/repos/${REPO}/pages/builds/latest`); if (b.status === 'built') { S.pub.step = 3; render(); return; } if (b.status === 'errored') { S.pub.err = 'La construction du site a échoué côté GitHub Pages.'; render(); return; } }
    catch (e) { S.pub.step = 3; render(); return; }
    S.pub.step = 1; render();
  }
  S.pub.step = 3;
}

    return;
  }
  const a = t.dataset.act; if (!a) return;
  if (a === 'setup') setupWith($('#g-tok').value.trim(), $('#g-pw').value, $('#g-pw2').value);
  else if (a === 'unlock') unlockWith($('#g-pw').value);
  else if (a === 'forget') { if (confirm('Supprimer le jeton chiffré enregistré sur cet appareil ?')) forgetDevice(); }
  else if (a === 'lock') lock();
  else if (a === 'check') doCheck();
  else if (a === 'cands') doCands();
  else if (a === 'addcands') doAddCands();
  else if (a === 'enrich') doEnrich();
  else if (a === 'validate') doValidate();
  else if (a === 'ignore') doIgnore();
  else if (a === 'testlinks') testLinks();
  else if (a === 'createpark') createPark();
  else if (a === 'publish') doPublish();
  else if (a === 'discard') { S.pending = {}; savePending(); S.pub = null; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !S.unlocked && e.target.tagName === 'INPUT') { const b = document.querySelector('[data-act=setup],[data-act=unlock]'); if (b && !b.disabled) b.click(); }
  if (S.unlocked) armIdle();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.row !== undefined && t.dataset.f !== 'selected') { S.rows[+t.dataset.row][t.dataset.f] = t.value; }
  else if (t.dataset.cand !== undefined && t.dataset.f !== 'selected' && t.dataset.f !== 'kind' && t.dataset.f !== 'park') S.cands[+t.dataset.cand][t.dataset.f] = t.value;
  else if (t.dataset.url) S.urls[t.dataset.url] = t.value;
  else if (t.dataset.np) {
    S.np[t.dataset.np] = t.value;
    if (t.dataset.np === 'name' && !S.np.idTouched) { S.np.id = slug(t.value); const idEl = $('#np-id'); if (idEl) idEl.value = S.np.id; }
    if (t.dataset.np === 'id') S.np.idTouched = true;
    S.npTest = null;
  }
  else if (t.dataset.msg !== undefined) S.msg = t.value;
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.row !== undefined && t.dataset.f === 'selected') { S.rows[+t.dataset.row].selected = t.checked; render(); }
  else if (t.dataset.cand !== undefined) { const c = S.cands[+t.dataset.cand]; c[t.dataset.f] = t.dataset.f === 'selected' ? t.checked : t.value; if (t.dataset.f === 'selected' || t.dataset.f === 'kind') render(); }
  else if (t.name === 'mode') { S.mode = t.value; render(); }
});

(function init() {
  // anciennes versions : jeton en clair supprimé
  store.del('tpc_admin_token');
  render();
})();
</script>
</body>
