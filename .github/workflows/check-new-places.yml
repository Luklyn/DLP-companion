name: Vérification hebdo des nouveaux lieux
on:
  schedule:
    - cron: '0 6 * * 1'   # chaque lundi, 6h UTC
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests openpyxl
      - id: run
        run: python tools/check_new_places.py
      - if: steps.run.outputs.xlsx != ''
        uses: actions/upload-artifact@v4
        with:
          name: nouveautes
          path: tools/output/*.xlsx
          retention-days: 60
      - if: steps.run.outputs.xlsx != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Nouveaux lieux détectés ($(date +%F))" \
            --body "L'API a de nouveaux lieux. Télécharge le tableau dans les artefacts : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
