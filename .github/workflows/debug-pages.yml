name: Diagnostic pages
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses séparées par des espaces"
        type: string
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install -r tools/importer/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - run: python tools/debug_pages.py ${{ inputs.urls }}
      - run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B debug/pages; git add -f debug-pages; git commit -qm "debug pages"; git push -f origin debug/pages
