name: Images Alton Towers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/alton-towers-resort/image-sources.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests Pillow
      - run: python tools/fetch_images.py alton-towers-resort
      - name: Commit des images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/alton-towers-resort
          git diff --cached --quiet || (git commit -m "Alton Towers : images téléchargées et converties en WebP" && git push)
