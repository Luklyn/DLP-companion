<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#1B3A9E">
    <meta name="description" content="Temps d'attente, restaurants et spectacles de Disneyland Paris en temps réel.">
    <title>DLP Companion</title>

    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DLP Companion">

    <script>
        // Appliquer le thème avant le premier rendu (évite le flash blanc en mode sombre)
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
            } catch (e) { /* stockage indisponible : thème par défaut */ }
        })();
    </script>

    <style>
        /* ==========================================================================
           1. Design tokens
           ========================================================================== */
        :root {
            color-scheme: light;
            /* Palette Disney : bleu royal, violet château, blanc */
            --primary: #2347C5;
            --on-primary: #FFFFFF;
            --purple: #6A35B5;
            --grad-brand: linear-gradient(135deg, #1B3A9E 0%, #3F2FA3 55%, #6A35B5 100%);
            --on-brand: #FFFFFF;

            --bg-base: #F4F4FB;
            --bg-surface: #FFFFFF;
            --text-main: #1B1D3A;
            --text-muted: #5F6178;
            --border: #E3E3F0;

            --green: #34C759;
            --orange: #FF9500;
            --red: #FF3B30;
            /* Variantes pour le texte : contraste AA sur fond clair */
            --green-text: #1E8E3E;
            --orange-text: #B25E00;
            --red-text: #D70015;

            --shadow: 0 4px 14px rgb(30 30 90 / 0.07);
            --shadow-brand: 0 6px 20px rgb(35 40 130 / 0.28);
            --radius: 16px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --primary: #8FB4FF;
            --on-primary: #0C1230;
            --purple: #B79CFF;
            --grad-brand: linear-gradient(135deg, #16256F 0%, #2E2584 55%, #4B2A94 100%);
            --bg-base: #0C1230;
            --bg-surface: #1A2150;
            --text-main: #F2F3FF;
            --text-muted: #9AA7D6;
            --border: #2B3470;
            --green-text: #34C759;
            --orange-text: #FF9F0A;
            --red-text: #FF6961;
            --shadow: 0 4px 14px rgb(0 0 0 / 0.4);
            --shadow-brand: 0 6px 20px rgb(0 0 0 / 0.5);
        }

        /* ==========================================================================
           2. Base
           ========================================================================== */
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: var(--font);
            background-color: var(--bg-base);
            color: var(--text-main);
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            transition: background-color .3s ease, color .3s ease;
        }

        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; }
        ul { list-style: none; margin: 0; padding: 0; }
        h1, h2 { margin: 0; }

        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        .icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor;
                stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        /* ==========================================================================
           3. Colonne gauche : en-tête, filtres, liste, navigation
           ========================================================================== */
        .master-pane {
            display: flex; flex-direction: column;
            width: 380px; min-width: 0;
            background-color: var(--bg-base);
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .header {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: calc(14px + var(--safe-top)) 14px 14px 20px;
            background: var(--grad-brand); color: var(--on-brand);
            box-shadow: var(--shadow-brand);
        }
        .header h1 { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; letter-spacing: -0.2px; }
        .brand-icon { fill: currentColor; stroke: none; opacity: .95; }
        .header-actions { display: flex; align-items: center; gap: 4px; }

        .sync {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 600; white-space: nowrap;
            background: rgb(255 255 255 / .16); color: var(--on-brand);
        }
        .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .8; }
        .sync[data-state="live"] .dot  { background: #5EE08A; opacity: 1; }
        .sync[data-state="error"] .dot { background: #FF8A80; opacity: 1; }

        .btn-icon {
            display: inline-grid; place-items: center;
            width: 36px; height: 36px; padding: 0;
            background: none; border: 0; border-radius: 10px;
            color: var(--on-brand); font-size: 20px;
        }
        .btn-icon:hover { background: rgb(255 255 255 / .16); }
        .btn-icon:disabled { cursor: default; opacity: .6; }
        .header :focus-visible { outline-color: #fff; }
        .is-spinning .icon { animation: spin .9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Filtres */
        .filters {
            display: grid; gap: 12px;
            padding: 14px 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }
        .field {
            width: 100%; padding: 11px 12px;
            border: 1px solid var(--border); border-radius: 10px;
            background-color: var(--bg-base); font-size: 15px; outline: none;
        }
        .field:focus-visible { border-color: var(--primary); outline: 2px solid var(--primary); outline-offset: 0; }
        .park-select {
            font-weight: 700; appearance: none; -webkit-appearance: none; padding-right: 36px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238E8E93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 14px top 50%; background-size: 10px auto;
        }
        .park-select:disabled { opacity: .5; cursor: not-allowed; }
        .search { position: relative; display: block; }
        .search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .search .field { padding-left: 38px; }

        .toggles-row { display: flex; justify-content: space-between; gap: 16px; }
        .toggle-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); }

        /* Interrupteur de type iOS */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex: none; }
        .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
        .slider { position: absolute; inset: 0; background-color: var(--border); border-radius: 24px; transition: background-color .25s; pointer-events: none; }
        .slider::before {
            content: ""; position: absolute; left: 3px; bottom: 3px; width: 18px; height: 18px;
            background: #fff; border-radius: 50%; transition: transform .25s;
        }
        .switch input:checked + .slider { background-color: var(--primary); }
        .switch input:checked + .slider::before { transform: translateX(20px); }
        .switch input:focus-visible + .slider { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* Liste */
        .list-container { position: relative; flex: 1; overflow-y: auto; padding: 4px 16px 16px; overscroll-behavior: contain; }
        .group-header { margin: 20px 4px 8px; font-size: 13px; font-weight: 700; color: var(--purple); letter-spacing: .2px; }

        .card {
            display: block; width: 100%; margin-bottom: 12px; padding: 14px 16px; text-align: left;
            background: var(--bg-surface); border: 2px solid transparent; border-radius: var(--radius);
            box-shadow: var(--shadow); transition: border-color .15s ease;
        }
        .card:hover, .card.selected { border-color: var(--primary); }
        .card > span { display: block; }
        .card-head { display: flex !important; justify-content: space-between; align-items: baseline; gap: 8px; }
        .card-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
        .card-dist { font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
        .card-meta { margin-top: 2px; font-size: 13px; color: var(--text-muted); }

        /* Statuts (partagés entre la liste et le détail) */
        .status:empty { display: none; }
        .wait { display: block; margin-top: 8px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .wait .unit { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .wait.is-low { color: var(--green-text); }
        .wait.is-medium { color: var(--orange-text); }
        .wait.is-high { color: var(--red-text); }
        .wait-single { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--primary); }
        .showtimes { display: block; margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--primary); }
        .pill { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .pill.is-open    { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green-text); }
        .pill.is-down    { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange-text); }
        .pill.is-closed  { background: color-mix(in srgb, var(--red) 14%, transparent);   color: var(--red-text); }
        .pill.is-missing { background: var(--border); color: var(--text-muted); }

        /* Squelettes de chargement */
        .skeleton { height: 92px; margin-bottom: 12px; border-radius: var(--radius); background: var(--bg-surface); opacity: .7; animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .35; } }

        .empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-weight: 500; line-height: 1.5; }

        /* Navigation basse */
        .bottom-nav {
            position: relative; z-index: 2;
            display: flex; gap: 4px;
            padding: 8px 10px calc(8px + var(--safe-bottom));
            background: var(--grad-brand);
            box-shadow: 0 -6px 20px rgb(35 40 130 / .22);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            padding: 8px 0; background: none; border: 0; border-radius: 14px;
            color: rgb(255 255 255 / .72); font-size: 12px; font-weight: 600;
            transition: background-color .2s, color .2s;
        }
        .nav-item .icon { width: 24px; height: 24px; }
        .nav-item:hover { color: #fff; }
        .nav-item:focus-visible { outline-color: #fff; }
        .nav-item[aria-selected="true"] { background: rgb(255 255 255 / .18); color: #fff; }

        /* ==========================================================================
           4. Colonne droite : détail
           ========================================================================== */
        .detail-pane {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 40px; overflow-y: auto;
            background-color: var(--bg-surface);
        }
        .detail-placeholder { margin-top: 30vh; color: var(--text-muted); font-size: 16px; font-weight: 500; }
        .detail-content { width: 100%; max-width: 700px; }
        .detail-image {
            display: block; width: 100%; aspect-ratio: 16 / 9; margin-bottom: 24px;
            object-fit: cover; border-radius: 20px; background-color: var(--bg-base); box-shadow: var(--shadow);
        }
        .detail-title { margin-bottom: 8px; font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; }
        .detail-status { margin-bottom: 20px; }
        .detail-status .wait { font-size: 28px; }
        .detail-status .pill, .detail-status .wait, .detail-status .showtimes { margin-top: 0; }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .badge { padding: 6px 12px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 600; }
        .badge.is-park { background: color-mix(in srgb, var(--primary) 12%, var(--bg-base)); border-color: color-mix(in srgb, var(--primary) 30%, var(--border)); color: var(--primary); }
        .badge.is-land { background: color-mix(in srgb, var(--purple) 12%, var(--bg-base)); border-color: color-mix(in srgb, var(--purple) 30%, var(--border)); color: var(--purple); }
        .badge.is-warning { border-color: color-mix(in srgb, var(--red) 40%, var(--border)); color: var(--red-text); }
        .detail-desc { max-width: 65ch; font-size: 17px; line-height: 1.6; color: var(--text-muted); }

        .btn-menu {
            display: block; margin-top: 30px; padding: 16px; text-align: center; text-decoration: none;
            background: var(--grad-brand); color: #fff; border-radius: 12px; font-weight: 700; font-size: 16px;
            box-shadow: var(--shadow-brand); transition: opacity .2s;
        }
        .btn-menu:hover { opacity: .85; }

        .btn-back {
            display: none; align-items: center; gap: 6px; width: 100%; margin-bottom: 12px; padding: 10px 0;
            background: none; border: 0; text-align: left; color: var(--primary); font-size: 17px; font-weight: 600;
        }

        /* Alertes */
        .alert-box { margin: 0 0 24px; padding: 16px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 14px; }
        .alert-box.is-active { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
        .alert-box .field { background-color: var(--bg-surface); }
        .alert-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 15px; font-weight: 800; }
        .alert-box.is-active .alert-title .icon { color: var(--primary); }
        .alert-label { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .alert-control { display: flex; align-items: center; gap: 10px; }
        .alert-field { width: 96px; font-weight: 700; text-align: center; }
        .alert-unit { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .alert-info { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--text-muted); }
        .alert-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .btn-alert { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-size: 14px; font-weight: 700; transition: opacity .2s; }
        .btn-alert:hover { opacity: .88; }
        .btn-alert.is-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .card-bell { width: .85em; height: .85em; margin-left: 6px; color: var(--primary); vertical-align: -1px; }

        /* Message temporaire (erreurs de géolocalisation, etc.) */
        .toast {
            position: fixed; left: 50%; bottom: calc(88px + var(--safe-bottom)); z-index: 200;
            max-width: min(90vw, 420px); padding: 10px 16px; border-radius: 12px;
            background: var(--text-main); color: var(--bg-base); font-size: 14px; font-weight: 600; text-align: center;
            transform: translate(-50%, 8px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ==========================================================================
           5. Responsive
           ========================================================================== */
        @media (max-width: 768px) {
            .master-pane { width: 100%; border-right: 0; }
            .detail-pane { display: none; }
            .detail-pane.is-open {
                display: flex; position: fixed; inset: 0; z-index: 100;
                padding: calc(12px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
                animation: slide-in .25s ease-out;
            }
            .btn-back { display: flex; }
            .detail-image { border-radius: 16px; }
            .detail-title { font-size: 26px; }
            .detail-content { padding-bottom: 40px; }
        }
        @media (max-width: 420px) {
            .header { padding-left: 16px; }
            .header h1 { font-size: 18px; }
            .brand-icon { display: none; }
            .sync { padding: 4px 8px; }
        }
        @keyframes slide-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <!-- Icônes (sprite SVG) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-attraction" viewBox="0 0 24 24"><circle cx="12" cy="10" r="7"/><circle cx="12" cy="10" r="1.5"/><path d="M12 3v14M5 10h14M7 5l10 10M17 5L7 15M8 21l4-4 4 4"/></symbol>
        <symbol id="i-restaurant" viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M17 21V3c-2 1-3.5 3.5-3.5 7 0 2 1 3 3.5 3"/></symbol>
        <symbol id="i-show" viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.8 4.2L17.6 20 12 16.8 6.4 20l1.4-6.2L3 9.6 9.4 9z"/></symbol>
        <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
        <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
    </svg>

    <div class="master-pane">
        <header class="header">
            <h1><svg class="icon brand-icon" aria-hidden="true"><use href="#i-sparkle"/></svg>DLP Companion</h1>
            <div class="header-actions">
                <span id="sync-status" class="sync" data-state="loading" role="status">
                    <span class="dot" aria-hidden="true"></span>
                    <span id="sync-label">Synchronisation…</span>
                </span>
                <button id="btn-refresh" class="btn-icon" type="button" aria-label="Actualiser les données">
                    <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
                </button>
                <button id="btn-theme" class="btn-icon" type="button" aria-label="Changer de thème">
                    <svg class="icon" aria-hidden="true"><use href="#i-theme"/></svg>
                </button>
            </div>
        </header>

        <section class="filters" aria-label="Filtres">
            <select id="park-select" class="field park-select" aria-label="Parc"></select>

            <label class="search">
                <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
                <input id="search" class="field" type="search" placeholder="Rechercher un lieu" autocomplete="off" enterkeyhint="search">
            </label>

            <div class="toggles-row">
                <label class="toggle-group">
                    <span class="switch">
                        <input type="checkbox" id="toggle-closed" role="switch">
                        <span class="slider"></span>
                    </span>
                    Lieux fermés
                </label>
                <label class="toggle-group">
                    <span class="switch">
                        <input type="checkbox" id="toggle-nearby" role="switch">
                        <span class="slider"></span>
                    </span>
                    Autour de moi
                </label>
            </div>
        </section>

        <div id="list" class="list-container" role="tabpanel" aria-live="polite"></div>

        <div class="bottom-nav" role="tablist" aria-label="Catégories">
            <button class="nav-item" type="button" role="tab" data-tab="attraction" aria-selected="true">
                <svg class="icon" aria-hidden="true"><use href="#i-attraction"/></svg><span>Attractions</span>
            </button>
            <button class="nav-item" type="button" role="tab" data-tab="restaurant" aria-selected="false">
                <svg class="icon" aria-hidden="true"><use href="#i-restaurant"/></svg><span>Restaurants</span>
            </button>
            <button class="nav-item" type="button" role="tab" data-tab="spectacle" aria-selected="false">
                <svg class="icon" aria-hidden="true"><use href="#i-show"/></svg><span>Spectacles</span>
            </button>
        </div>
    </div>

    <main id="detail-pane" class="detail-pane">
        <p id="detail-placeholder" class="detail-placeholder">Sélectionnez un lieu pour afficher les détails</p>

        <article id="detail-content" class="detail-content" hidden>
            <button id="btn-back" class="btn-back" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
                Retour
            </button>
            <img id="d-image" class="detail-image" src="" alt="" decoding="async">
            <h2 id="d-title" class="detail-title"></h2>
            <div id="d-status" class="detail-status status"></div>
            <ul id="d-badges" class="badges"></ul>

            <section id="d-alert" class="alert-box" hidden aria-labelledby="alert-heading">
                <h3 id="alert-title" class="alert-title">
                    <svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>
                    <span id="alert-heading"></span>
                </h3>
                <p id="alert-label" class="alert-label"></p>

            const now = Date.now();
            let changed = false;
            for (const [id, a] of alerts) {
                const item = dbById.get(id);
                if (!item?.live) continue;
                changed = (a.kind === 'wait' ? checkWaitAlert(item, a) : checkShowAlert(item, a, now)) || changed;
            }
            if (changed) saveAlerts();
            return changed;
        }

        /* --- Interface de l'alerte dans la fiche détail --- */
        let alertUiFor = null;   // id de la fiche dont les champs ont été initialisés

        function suggestThreshold(item) {
            const wait = item.live?.wait;
            return wait == null ? 30 : Math.max(5, Math.round((wait * 0.7) / 5) * 5);
        }

        function alertInfo(item, a) {
            const now = Date.now();
            if (item.category === 'attraction') {
                const current = item.live?.status === 'OPERATING' && item.live.wait != null
                    ? `Attente actuelle : ${item.live.wait} min.` : 'Attraction actuellement indisponible.';
                if (!a) return `${current} Vous serez prévenu dès que l’attente passe sous le seuil choisi.`;
                if (a.armed) return `Alerte active : notification dès que l’attente est de ${a.threshold} min ou moins. ${current}`;
                return `Notification envoyée à ${timeFormat.format(a.firedAt)} (${a.firedWait} min). ` +
                       `L’alerte se réarme si l’attente repasse au-dessus de ${a.threshold} min.`;
            }
            const sessions = futureSessions(item, now);
            if (!a) {
                return sessions.length
                    ? `Prochaine séance : ${timeFormat.format(sessions[0].start)}. Vous serez prévenu avant chaque séance.`
                    : 'Aucune séance à venir aujourd’hui.';
            }
            const pending = sessions.find((s) => !a.done.includes(s.key));
            if (pending) {
                return `Prochaine alerte à ${timeFormat.format(pending.start - a.lead * 60_000)} ` +
                       `pour la séance de ${timeFormat.format(pending.start)}.`;
            }
            return sessions.length
                ? `Alerte envoyée pour la séance de ${timeFormat.format(sessions[0].start)}.`
                : 'Plus de séance aujourd’hui : l’alerte reprendra à la prochaine séance.';
        }

        function renderAlertBox(item) {
            const supported = item.category === 'attraction' || item.category === 'spectacle';
            els.alertBox.hidden = !supported;
            if (!supported) return;

            const isWait = item.category === 'attraction';
            const a = alerts.get(item.id);

            els.alertHeading.textContent = isWait ? 'Alerte temps d’attente' : 'Alerte avant la séance';
            els.alertLabel.textContent = isWait
                ? 'Me prévenir dès que l’attente est inférieure ou égale à'
                : 'Me prévenir avant chaque séance, à l’avance de';
            els.alertNum.hidden = !isWait;
            els.alertLead.hidden = isWait;
            els.alertUnit.textContent = isWait ? 'min' : 'min avant le début';

            if (alertUiFor !== item.id) {   // n'écrase pas une saisie en cours lors des actualisations
                alertUiFor = item.id;
                if (isWait) els.alertNum.value = a?.threshold ?? suggestThreshold(item);
                else els.alertLead.value = String(a?.lead ?? 45);
            }

            els.alertBox.classList.toggle('is-active', Boolean(a));
            els.alertSave.textContent = a ? 'Mettre à jour' : 'Activer l’alerte';
            els.alertRemove.hidden = !a;
            els.alertInfo.textContent = alertInfo(item, a);
        }

        async function onAlertSave() {
            const item = selectedItem();
            if (!item) return;
            const isWait = item.category === 'attraction';

            let threshold = null;
            let lead = null;
            if (isWait) {
                threshold = Number.parseInt(els.alertNum.value, 10);
                if (!Number.isFinite(threshold) || threshold < 5 || threshold > 180) {
                    return notify('Saisissez un seuil entre 5 et 180 minutes.');
                }
            } else {
                lead = Number.parseInt(els.alertLead.value, 10);
            }

            if (!(await ensureNotifications())) return;

            const now = Date.now();
            if (isWait) {
                alerts.set(item.id, {
                    kind: 'wait', threshold,
                    armed: !isBelow(item.live, threshold),   // déjà sous le seuil : on attend la prochaine remontée
                    firedAt: null, firedWait: null,
                });
            } else {
                alerts.set(item.id, {   // les séances déjà dans la fenêtre d'alerte ne déclenchent rien
                    kind: 'show', lead,
                    done: futureSessions(item, now).filter((s) => s.start - now <= lead * 60_000).map((s) => s.key),
                });
            }
            
            // On attend la sauvegarde avant de confirmer à l'utilisateur
            if (!(await saveAlerts())) {
                alerts.delete(item.id);
            } else {
                notify(isWait ? `Alerte activée : ${item.name} ≤ ${threshold} min` : `Alerte activée : ${lead} min avant chaque séance`);
            }

            renderList();
            renderAlertBox(item);
        }

        async function onAlertRemove() {
            const item = selectedItem();
            if (!item || !alerts.delete(item.id)) return;
            
            await saveAlerts();
            
            notify('Alerte supprimée');
            renderList();
            renderAlertBox(item);
        }

        // Ouvre la fiche d'un lieu (clic sur une notification)
        function openFromAlert(id) {
            const item = dbById.get(id);
            if (!item) return;
            state.tab = item.category;
            if (CONFIG.PARKS.some((p) => p.value === item.park)) state.park = item.park;
            els.park.value = state.park;
            els.tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
            openDetail(id);
        }

        /* ======================================================================
           Rendu de la liste
           ====================================================================== */
        function getVisibleEntries() {
            const query = searchKey(state.query);
            const nearbyActive = state.nearby && state.location;
            const entries = [];

            for (const item of db) {
                if (item.category !== state.tab) continue;
                if (!nearbyActive && item.park !== state.park) continue;   // « Autour de moi » ignore le parc choisi
                if (!state.showClosed && isHiddenByDefault(item)) continue;
                if (query && !searchKey(item.name).includes(query)) continue;

                let dist = null;
                if (nearbyActive) {
                    if (item.lat == null || item.lng == null) continue;
                    dist = distanceKm(state.location.lat, state.location.lng, item.lat, item.lng);
                    if (dist > CONFIG.NEARBY_RADIUS_KM) continue;
                }
                entries.push({ item, dist });
            }
            return entries;
        }

        // Classement des attractions : temps d'attente décroissant, puis en panne, puis fermées
        function waitRank(item) {
            const live = item.live;
            if (live?.status === 'OPERATING') return live.wait ?? 0;
            return live?.status === 'DOWN' ? -1 : -2;
        }

        function compareEntries(a, b) {
            if (a.dist != null && b.dist != null) return a.dist - b.dist;   // distance croissante
            if (state.tab === 'attraction') {
                const diff = waitRank(b.item) - waitRank(a.item);
                if (diff) return diff;
            }
            return a.item.name.localeCompare(b.item.name, CONFIG.LOCALE);
        }

        function cardHtml({ item, dist }) {
            const selected = item.id === state.selectedId;
            return `
                <button type="button" class="card${selected ? ' selected' : ''}" data-id="${esc(item.id)}"${selected ? ' aria-current="true"' : ''}>
                    <span class="card-head">
                        <span class="card-title">${esc(item.name)}${alerts.has(item.id) ? '<svg class="icon card-bell" role="img" aria-label="Alerte active"><use href="#i-bell"/></svg>' : ''}</span>
                        ${dist != null ? `<span class="card-dist">${formatDistance(dist)}</span>` : ''}
                    </span>
                    ${item.type ? `<span class="card-meta">${esc(item.type)}</span>` : ''}
                    <span class="status">${statusHtml(item)}</span>
                </button>`;
        }

        function renderList() {
            if (!state.ready) {
                els.list.innerHTML = '<div class="skeleton"></div>'.repeat(4);
                return;
            }

            const entries = getVisibleEntries();
            if (!entries.length) {
                const hint = state.query
                    ? 'Aucun résultat pour cette recherche.'
                    : state.nearby
                        ? `Aucun lieu dans un rayon de ${Math.round(CONFIG.NEARBY_RADIUS_KM * 1000)} m.`
                        : 'Aucun lieu à afficher selon vos critères.';
                els.list.innerHTML = `<div class="empty">${hint}</div>`;
                return;
            }

            const groups = new Map();
            for (const entry of entries) {
                if (!groups.has(entry.item.land)) groups.set(entry.item.land, []);
                groups.get(entry.item.land).push(entry);
            }

            // Lands par ordre alphabétique ; avec « Autour de moi », du plus proche au plus lointain
            const nearest = (land) => Math.min(...groups.get(land).map((e) => e.dist));
            const lands = [...groups.keys()].sort((a, b) =>
                state.nearby && state.location
                    ? nearest(a) - nearest(b)
                    : a.localeCompare(b, CONFIG.LOCALE));

            els.list.innerHTML = lands
                .map((land) => `
                    <section>
                        <h2 class="group-header">${esc(land)}</h2>
                        ${groups.get(land).sort(compareEntries).map(cardHtml).join('')}
                    </section>`)
                .join('');
        }

        /* ======================================================================
           Détail
           ====================================================================== */
        const selectedItem = () => db.find((item) => item.id === state.selectedId) ?? null;

        function renderDetail() {
            const item = selectedItem();
            els.placeholder.hidden = Boolean(item);
            els.content.hidden = !item;
            if (!item) return;

            els.title.textContent = item.name;
            els.desc.textContent = item.description;
            els.desc.hidden = !item.description;
            els.status.innerHTML = statusHtml(item);

            const image = safeUrl(item.image);
            els.image.hidden = !image;
            els.image.alt = item.name;
            if (image && els.image.getAttribute('src') !== image) els.image.src = image;

            const badges = [
                { text: item.park, kind: 'park' },
                { text: item.land, kind: 'land' },
                { text: item.type },
                item.minHeight && item.minHeight !== 'Pas de restriction'
                    ? { text: `Taille minimale : ${item.minHeight}`, warning: true } : null,
                item.price ? { text: `Tarifs : ${item.price}` } : null,
            ].filter((b) => b && b.text);

            els.badges.innerHTML = badges
                .map((b) => `<li class="badge${b.kind ? ` is-${b.kind}` : ''}${b.warning ? ' is-warning' : ''}">${esc(b.text)}</li>`)
                .join('');

            const menu = safeUrl(item.menuUrl);
            els.menu.hidden = !menu;
            if (menu) els.menu.href = menu;
            renderAlertBox(item);
        }

        function openDetail(id) {
            state.selectedId = id;
            renderList();
            renderDetail();
            els.pane.classList.add('is-open');           // visible uniquement en mobile (cf. CSS)
            els.pane.scrollTop = 0;
            els.btnBack.focus({ preventScroll: true });
        }

        function closeDetail() {
            const previousId = state.selectedId;
            if (previousId == null) return;
            state.selectedId = null;
            alertUiFor = null;
            els.pane.classList.remove('is-open');
            renderList();
            renderDetail();
            els.list.querySelector(`.card[data-id="${CSS.escape(previousId)}"]`)?.focus({ preventScroll: true });
        }

        function render() {
            renderList();
            renderDetail();
        }

        /* ======================================================================
           Interactions
           ====================================================================== */
        let toastTimer;
        function notify(message) {
            els.toast.textContent = message;
            els.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('show'), 4000);
        }

        function setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').content = THEME_COLORS[theme];
            try { localStorage.setItem('theme', theme); } catch { /* stockage indisponible */ }
        }

        /* « Autour de moi » : position suivie en continu pour garder les distances à jour */
        function setNearbyUi(active) {
            state.nearby = active;
            els.park.disabled = active;
            els.park.title = active ? '« Autour de moi » couvre les deux parcs' : '';
        }

        function stopNearby() {
            if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
            state.watchId = null;
            state.location = null;
            setNearbyUi(false);
        }

        function onPosition({ coords }) {
            const previous = state.location;
            state.location = { lat: coords.latitude, lng: coords.longitude };

            const firstFix = !state.nearby;
            if (firstFix) setNearbyUi(true);
            const moved = !previous ||
                distanceKm(previous.lat, previous.lng, state.location.lat, state.location.lng) > 0.015;
            if (firstFix || moved) renderList();
        }

        function onPositionError(error) {
            if (state.nearby && error.code === 3) return;   // délai dépassé : on garde la dernière position
            stopNearby();
            els.toggleNearby.checked = false;
            notify('Autorisez la géolocalisation pour afficher les lieux proches.');
            renderList();
        }

        function onNearbyChange() {
            if (!els.toggleNearby.checked) {
                stopNearby();
                return renderList();
            }
            if (!('geolocation' in navigator)) {
                els.toggleNearby.checked = false;
                return notify('La géolocalisation n’est pas disponible sur cet appareil.');
            }
            state.watchId = navigator.geolocation.watchPosition(onPosition, onPositionError,
                { enableHighAccuracy: true, timeout: 20_000, maximumAge: 15_000 });
        }

        function bindEvents() {
            els.park.innerHTML = CONFIG.PARKS
                .map((p) => `<option value="${esc(p.value)}">${esc(p.label)}</option>`).join('');
            els.park.value = state.park;

            els.park.addEventListener('change', () => { state.park = els.park.value; closeDetail(); renderList(); });
            els.search.addEventListener('input', () => { state.query = els.search.value; renderList(); });
            els.toggleClosed.addEventListener('change', () => { state.showClosed = els.toggleClosed.checked; renderList(); });
            els.toggleNearby.addEventListener('change', onNearbyChange);

            els.tabs.forEach((tab) => tab.addEventListener('click', () => {
                state.tab = tab.dataset.tab;
                els.tabs.forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
                closeDetail();
                renderList();
                els.list.scrollTop = 0;
            }));

            els.list.addEventListener('click', (event) => {
                const card = event.target.closest('.card');
                if (card) openDetail(card.dataset.id);
            });

            els.btnBack.addEventListener('click', closeDetail);
            els.alertSave.addEventListener('click', onAlertSave);
            els.alertRemove.addEventListener('click', onAlertRemove);
            els.image.addEventListener('error', () => { els.image.hidden = true; });
            els.btnRefresh.addEventListener('click', refresh);
            els.btnTheme.addEventListener('click', () =>
                setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

            document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeDetail(); });

            // Actualisation automatique, uniquement quand l'onglet est visible
            // Avec des alertes actives, on continue d'actualiser même onglet masqué
            setInterval(() => { if (!document.hidden || alerts.size) refresh(); }, CONFIG.REFRESH_MS);
            // Les alertes de spectacles dépendent de l'horloge : vérification plus fréquente sur les données en cache
            setInterval(() => { if (checkAlerts()) render(); }, 30_000);
            document.addEventListener('visibilitychange', () => {
                const stale = !state.lastSync || Date.now() - state.lastSync.getTime() > CONFIG.REFRESH_MS / 2;
                if (!document.hidden && stale) refresh();
            });
        }

        /* ======================================================================
           Démarrage
           ====================================================================== */
        function init() {
            document.querySelector('meta[name="theme-color"]').content =
                THEME_COLORS[document.documentElement.dataset.theme] ?? THEME_COLORS.light;

            bindEvents();
            render();     // affiche les squelettes de chargement
            refresh();

            // Ouverture depuis une notification (service worker ou lien #id)
            navigator.serviceWorker?.addEventListener('message', (event) => {
                if (event.data?.type === 'open-item') openFromAlert(event.data.id);
            });
            if (location.hash.length > 1) openFromAlert(decodeURIComponent(location.hash.slice(1)));

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch(() => {});
                });
            }
        }

        init();
    })();
    </script>
</body>
</html>
