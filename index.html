<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#1B3A9E">
    <meta name="description" content="Temps d'attente, restaurants et spectacles de Disneyland Paris en temps réel.">
    <title>DLP Companion</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DLP Companion">

    <script>
        // Appliquer le thème avant le premier rendu (évite le flash blanc en mode sombre)
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
            } catch (e) { /* stockage indisponible : thème par défaut */ }
        })();
    </script>

    <style>
        /* ==========================================================================
           1. Design tokens
           ========================================================================== */
        :root {
            color-scheme: light;
            /* Palette Disney : bleu royal, violet château, blanc */
            --primary: #2347C5;
            --on-primary: #FFFFFF;
            --purple: #6A35B5;
            --grad-brand: linear-gradient(135deg, #1B3A9E 0%, #3F2FA3 55%, #6A35B5 100%);
            --on-brand: #FFFFFF;

            --bg-base: #F4F4FB;
            --bg-surface: #FFFFFF;
            --text-main: #1B1D3A;
            --text-muted: #5F6178;
            --border: #E3E3F0;

            --fav: #E0245E;
            --green: #34C759;
            --orange: #FF9500;
            --red: #FF3B30;
            /* Variantes pour le texte : contraste AA sur fond clair */
            --green-text: #1E8E3E;
            --orange-text: #B25E00;
            --red-text: #D70015;

            --shadow: 0 4px 14px rgb(30 30 90 / 0.07);
            --shadow-brand: 0 6px 20px rgb(35 40 130 / 0.28);
            --radius: 16px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --primary: #8FB4FF;
            --on-primary: #0C1230;
            --purple: #B79CFF;
            --grad-brand: linear-gradient(135deg, #16256F 0%, #2E2584 55%, #4B2A94 100%);
            --bg-base: #0C1230;
            --bg-surface: #1A2150;
            --text-main: #F2F3FF;
            --text-muted: #9AA7D6;
            --border: #2B3470;
            --fav: #FF6B8E;
            --green-text: #34C759;
            --orange-text: #FF9F0A;
            --red-text: #FF6961;
            --shadow: 0 4px 14px rgb(0 0 0 / 0.4);
            --shadow-brand: 0 6px 20px rgb(0 0 0 / 0.5);
        }

        /* ==========================================================================
           2. Base
           ========================================================================== */
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: var(--font);
            background-color: var(--bg-base);
            color: var(--text-main);
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            transition: background-color .3s ease, color .3s ease;
        }

        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; }
        ul { list-style: none; margin: 0; padding: 0; }
        h1, h2 { margin: 0; }

        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        .icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor;
                stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        /* ==========================================================================
           3. Colonne gauche : en-tête, filtres, liste, navigation
           ========================================================================== */
        .master-pane {
            display: flex; flex-direction: column;
            width: 380px; min-width: 0;
            background-color: var(--bg-base);
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .header {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: calc(14px + var(--safe-top)) 14px 14px 20px;
            background: var(--grad-brand); color: var(--on-brand);
            box-shadow: var(--shadow-brand);
        }
        .header h1 { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; letter-spacing: -0.2px; }
        .brand-icon { fill: currentColor; stroke: none; opacity: .95; }
        .header-actions { display: flex; align-items: center; gap: 4px; }

        .sync {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 600; white-space: nowrap;
            background: rgb(255 255 255 / .16); color: var(--on-brand);
        }
        .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .8; }
        .sync[data-state="live"] .dot  { background: #5EE08A; opacity: 1; }
        .sync[data-state="error"] .dot { background: #FF8A80; opacity: 1; }

        .btn-icon {
            display: inline-grid; place-items: center;
            width: 36px; height: 36px; padding: 0;
            background: none; border: 0; border-radius: 10px;
            color: var(--on-brand); font-size: 20px;
        }
        .btn-icon:hover { background: rgb(255 255 255 / .16); }
        .btn-icon:disabled { cursor: default; opacity: .6; }
        .header :focus-visible { outline-color: #fff; }
        .is-spinning .icon { animation: spin .9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Filtres */
        .filters {
            display: grid; gap: 12px;
            padding: 14px 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }
        .field {
            width: 100%; padding: 11px 12px;
            border: 1px solid var(--border); border-radius: 10px;
            background-color: var(--bg-base); font-size: 15px; outline: none;
        }
        .field:focus-visible { border-color: var(--primary); outline: 2px solid var(--primary); outline-offset: 0; }
        .park-select {
            font-weight: 700; appearance: none; -webkit-appearance: none; padding-right: 36px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238E8E93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 14px top 50%; background-size: 10px auto;
        }
        .park-select:disabled { opacity: .5; cursor: not-allowed; }
        .search { position: relative; display: block; }
        .search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .search .field { padding-left: 38px; }

        .toggles-row { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 10px 22px; }
        .toggle-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); }

        /* Bouton « Voir les favoris » */
        .btn-favs {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 10px 14px;
            background: var(--bg-base); border: 1px solid var(--border); border-radius: 10px;
            font-size: 14px; font-weight: 700; color: var(--text-main);
            transition: background-color .2s, border-color .2s, color .2s;
        }
        .btn-favs .icon { color: var(--fav); }
        .btn-favs:hover { border-color: var(--fav); }
        .btn-favs[aria-pressed="true"] { background: color-mix(in srgb, var(--fav) 14%, var(--bg-base)); border-color: var(--fav); color: var(--fav); }
        .btn-favs[aria-pressed="true"] .icon { fill: currentColor; }

        /* Interrupteur de type iOS */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex: none; }
        .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
        .slider { position: absolute; inset: 0; background-color: var(--border); border-radius: 24px; transition: background-color .25s; pointer-events: none; }
        .slider::before {
            content: ""; position: absolute; left: 3px; bottom: 3px; width: 18px; height: 18px;
            background: #fff; border-radius: 50%; transition: transform .25s;
        }
        .switch input:checked + .slider { background-color: var(--primary); }
        .switch input:checked + .slider::before { transform: translateX(20px); }
        .switch input:focus-visible + .slider { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* Liste */
        .list-container { position: relative; flex: 1; overflow-y: auto; padding: 4px 16px 16px; overscroll-behavior: contain; }
        .group-header { margin: 20px 4px 8px; font-size: 13px; font-weight: 700; color: var(--purple); letter-spacing: .2px; }

        .card {
            display: block; width: 100%; margin-bottom: 0; padding: 14px 52px 14px 16px; text-align: left;
            background: var(--bg-surface); border: 2px solid transparent; border-radius: var(--radius);
            box-shadow: var(--shadow); transition: border-color .15s ease;
        }
        .card:hover, .card.selected { border-color: var(--primary); }
        .card-wrap { position: relative; margin-bottom: 12px; }
        .card-fav-btn {
            position: absolute; top: 6px; right: 6px; z-index: 1;
            display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0;
            background: none; border: 0; border-radius: 50%;
            color: var(--text-muted); font-size: 20px; opacity: .75;
            transition: color .2s, background-color .2s, opacity .2s;
        }
        .card-fav-btn:hover { color: var(--fav); background: color-mix(in srgb, var(--fav) 12%, transparent); opacity: 1; }
        .card-fav-btn[aria-pressed="true"] { color: var(--fav); opacity: 1; }
        .card-fav-btn[aria-pressed="true"] .icon { fill: currentColor; }
        .card > span { display: block; }
        .card-head { display: flex !important; justify-content: space-between; align-items: baseline; gap: 8px; }
        .card-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
        .card-dist { font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
        .card-meta { margin-top: 2px; font-size: 13px; color: var(--text-muted); }

        /* Statuts (partagés entre la liste et le détail) */
        .status:empty { display: none; }
        .wait { display: block; margin-top: 8px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .wait .unit { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .wait.is-low { color: var(--green-text); }
        .wait.is-medium { color: var(--orange-text); }
        .wait.is-high { color: var(--red-text); }
        .wait-single { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--primary); }
        .showtimes { display: block; margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--primary); }
        .pill { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .pill.is-open    { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green-text); }
        .pill.is-down    { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange-text); }
        .pill.is-closed  { background: color-mix(in srgb, var(--red) 14%, transparent);   color: var(--red-text); }
        .pill.is-missing { background: var(--border); color: var(--text-muted); }

        /* Squelettes de chargement */
        .skeleton { height: 92px; margin-bottom: 12px; border-radius: var(--radius); background: var(--bg-surface); opacity: .7; animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .35; } }

        .empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-weight: 500; line-height: 1.5; }

        /* Navigation basse */
        .bottom-nav {
            position: relative; z-index: 2;
            display: flex; gap: 4px;
            padding: 8px 10px calc(8px + var(--safe-bottom));
            background: var(--grad-brand);
            box-shadow: 0 -6px 20px rgb(35 40 130 / .22);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            padding: 8px 0; background: none; border: 0; border-radius: 14px;
            color: rgb(255 255 255 / .72); font-size: 12px; font-weight: 600;
            transition: background-color .2s, color .2s;
        }
        .nav-item .icon { width: 24px; height: 24px; }
        .nav-item:hover { color: #fff; }
        .nav-item:focus-visible { outline-color: #fff; }
        .nav-item[aria-selected="true"] { background: rgb(255 255 255 / .18); color: #fff; }

        /* ==========================================================================
           4. Colonne droite : détail
           ========================================================================== */
        .detail-pane {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 40px; overflow-y: auto;
            background-color: var(--bg-surface);
        }
        .detail-placeholder { margin-top: 30vh; color: var(--text-muted); font-size: 16px; font-weight: 500; }
        .detail-content { width: 100%; max-width: 700px; }
        .detail-image {
            display: block; width: 100%; aspect-ratio: 16 / 9; margin-bottom: 24px;
            object-fit: cover; border-radius: 20px; background-color: var(--bg-base); box-shadow: var(--shadow);
        }
        .detail-title { margin-bottom: 8px; font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; }
        .detail-status { margin-bottom: 20px; }
        .detail-status .wait { font-size: 28px; }
        .detail-status .pill, .detail-status .wait, .detail-status .showtimes { margin-top: 0; }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .badge { padding: 6px 12px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 600; }
        .badge.is-park { background: color-mix(in srgb, var(--primary) 12%, var(--bg-base)); border-color: color-mix(in srgb, var(--primary) 30%, var(--border)); color: var(--primary); }
        .badge.is-land { background: color-mix(in srgb, var(--purple) 12%, var(--bg-base)); border-color: color-mix(in srgb, var(--purple) 30%, var(--border)); color: var(--purple); }
        .badge.is-warning { border-color: color-mix(in srgb, var(--red) 40%, var(--border)); color: var(--red-text); }
        .detail-desc { max-width: 65ch; font-size: 17px; line-height: 1.6; color: var(--text-muted); }

        .btn-menu {
            display: block; margin-top: 30px; padding: 16px; text-align: center; text-decoration: none;
            background: var(--grad-brand); color: #fff; border-radius: 12px; font-weight: 700; font-size: 16px;
            box-shadow: var(--shadow-brand); transition: opacity .2s;
        }
        .btn-menu:hover { opacity: .85; }

        .btn-back {
            display: none; align-items: center; gap: 6px; width: 100%; margin-bottom: 12px; padding: 10px 0;
            background: none; border: 0; text-align: left; color: var(--primary); font-size: 17px; font-weight: 600;
        }

        /* Alertes */
        .alert-box { margin: 0 0 24px; padding: 16px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 14px; }
        .alert-box.is-active { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
        .alert-box .field { background-color: var(--bg-surface); }
        .alert-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 15px; font-weight: 800; }
        .alert-box.is-active .alert-title .icon { color: var(--primary); }
        .alert-label { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .alert-control { display: flex; align-items: center; gap: 10px; }
        .alert-field { width: 96px; font-weight: 700; text-align: center; }
        .alert-unit { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .alert-info { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--text-muted); }
        .alert-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .btn-alert { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-size: 14px; font-weight: 700; transition: opacity .2s; }
        .btn-alert:hover { opacity: .88; }
        .btn-alert.is-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .alert-toggle { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .alert-check { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; font-weight: 600; line-height: 1.4; cursor: pointer; }
        .alert-check input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--primary); }
        .card-bell { width: .85em; height: .85em; margin-left: 6px; color: var(--primary); vertical-align: -1px; }

        /* Bouton favori de la fiche détail */
        .detail-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
        .detail-title-row .detail-title { margin-bottom: 0; }
        .btn-fav {
            display: inline-grid; place-items: center; flex: none;
            width: 44px; height: 44px; padding: 0;
            background: var(--bg-base); border: 1px solid var(--border); border-radius: 50%;
            color: var(--text-muted); font-size: 22px;
            transition: color .2s, border-color .2s, background-color .2s;
        }
        .btn-fav:hover { color: var(--fav); border-color: var(--fav); }
        .btn-fav[aria-pressed="true"] { color: var(--fav); border-color: var(--fav); background: color-mix(in srgb, var(--fav) 12%, var(--bg-base)); }
        .btn-fav[aria-pressed="true"] .icon { fill: currentColor; }

        /* Message temporaire (erreurs de géolocalisation, etc.) */
        .toast {
            position: fixed; left: 50%; bottom: calc(88px + var(--safe-bottom)); z-index: 200;
            max-width: min(90vw, 420px); padding: 10px 16px; border-radius: 12px;
            background: var(--text-main); color: var(--bg-base); font-size: 14px; font-weight: 600; text-align: center;
            transform: translate(-50%, 8px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ==========================================================================
           5. Responsive
           ========================================================================== */
        @media (max-width: 768px) {
            .master-pane { width: 100%; border-right: 0; }
            .detail-pane { display: none; }
            .detail-pane.is-open {
                display: flex; position: fixed; inset: 0; z-index: 100;
                padding: calc(12px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
                animation: slide-in .25s ease-out;
            }
            .btn-back { display: flex; }
            .detail-image { border-radius: 16px; }
            .detail-title { font-size: 26px; }
            .detail-content { padding-bottom: 40px; }
        }
        @media (max-width: 420px) {
            .header { padding-left: 16px; }
            .header h1 { font-size: 18px; }
            .brand-icon { display: none; }
            .sync { padding: 4px 8px; }
        }
        @keyframes slide-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <!-- Icônes (sprite SVG) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-attraction" viewBox="0 0 24 24"><circle cx="12" cy="10" r="7"/><circle cx="12" cy="10" r="1.5"/><path d="M12 3v14M5 10h14M7 5l10 10M17 5L7 15M8 21l4-4 4 4"/></symbol>
        <symbol id="i-restaurant" viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M17 21V3c-2 1-3.5 3.5-3.5 7 0 2 1 3 3.5 3"/></symbol>
        <symbol id="i-show" viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.8 4.2L17.6 20 12 16.8 6.4 20l1.4-6.2L3 9.6 9.4 9z"/></symbol>
        <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
        <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-9.5-10C1.6 7.2 3.6 4.2 6.9 4.2c2 0 3.5 1 5.1 2.9 1.6-1.9 3.1-2.9 5.1-2.9 3.3 0 5.3 3 4.4 6.3C20 15.6 12 20.5 12 20.5z"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
    </svg>

    <div class="master-pane">
        <header class="header">
            <h1><svg class="icon brand-icon" aria-hidden="true"><use href="#i-sparkle"/></svg>DLP Companion</h1>
            <div class="header-actions">
