    <noscript>Cette application nécessite JavaScript.</noscript>

    <script>
    (async () => {
        'use strict';

        /* ======================================================================
           Configuration
           ====================================================================== */
        const CONFIG = {
            API_LIVE_URL: 'https://api.themeparks.wiki/v1/entity/e8d0207f-da8a-4048-bec8-117aa946b2c2/live',
            API_HISTORY_URL: (id) => `https://api.themeparks.wiki/v1/entity/${encodeURIComponent(id)}/history`,
            DOWN_RETRY_MS: 300_000,      // nouvel essai si l'heure de panne n'a pas pu être déterminée
            REFRESH_MS: 60_000,          // actualisation automatique
            FETCH_TIMEOUT_MS: 10_000,
            NEARBY_RADIUS_KM: 0.2,       // rayon du filtre « Autour de moi »
            WAIT_THRESHOLDS: { low: 30, medium: 50 },
            LOCALE: 'fr-FR',
            TIMEZONE: 'Europe/Paris',
            PARKS: [
                { value: 'Disneyland Park',        label: 'Parc Disneyland' },
                { value: 'Disney Adventure World', label: 'Adventure World' },
            ],
        };

        const CLOSED_LABELS = { CLOSED: 'Fermé', REFURBISHMENT: 'En réhabilitation' };
        const HIDDEN_BY_DEFAULT = new Set(Object.keys(CLOSED_LABELS));
        const THEMES = window.DLP_THEMES;
        const THEME_KEY = 'dlp-theme';

        /* ======================================================================
           Utilitaires
           ====================================================================== */
        const $ = (selector) => document.querySelector(selector);

        const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);

        const str = (value) => (typeof value === 'string' ? value.trim() : '');

        const toCoord = (value) => {
            const n = parseFloat(String(value ?? '').replace(',', '.'));
            return Number.isFinite(n) ? n : null;
        };

        const safeUrl = (value) => {
            try {
                const url = new URL(value);
                return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : '';
            } catch { return ''; }
        };

        const searchKey = (value) =>
            String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

        function distanceKm(lat1, lon1, lat2, lon2) {
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad;
            const dLon = (lon2 - lon1) * rad;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
            return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        const formatDistance = (km) => (km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`);

        const timeFormat = new Intl.DateTimeFormat(CONFIG.LOCALE, {
            hour: '2-digit', minute: '2-digit', timeZone: CONFIG.TIMEZONE,
        });

        /* ======================================================================
           Données des lieux
           ====================================================================== */
        const DATA_FILES = ['attractions.json', 'restaurants.json', 'shows.json'];

        async function loadList(file) {
            const res = await fetch(file, { cache: 'no-cache' });
            if (!res.ok) throw new Error(`${file} : HTTP ${res.status}`);
            const data = await res.json();
            if (!Array.isArray(data)) throw new Error(`${file} : un tableau est attendu`);
            return data;
        }

        let attractionsRaw, restaurantsRaw, showsRaw;
        try {
            [attractionsRaw, restaurantsRaw, showsRaw] = await Promise.all(DATA_FILES.map(loadList));
        } catch (error) {
            console.error('Chargement des données impossible :', error);
            $('#list').innerHTML = '<div class="empty">Impossible de charger la liste des lieux.<br>Vérifiez votre connexion puis réessayez.<br><br><button type="button" class="btn-alert" id="btn-reload">Réessayer</button></div>';
            $('#btn-reload').addEventListener('click', () => location.reload());
            return;
        }

        const FIELDS = {
            attraction: { image: 'URL image', minHeight: 'Taille mini' },
            restaurant: { image: 'Photo', menuUrl: 'Menu', price: 'Tarif' },
            spectacle:  { image: 'Photo' },
        };

        function normalize(raw, category) {
            const f = FIELDS[category];
            // Formatage du type de restaurant (majuscule)
            let typeStr = str(raw['Type']);
            if (category === 'restaurant' && typeStr.length > 0) {
                typeStr = typeStr.charAt(0).toUpperCase() + typeStr.slice(1);
            }

            return {
                id: str(raw['Code']),
                apiId: str(raw['UUID Themeparks.wiki']).toLowerCase() || null,
                name: str(raw['Nom']),
                category,
                type: typeStr,
                park: str(raw['Parc']),
                land: str(raw['Land']).replace(' - Town Square', '').replace(' - Central Plaza', '') || 'Autre',
                image: f.image ? str(raw[f.image]) : '',
                description: str(raw['Description']),
                minHeight: f.minHeight ? str(raw[f.minHeight]) : '',
                menuUrl: f.menuUrl ? str(raw[f.menuUrl]) : '',
                price: f.price ? str(raw[f.price]) : '',
                lat: toCoord(raw['Coordonnées GPS (lat)']),
                lng: toCoord(raw['Coordonnées GPS (lng)']),
                live: null,
            };
        }

        const db = [
            ...attractionsRaw.map((raw) => normalize(raw, 'attraction')),
            ...restaurantsRaw.map((raw) => normalize(raw, 'restaurant')),
            ...showsRaw.map((raw) => normalize(raw, 'spectacle')),
        ];
        const dbById = new Map(db.map((item) => [item.id, item]));

        /* ======================================================================
           État de l'application & UI Elements
           ====================================================================== */
        const state = {
            tab: 'attraction',
            park: CONFIG.PARKS[0].value,
            query: '',
            showClosed: false,
            showFavorites: false,
            nearby: false,
            location: null,
            watchId: null,
            selectedId: null,
            ready: false,
            loading: false,
            lastSync: null,
            matches: 0,
        };

        const els = {
            list: $('#list'),
            sync: $('#btn-refresh'),
            syncLabel: $('#sync-label'),
            btnRefresh: $('#btn-refresh'),
            btnTheme: $('#btn-theme'),
            btnWallet: $('#btn-wallet'),
            seg: $('#park-seg'),
            parkBtns: [],
            search: $('#search'),
            chipFavs: $('#chip-favs'),
            chipNearby: $('#chip-nearby'),
            chipClosed: $('#chip-closed'),
            btnFav: $('#btn-fav'),
            tabs: document.querySelectorAll('.tabs button'),
            
            pane: $('#detail-pane'),
            placeholder: $('#detail-placeholder'),
            content: $('#detail-content'),
            btnBack: $('#btn-back'),
            image: $('#d-image'),
            imageSkeleton: $('#d-img-skeleton'),
            title: $('#d-title'),
            statusBadge: $('#d-badge'),
            statusText: $('#d-status-text'),
            single: $('#d-single'),
            badges: $('#d-badges'),
            showInfo: $('#d-show-info'),
            showType: $('#d-show-type'),
            showTimes: $('#d-show-times'),
            desc: $('#d-desc'),
            menu: $('#d-btn'),
            toast: $('#toast'),
            
            themeLayer: $('#theme-layer'),
            themeScrim: $('#theme-scrim'),
            themeClose: $('#theme-close'),
            themeGrid: $('#theme-grid'),
            
            walletLayer: $('#wallet-layer'),
            walletScrim: $('#wallet-scrim'),
            walletClose: $('#wallet-close'),
            walletMain: $('#wallet-main'),
            walletList: $('#wallet-list'),
            walletAddBtn: $('#wallet-add-btn'),
            walletScan: $('#wallet-scan'),
            walletScanCancel: $('#wallet-scan-cancel'),
            walletForm: $('#wallet-form'),
            walletFormCancel: $('#wallet-form-cancel'),
            walletType: $('#wallet-type'),
            walletExpiry: $('#wallet-expiry'),
            walletSaveBtn: $('#wallet-save-btn'),
            walletShow: $('#wallet-show'),
            walletShowTitle: $('#wallet-show-title'),
            walletShowExp: $('#wallet-show-exp'),
            walletShowBack: $('#wallet-show-back'),
            
            alertBox: $('#d-alert'),
            alertHeading: $('#alert-heading'),
            alertLabel: $('#alert-label'),
            alertNum: $('#alert-num'),
            alertLead: $('#alert-lead'),
            alertUnit: $('#alert-unit'),
            alertInfo: $('#alert-info'),
            alertSave: $('#alert-save'),
            alertRemove: $('#alert-remove'),
            alertStatusRow: $('#alert-status-row'),
            alertStatus: $('#alert-status'),
            alertStatusInfo: $('#alert-status-info'),
        };

        /* ======================================================================
           Système de Routage (Navigation History API)
           ====================================================================== */
        function initHistory() {
            if (!history.state || history.state.view !== 'home') {
                history.replaceState({ view: 'exit' }, '');
                history.pushState({ view: 'home' }, '');
            }

            window.addEventListener('popstate', (e) => {
                const s = e.state;
                if (!s) return;

                if (s.view === 'exit') {
                    if (confirm("Êtes-vous sûr de vouloir quitter l'application ?")) {
                        history.back(); // Sortie de l'application / retour à la page précédente
                    } else {
                        history.pushState({ view: 'home' }, ''); // Rétablit l'état d'accueil
                    }
                    return;
                }

                if (s.view === 'home') {
                    _closeDetailUI();
                    _closeThemesUI();
                    _closeWalletUI();
                } else if (s.view === 'detail') {
                    _closeThemesUI();
                    _closeWalletUI();
                    _openDetailUI(s.id);
                } else if (s.view === 'themes') {
                    _closeDetailUI();
                    _closeWalletUI();
                    _openThemesUI();
                } else if (s.view === 'wallet') {
                    _closeDetailUI();
                    _closeThemesUI();
                    _openWalletUI();
                }
            });
        }

        // Action UI déclenchant un changement de route
        function goBack() {
            if (history.state?.view !== 'home') history.back();
        }
        function navigateTo(view, data = {}) {
            history.pushState({ view, ...data }, '');
            window.dispatchEvent(new PopStateEvent('popstate', { state: { view, ...data } }));
        }

        /* ======================================================================
           Statuts
           ====================================================================== */
        const statusOf = (item) => item.live?.status ?? null;
        const isHiddenByDefault = (item) => HIDDEN_BY_DEFAULT.has(statusOf(item));

        const waitKind = (wait) => {
            if (wait == null) return 'off';
            if (wait <= CONFIG.WAIT_THRESHOLDS.low) return 'low';
            if (wait <= CONFIG.WAIT_THRESHOLDS.medium) return 'mid';
            return 'high';
        };

        function upcomingShowtimes(item) {
            const now = Date.now();
            return (item.live?.showtimes ?? [])
                .map((s) => new Date(s.startTime))
                .filter((d) => !Number.isNaN(d.getTime()) && d.getTime() >= now);
        }

        const downInfo = new Map();
        const downPending = new Set();

        function statusModel(item) {
            const status = statusOf(item);
            const mk = (kind, big, unit = '', text = '', cardExtra = '') => ({ kind, big, unit, text, cardExtra });

            if (status === 'DOWN') {
                const since = downInfo.get(item.apiId)?.since;
                return mk('down', 'Panne', '', since ? `En panne depuis : ${timeFormat.format(since)}` : 'En panne');
            }
            if (isHiddenByDefault(item)) {
                return mk('off', status === 'CLOSED' ? 'Fermé' : 'Travaux', '', CLOSED_LABELS[status]);
            }

            switch (item.category) {
                case 'attraction': {
                    if (!status) return mk('off', '--', '', 'Données indisponibles');
                    if (status !== 'OPERATING') return mk('off', '--', '', 'Actuellement indisponible');
                    const { wait, single } = item.live;
                    const m = mk(waitKind(wait), wait ?? '--', wait == null ? '' : 'min', 'Temps d’attente actuel');
                    if (single != null) m.single = single;
                    return m;
                }
                case 'spectacle': {
                    const upcoming = upcomingShowtimes(item);
                    if (upcoming.length) {
                        const times = upcoming.map((d) => timeFormat.format(d)).join(' • ');
                        return mk('show', timeFormat.format(upcoming[0]), 'séance', `Prochaines séances`, times);
                    }
                    if (item.live?.showtimes?.length) return mk('off', 'Terminé', '', 'Plus de séance aujourd’hui');
                    if (status === 'OPERATING') return mk('show', 'En cours', '', 'En cours');
                    return mk('off', '--', '', 'Horaires indisponibles');
                }
                case 'restaurant':
                    if (status === 'OPERATING') {
                        const t = item.type.toLowerCase();
                        const text = (t.includes('service à table') || t.includes('buffet à volonté')) 
                            ? 'Réservation recommandée' : 'Entrée libre';
                        return mk('open', 'Ouvert', '', text);
                    }
                    return mk('off', '--', '', 'Horaires indisponibles');
                default:
                    return mk('off', '--');
            }
        }

        const singleHtml = (m) => m.single == null ? ''
            : `<span class="sr"><span class="sr-l">Single Rider</span><span class="sr-t">${esc(m.single)} min</span></span>`;

        function badgeHtml(m) {
            const big = String(m.big);
            const size = /^(\d{1,3}|--)$/.test(big) ? '' : /^\d\d:\d\d$/.test(big) ? ' tm' : ' sm';
            return `<span class="badge ${m.kind}${size}">${esc(big)}${m.unit ? `<small>${esc(m.unit)}</small>` : ''}</span>`;
        }

        /* ======================================================================
           Synchronisation API temps réel
           ====================================================================== */
        async function fetchJson(url, timeoutMs) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        function applyLive(liveData) {
            const byId = new Map();
            for (const entry of liveData) {
                if (entry?.id) byId.set(String(entry.id).toLowerCase(), entry);
            }

            let matches = 0;
            for (const item of db) {
                const live = item.apiId && byId.get(item.apiId);
                if (!live) continue;
                matches++;
                item.live = {
                    status: live.status ?? null,
                    wait: live.queue?.STANDBY?.waitTime ?? null,
                    single: live.queue?.SINGLE_RIDER?.waitTime ?? null,
                    showtimes: Array.isArray(live.showtimes) ? live.showtimes : [],
                };
                if (item.live.status !== 'DOWN') downInfo.delete(item.apiId);
            }
            return matches;
        }

        function findDownSince(history) {
            const rows = (history?.history ?? history?.entities?.[0]?.history ?? [])
                .filter((row) => row?.time && !Number.isNaN(new Date(row.time).getTime()))
                .sort((a, b) => new Date(a.time) - new Date(b.time));

            if (!rows.length || rows[rows.length - 1].status !== 'DOWN') return null;
            let i = rows.length - 1;
            while (i > 0 && rows[i - 1].status === 'DOWN') i--;
            return new Date(rows[i].time);
        }

        async function loadDownSince() {
            const now = Date.now();
            const targets = db.filter((item) => {
                if (!item.apiId || statusOf(item) !== 'DOWN' || downPending.has(item.apiId)) return false;
                const info = downInfo.get(item.apiId);
                return !info || (!info.since && now - info.checkedAt > CONFIG.DOWN_RETRY_MS);
            });
            if (!targets.length) return;

            await Promise.all(targets.map(async (item) => {
                downPending.add(item.apiId);
                let since = null;
                try {
                    since = findDownSince(await fetchJson(CONFIG.API_HISTORY_URL(item.apiId), CONFIG.FETCH_TIMEOUT_MS));
                } catch (error) {
                    console.warn(`Historique indisponible pour « ${item.name} » :`, error);
                } finally {
                    downPending.delete(item.apiId);
                    downInfo.set(item.apiId, { since, checkedAt: Date.now() });
                }
            }));
            renderList();
            if (history.state?.view === 'detail') _openDetailUI(state.selectedId); // Re-render if open
        }

        function setSync(mode) {
            els.sync.dataset.state = mode;
            if (mode === 'live') {
                els.syncLabel.textContent = `En direct · ${timeFormat.format(state.lastSync)}`;
                els.sync.title = `${state.matches}/${db.length} lieux synchronisés. Appuyez pour actualiser.`;
            } else if (mode === 'error') {
                els.syncLabel.textContent = 'Hors connexion';
                els.sync.title = 'Impossible de joindre le service. Appuyez pour réessayer.';
            } else {
                els.syncLabel.textContent = 'Synchronisation…';
                els.sync.title = '';
            }
        }

        async function refresh() {
            if (state.loading) return;
            state.loading = true;
            els.btnRefresh.disabled = true;
            els.btnRefresh.classList.add('is-spinning');
            if (!state.lastSync) setSync('loading');

            const pulling = alerts.size ? pullServerState() : null;
            let ok = false;
            try {
                const data = await fetchJson(CONFIG.API_LIVE_URL, CONFIG.FETCH_TIMEOUT_MS);
                state.matches = applyLive(data.liveData ?? []);
                state.lastSync = new Date();
                setSync('live');
                ok = true;
            } catch (error) {
                console.error('Synchronisation impossible :', error);
                setSync('error');
            } finally {
                state.loading = false;
                state.ready = true;
                els.btnRefresh.disabled = false;
                els.btnRefresh.classList.remove('is-spinning');
                await pulling;
                checkAlerts();
                renderList();
                if (history.state?.view === 'detail') _openDetailUI(state.selectedId);
            }
            if (ok) loadDownSince();
        }

        /* ======================================================================
           Alertes et Favoris
           ====================================================================== */
        const ALERTS_KEY = 'dlp-alerts';
        const FAVORITES_KEY = 'dlp-favorites';
        const favorites = (() => {
            try {
                const saved = JSON.parse(localStorage.getItem(FAVORITES_KEY) ?? '[]');
                return new Set((Array.isArray(saved) ? saved : []).filter((id) => dbById.has(id)));
            } catch { return new Set(); }
        })();

        function saveFavorites() {
            try {
                localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
                return true;
            } catch {
                notify('Impossible d’enregistrer les favoris sur cet appareil.');
                return false;
            }
        }

        const alerts = (() => {
            try {
                const saved = JSON.parse(localStorage.getItem(ALERTS_KEY) ?? '{}');
                return new Map(Object.entries(saved).filter(([id, a]) =>
                    dbById.has(id.split('#')[0]) && ['wait', 'show', 'status'].includes(a?.kind)));
            } catch { return new Map(); }
        })();

        function saveAlerts() {
            try {
                localStorage.setItem(ALERTS_KEY, JSON.stringify(Object.fromEntries(alerts)));
                return true;
            } catch {
                notify('Impossible d’enregistrer les alertes sur cet appareil.');
                return false;
            }
        }

        // (Code Cloudflare Push conservé à l'identique)
        const VAPID_PUBLIC_KEY = 'BF7t3wvEsIR4cELGVe5kJC3T6d3GOUIfwCdZsBMSjBxYyMwU4xBEh0aRXhjQdoTBfSR7o4M3X7fEQznEpumuTIM';
        const WORKER_URL = 'https://dlp-alert-worker.jordan-sautret.workers.dev/';
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const outputArray = new Uint8Array(base64.length);
            for (let i = 0; i < base64.length; ++i) { outputArray[i] = base64.charCodeAt(i); }
            return outputArray;
        }

        const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window;
        const withTimeout = (promise, ms) => Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('délai dépassé')), ms))]);
        const postWorker = (body, timeoutMs = 8000) => fetch(WORKER_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body), signal: AbortSignal.timeout(timeoutMs),
        });

        async function getPushSubscription({ create }) {
            if (!pushSupported()) return null;
            const reg = await withTimeout(navigator.serviceWorker.ready, 4000);
            const key = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
            let sub = await reg.pushManager.getSubscription();
            const current = sub?.options?.applicationServerKey;
            if (sub && current && !(new Uint8Array(current).length === key.length && new Uint8Array(current).every((v, i) => v === key[i]))) {
                await sub.unsubscribe();
                sub = null;
            }
            if (!sub && create) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
            return sub;
        }

        const alertsForServer = () => Object.fromEntries([...alerts].map(([id, a]) => {
            const item = dbById.get(id.split('#')[0]);
            return [id, { ...a, apiId: item?.apiId, name: item?.name, land: item?.land }];
        }));

        async function syncAlerts({ interactive = false } = {}) {
            try {
                const sub = await getPushSubscription({ create: interactive });
                if (!sub) return { ok: false, reason: pushSupported() ? 'pas d’abonnement' : 'non pris en charge' };
                const res = await postWorker({ subscription: sub.toJSON(), alerts: alertsForServer() });
                if (!res.ok) throw new Error(`serveur (HTTP ${res.status})`);
                return { ok: true };
            } catch (error) { return { ok: false, reason: String(error?.message ?? error) }; }
        }

        async function pullServerState() {
            if (!alerts.size) return;
            try {
                const sub = await getPushSubscription({ create: false });
                if (!sub) return;
                const res = await postWorker({ action: 'state', subscription: sub.toJSON() }, 3000);
                if (!res.ok) return;
                const remote = (await res.json()).alerts ?? {};
                let changed = false;
                for (const [id, a] of alerts) {
                    const r = remote[id];
                    if (!r || r.kind !== a.kind) continue;
                    if (a.kind === 'wait' && r.threshold === a.threshold && (a.armed !== r.armed || a.firedAt !== r.firedAt)) {
                        Object.assign(a, { armed: r.armed, firedAt: r.firedAt, firedWait: r.firedWait });
                        changed = true;
                    } else if (a.kind === 'show' && r.lead === a.lead) {
                        for (const k of r.done ?? []) if (!a.done.includes(k)) { a.done.push(k); changed = true; }
                    } else if (a.kind === 'status' && a.down !== r.down) {
                        a.down = r.down; changed = true;
                    }
                }
                if (changed) { saveAlerts(); renderList(); if (history.state?.view === 'detail') _openDetailUI(state.selectedId); }
            } catch { }
        }

        const isIos = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        async function ensureNotifications() {
            if (!('Notification' in window)) {
                notify(isIos() ? 'Ajoutez d’abord l’app à l’écran d’accueil.' : 'Les notifications ne sont pas prises en charge.');
                return false;
            }
            let permission = Notification.permission;
            if (permission === 'default') permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                notify('Notifications bloquées : autorisez-les dans les réglages.');
                return false;
            }
            return true;
        }

        async function sendNotification({ title, body, tag, id }) {
            if (!document.hidden) notify(`${title} — ${body}`);
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const options = { body, tag, renotify: true, data: { id } };
            try {
                const reg = await navigator.serviceWorker?.getRegistration();
                if (reg) return await reg.showNotification(title, options);
            } catch { }
            try { new Notification(title, options); } catch { }
        }

        const futureSessions = (item, now) => (item.live?.showtimes ?? [])
            .map((s) => ({ key: s.startTime, start: Date.parse(s.startTime) }))
            .filter((s) => Number.isFinite(s.start) && s.start > now)
            .sort((a, b) => a.start - b.start);

        const isBelow = (live, threshold) => live?.status === 'OPERATING' && live.wait != null && live.wait <= threshold;

        function checkWaitAlert(item, a) {
            const live = item.live;
            if (isBelow(live, a.threshold)) {
                if (!a.armed) return false;
                a.armed = false; a.firedAt = Date.now(); a.firedWait = live.wait;
                sendNotification({ title: `${item.name} : ${live.wait} min`, body: `Sous votre seuil, c’est le moment !`, tag: `wait-${item.id}`, id: item.id });
                return true;
            }
            if (a.armed) return false;
            a.armed = true; return true;
        }

        function checkShowAlert(item, a, now) {
            let changed = false;
            for (const { key, start } of futureSessions(item, now)) {
                if (a.done.includes(key) || start - now > a.lead * 60_000) continue;
                a.done.push(key); changed = true;
                const mins = Math.max(1, Math.round((start - now) / 60_000));
                sendNotification({ title: `${item.name} dans ${mins} min`, body: `Séance de ${timeFormat.format(start)} · ${item.land}`, tag: `show-${item.id}-${key}`, id: item.id });
            }
            const kept = a.done.filter((key) => Date.parse(key) > now - 86_400_000);
            if (kept.length !== a.done.length) { a.done = kept; changed = true; }
            return changed;
        }

        function checkStatusAlert(item, a) {
            const status = item.live.status;
            if (status === 'DOWN' && !a.down) {
                a.down = true;
                sendNotification({ title: `${item.name} : en panne`, body: 'L’attraction est indisponible.', tag: `status-${item.id}`, id: item.id });
                return true;
            }
            if (status === 'OPERATING' && a.down) {
                a.down = false;
                const wait = item.live.wait;
                sendNotification({ title: `${item.name} a rouvert`, body: typeof wait === 'number' ? `Attente : ${wait} min.` : 'L’attraction est disponible.', tag: `status-${item.id}`, id: item.id });
                return true;
            }
            if (a.down && status && status !== 'DOWN' && status !== 'OPERATING') { a.down = false; return true; }
            return false;
        }

        function checkAlerts() {
            if (!alerts.size) return false;
            const now = Date.now();
            let changed = false;
            for (const [key, a] of alerts) {
                const item = dbById.get(key.split('#')[0]);
                if (!item?.live) continue;
                const result = a.kind === 'wait' ? checkWaitAlert(item, a) : a.kind === 'status' ? checkStatusAlert(item, a) : checkShowAlert(item, a, now);
                changed = result || changed;
            }
            if (changed) saveAlerts();
            return changed;
        }

        let alertUiFor = null;
        function renderAlertBox(item) {
            const supported = item.category === 'attraction' || item.category === 'spectacle';
            els.alertBox.hidden = !supported;
            if (!supported) return;

            const isWait = item.category === 'attraction';
            const a = alerts.get(item.id);
            const statusAlert = alerts.get(`${item.id}#status`);

            els.alertHeading.textContent = isWait ? 'Alertes' : 'Alerte avant la séance';
            els.alertLabel.textContent = isWait ? 'Me prévenir dès que l’attente est inférieure ou égale à' : 'Me prévenir avant chaque séance, à l’avance de';
            els.alertNum.hidden = !isWait; els.alertLead.hidden = isWait;
            els.alertUnit.textContent = isWait ? 'min' : 'min avant le début';

            if (alertUiFor !== item.id) {
                alertUiFor = item.id;
                if (isWait) els.alertNum.value = a?.threshold ?? (item.live?.wait == null ? 30 : Math.max(5, Math.round((item.live.wait * 0.7) / 5) * 5));
                else els.alertLead.value = String(a?.lead ?? 45);
            }

            els.alertStatusRow.hidden = !isWait;
            els.alertStatus.checked = Boolean(statusAlert);
            els.alertStatusInfo.hidden = !statusAlert;
            els.alertStatusInfo.textContent = statusAlert ? (item.live?.status === 'DOWN' ? 'En panne actuellement : vous serez prévenu dès sa réouverture.' : 'En service actuellement : vous serez prévenu en cas de panne.') : '';

            els.alertBox.classList.toggle('is-active', Boolean(a || statusAlert));
            els.alertSave.textContent = a ? 'Mettre à jour' : 'Activer l’alerte';
            els.alertRemove.hidden = !a;
            
            // Alert Info logic
            let infoText = '';
            if (isWait) {
                const current = item.live?.status === 'OPERATING' && item.live.wait != null ? `Attente actuelle : ${item.live.wait} min.` : 'Attraction indisponible.';
                if (!a) infoText = `${current} Vous serez prévenu dès que l’attente passe sous le seuil.`;
                else if (a.armed) infoText = `Alerte active (≤ ${a.threshold} min). ${current}`;
                else infoText = `Alerte envoyée. Elle se réarme au-dessus de ${a.threshold} min.`;
            } else {
                const sessions = futureSessions(item, Date.now());
                if (!a) infoText = sessions.length ? `Prochaine séance : ${timeFormat.format(sessions[0].start)}.` : 'Aucune séance à venir aujourd’hui.';
                else {
                    const pending = sessions.find((s) => !a.done.includes(s.key));
                    infoText = pending ? `Prochaine alerte à ${timeFormat.format(pending.start - a.lead * 60_000)}.` : 'Plus de séance aujourd’hui.';
                }
            }
            els.alertInfo.textContent = infoText;
        }

        /* ======================================================================
           Filtres & Rendu de liste
           ====================================================================== */
        const CATEGORY_LABELS = { attraction: 'Attractions', restaurant: 'Restaurants', spectacle: 'Spectacles' };
        const CATEGORY_ORDER = Object.keys(CATEGORY_LABELS);

        function syncFilterUi() {
            const locked = state.nearby || state.showFavorites;
            els.parkBtns.forEach((b) => b.setAttribute('aria-pressed', String(!locked && b.dataset.park === state.park)));
            els.chipNearby.setAttribute('aria-pressed', String(state.watchId != null));
            els.chipClosed.setAttribute('aria-pressed', String(state.showClosed));
            els.chipFavs.setAttribute('aria-pressed', String(state.showFavorites));
            els.chipFavs.textContent = favorites.size ? `Favoris (${favorites.size})` : 'Favoris';
        }

        function syncTabsUi() {
            els.tabs.forEach((t) => t.setAttribute('aria-current', String(!state.showFavorites && t.dataset.tab === state.tab)));
        }

        function toggleFavorite(id) {
            const item = dbById.get(id);
            if (!item) return;
            const wasFavorite = favorites.has(id);
            if (wasFavorite) favorites.delete(id); else favorites.add(id);
            if (!saveFavorites()) {
                if (wasFavorite) favorites.add(id); else favorites.delete(id);
                return;
            }
            notify(wasFavorite ? `${item.name} retiré des favoris` : `${item.name} ajouté aux favoris`);
            syncFilterUi();
            renderList();
            if (history.state?.view === 'detail' && state.selectedId === id) {
                els.btnFav.setAttribute('aria-pressed', String(!wasFavorite));
                els.btnFav.setAttribute('aria-label', !wasFavorite ? 'Retirer des favoris' : 'Ajouter aux favoris');
                els.btnFav.title = els.btnFav.getAttribute('aria-label');
            }
        }

        function getVisibleEntries() {
            const query = searchKey(state.query);
            const nearbyActive = state.nearby && state.location;
            const entries = [];

            for (const item of db) {
                if (state.showFavorites) {
                    if (!favorites.has(item.id)) continue;
                } else {
                    if (item.category !== state.tab) continue;
                    if (!nearbyActive && item.park !== state.park) continue;
                }
                if (!state.showClosed && isHiddenByDefault(item)) continue;
                if (query && !searchKey(item.name).includes(query)) continue;

                let dist = null;
                if (nearbyActive) {
                    if (item.lat == null || item.lng == null) continue;
                    dist = distanceKm(state.location.lat, state.location.lng, item.lat, item.lng);
                    if (dist > CONFIG.NEARBY_RADIUS_KM) continue;
                }
                entries.push({ item, dist });
            }
            return entries;
        }

        function waitRank(item) {
            const live = item.live;
            if (live?.status === 'OPERATING') return live.wait ?? 0;
            return live?.status === 'DOWN' ? -1 : -2;
        }

        function compareEntries(a, b) {
            if (a.dist != null && b.dist != null) return a.dist - b.dist;
            if (a.item.category === 'attraction' && b.item.category === 'attraction') {
                const diff = waitRank(b.item) - waitRank(a.item);
                if (diff) return diff;
            }
            return a.item.name.localeCompare(b.item.name, CONFIG.LOCALE);
        }

        function cardHtml({ item, dist }) {
            const selected = item.id === state.selectedId && history.state?.view === 'detail';
            const fav = favorites.has(item.id);
            const m = statusModel(item);
            const sub = [
                dist != null ? `à ${formatDistance(dist)}` : '',
                m.kind === 'down' ? m.text : item.type,
                state.showFavorites ? item.park : '',
                m.cardExtra,
            ].filter(Boolean).join(' · ');
            const bell = (alerts.has(item.id) || alerts.has(item.id + '#status'))
                ? '<svg class="icon card-bell" role="img" aria-label="Alerte active"><use href="#i-bell"/></svg>' : '';

            return `
                <div class="card${selected ? ' selected' : ''}">
                    <button type="button" class="main" data-id="${esc(item.id)}"${selected ? ' aria-current="true"' : ''}>
                        ${badgeHtml(m)}
                        <span class="txt">
                            <span class="ttl">${esc(item.name)}${bell}</span>
                            ${sub ? `<span class="sub">${esc(sub)}</span>` : ''}
                            ${singleHtml(m)}
                        </span>
                    </button>
                    <button type="button" class="heart" data-fav-id="${esc(item.id)}" aria-pressed="${fav}"
                            aria-label="${fav ? 'Retirer' : 'Ajouter'} ${esc(item.name)} ${fav ? 'des' : 'aux'} favoris">
                        <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#i-heart"/></svg>
                    </button>
                </div>`;
        }

        function renderList() {
            if (!state.ready) {
                els.list.innerHTML = '<div class="skeleton" style="height:90px"></div>'.repeat(4);
                return;
            }

            const entries = getVisibleEntries();
            if (!entries.length) {
                const hint = state.query ? 'Aucun résultat pour cette recherche.'
                    : state.showFavorites && !favorites.size ? 'Aucun favori pour le moment.<br>Ouvrez la fiche d’un lieu et touchez le cœur pour l’ajouter.'
                    : state.nearby ? `Aucun lieu dans un rayon de ${Math.round(CONFIG.NEARBY_RADIUS_KM * 1000)} m.`
                    : 'Aucun lieu ne correspond à ces critères.';
                els.list.innerHTML = `<div class="empty">${hint}</div>`;
                return;
            }

            const groupOf = (item) => (state.showFavorites ? CATEGORY_LABELS[item.category] : item.land);
            const groups = new Map();
            for (const entry of entries) {
                const key = groupOf(entry.item);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(entry);
            }

            const nearest = (land) => Math.min(...groups.get(land).map((e) => e.dist));
            const lands = [...groups.keys()].sort((a, b) => {
                if (state.nearby && state.location) return nearest(a) - nearest(b);
                if (state.showFavorites) {
                    return CATEGORY_ORDER.findIndex((c) => CATEGORY_LABELS[c] === a) - CATEGORY_ORDER.findIndex((c) => CATEGORY_LABELS[c] === b);
                }
                return a.localeCompare(b, CONFIG.LOCALE);
            });

            els.list.innerHTML = lands.map((land) => `
                <section>
                    <h2 class="land">${esc(land)}</h2>
                    ${groups.get(land).sort(compareEntries).map(cardHtml).join('')}
                </section>`).join('');
        }

        /* ======================================================================
           Détail (UI Logic)
           ====================================================================== */
        function _openDetailUI(id) {
            state.selectedId = id;
            const item = dbById.get(id);
            els.placeholder.hidden = Boolean(item);
            els.content.hidden = !item;
            if (!item) return;

            // Reset image state for smooth loading
            els.image.hidden = true;
            els.image.removeAttribute('src');
            els.imageSkeleton.hidden = false;

            els.title.textContent = item.name;
            const fav = favorites.has(item.id);
            els.btnFav.setAttribute('aria-pressed', String(fav));
            els.btnFav.setAttribute('aria-label', fav ? 'Retirer des favoris' : 'Ajouter aux favoris');
            els.btnFav.title = els.btnFav.getAttribute('aria-label');
            
            els.desc.textContent = item.description;
            els.desc.hidden = !item.description;

            const m = statusModel(item);
            els.statusBadge.innerHTML = badgeHtml(m);
            els.statusText.textContent = m.text;
            els.single.innerHTML = singleHtml(m);

            // Gérer l'affichage de l'image (via onload pour effacer le skeleton)
            const image = safeUrl(item.image);
            if (image) {
                els.image.onload = () => { els.image.hidden = false; els.imageSkeleton.hidden = true; };
                els.image.onerror = () => { els.imageSkeleton.hidden = true; };
                els.image.src = image;
            } else {
                els.imageSkeleton.hidden = true;
            }

            // Gestion des Spectacles (bloc dédié)
            if (item.category === 'spectacle') {
                els.showInfo.hidden = false;
                els.showType.textContent = item.type;
                const upcoming = upcomingShowtimes(item);
                if (upcoming.length) {
                    els.showTimes.innerHTML = `<strong>Prochaines séances :</strong><br>${upcoming.map(d => timeFormat.format(d)).join(' • ')}`;
                } else if (item.live?.showtimes?.length) {
                    els.showTimes.innerHTML = `Plus de séance aujourd'hui`;
                } else {
                    els.showTimes.innerHTML = ``;
                }
            } else {
                els.showInfo.hidden = true;
            }

            // Badges
            const badges = [
                { text: item.park, kind: 'park' },
                { text: item.land, kind: 'land' },
                item.category !== 'spectacle' ? { text: item.type } : null,
                item.minHeight && item.minHeight !== 'Pas de restriction' ? { text: `Taille minimale : ${item.minHeight}`, warning: true } : null,
                item.price ? { text: `Tarifs : ${item.price}` } : null,
            ].filter((b) => b && b.text);

            els.badges.innerHTML = badges.map((b) => `<li class="pill${b.kind ? ` is-${b.kind}` : ''}${b.warning ? ' is-warning' : ''}">${esc(b.text)}</li>`).join('');

            const menu = safeUrl(item.menuUrl);
            els.menu.hidden = !menu;
            if (menu) els.menu.href = menu;
            
            renderAlertBox(item);
            renderList(); // met à jour la sélection de la liste

            els.pane.classList.add('is-open');
            els.pane.scrollTop = 0;
            els.btnBack.focus({ preventScroll: true });
        }

        function _closeDetailUI() {
            const previousId = state.selectedId;
            state.selectedId = null;
            alertUiFor = null;
            els.pane.classList.remove('is-open');
            
            // Clean up image state
            els.image.hidden = true;
            els.image.removeAttribute('src');
            els.imageSkeleton.hidden = true;
            
            els.placeholder.hidden = false;
            els.content.hidden = true;
            
            renderList();
            if (previousId) {
                els.list.querySelector(`.main[data-id="${CSS.escape(previousId)}"]`)?.focus({ preventScroll: true });
            }
        }

        /* ======================================================================
           Portefeuille (Billet / Pass) UI Logic
           ====================================================================== */
        const WALLET_KEY = 'dlp-wallet';
        let walletItems = [];
        let html5QrcodeScanner = null;

        function initWalletData() {
            try {
                walletItems = JSON.parse(localStorage.getItem(WALLET_KEY) ?? '[]');
                const today = new Date();
                today.setHours(0,0,0,0);
                // Supprimer automatiquement ce qui est expiré
                walletItems = walletItems.filter(t => new Date(t.expiry) >= today);
                localStorage.setItem(WALLET_KEY, JSON.stringify(walletItems));
            } catch { }
        }

        function renderWalletList() {
            if (!walletItems.length) {
                els.walletList.innerHTML = '<div class="empty">Aucun titre enregistré.</div>';
                return;
            }
            els.walletList.innerHTML = walletItems.map(t => `
                <li class="wallet-item">
                    <button type="button" class="wallet-item-btn" data-id="${t.id}">
                        <div class="wallet-item-text">
                            <strong>${esc(t.type)}</strong><br>
                            <small>Expire le ${new Date(t.expiry).toLocaleDateString(CONFIG.LOCALE)}</small>
                        </div>
                        <svg class="icon"><use href="#i-wallet"/></svg>
                    </button>
                    <button type="button" class="wallet-item-del round" data-del="${t.id}" aria-label="Supprimer">
                        <svg class="icon"><use href="#i-trash"/></svg>
                    </button>
                </li>
            `).join('');
        }

        function _openWalletUI() {
            initWalletData();
            renderWalletList();
            els.walletMain.hidden = false;
            els.walletScan.hidden = true;
            els.walletForm.hidden = true;
            els.walletShow.hidden = true;
            els.walletLayer.hidden = false;
            els.walletClose.focus();
        }

        function _closeWalletUI() {
            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.stop(); } catch(e){}
            }
            els.walletLayer.hidden = true;
            els.btnWallet.focus({ preventScroll: true });
        }

        async function startWalletScanner() {
            els.walletMain.hidden = true;
            els.walletScan.hidden = false;
            html5QrcodeScanner = new Html5Qrcode("qr-reader");
            try {
                await html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        html5QrcodeScanner.stop();
                        els.walletScan.hidden = true;
                        openWalletForm(decodedText);
                    },
                    () => {}
                );
            } catch (err) {
                notify("Impossible d'accéder à la caméra.");
                els.walletScan.hidden = true;
                els.walletMain.hidden = false;
            }
        }

        let pendingScannedData = null;
        function openWalletForm(data) {
            pendingScannedData = data;
            els.walletForm.hidden = false;
            els.walletType.value = "Billet";
            els.walletExpiry.value = "";
            els.walletExpiry.focus();
        }

        function saveWalletForm() {
            if (!els.walletExpiry.value) {
                notify("Veuillez indiquer une date d'expiration.");
                return;
            }
            walletItems.push({
                id: Date.now(),
                type: els.walletType.value,
                expiry: els.walletExpiry.value,
                data: pendingScannedData
            });
            localStorage.setItem(WALLET_KEY, JSON.stringify(walletItems));
            notify("Titre ajouté au portefeuille.");
            
            els.walletForm.hidden = true;
            els.walletMain.hidden = false;
            renderWalletList();
        }

        function showWalletQR(id) {
            const t = walletItems.find(x => x.id === parseInt(id));
            if (!t) return;
            els.walletMain.hidden = true;
            els.walletShow.hidden = false;
            els.walletShowTitle.textContent = t.type;
            els.walletShowExp.textContent = `Expire le ${new Date(t.expiry).toLocaleDateString(CONFIG.LOCALE)}`;
            
            // Génération QR Code pleine page
            new QRious({
                element: document.getElementById('wallet-canvas'),
                value: t.data,
                size: 250,
                level: 'M'
            });
        }

        function deleteWalletItem(id) {
            if (!confirm("Voulez-vous supprimer ce titre ?")) return;
            walletItems = walletItems.filter(x => x.id !== parseInt(id));
            localStorage.setItem(WALLET_KEY, JSON.stringify(walletItems));
            renderWalletList();
        }

        /* ======================================================================
           Thèmes UI Logic
           ====================================================================== */
        const currentTheme = () => document.documentElement.dataset.theme;

        function updateThemeLabel() {
            els.btnTheme.setAttribute('aria-label', `Changer de thème (actuel : ${THEMES[currentTheme()]?.n ?? ''})`);
        }

        function setTheme(id) {
            window.DLP_applyTheme(id);
            try { localStorage.setItem(THEME_KEY, currentTheme()); } catch { }
            updateThemeLabel();
        }

        function renderThemes() {
            const active = currentTheme();
            els.themeGrid.innerHTML = Object.entries(THEMES).map(([id, t]) => `
                <button type="button" class="th" data-theme-id="${esc(id)}" aria-pressed="${id === active}">
                    <span class="sw"><i style="background:${t.ink}"></i><i style="background:${t.gold}"></i><i style="background:${t.acc}"></i><i style="background:${t.bg}"></i></span>
                    <span><span class="th-n">${esc(t.n)}</span><span class="th-f">${esc(t.f)}</span></span>
                </button>`).join('');
        }

        function _openThemesUI() {
            renderThemes();
            els.themeLayer.hidden = false;
            els.themeClose.focus();
        }

        function _closeThemesUI() {
            els.themeLayer.hidden = true;
            els.btnTheme.focus({ preventScroll: true });
        }

        /* ======================================================================
           Interactions
           ====================================================================== */
        let toastTimer;
        function notify(message) {
            els.toast.textContent = message;
            els.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('show'), 4000);
        }

        function setNearbyUi(active) {
            state.nearby = active;
            syncFilterUi();
        }

        function stopNearby() {
            if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
            state.watchId = null;
            state.location = null;
            setNearbyUi(false);
        }

        function onPosition({ coords }) {
            const previous = state.location;
            state.location = { lat: coords.latitude, lng: coords.longitude };
            const firstFix = !state.nearby;
            if (firstFix) setNearbyUi(true);
            const moved = !previous || distanceKm(previous.lat, previous.lng, state.location.lat, state.location.lng) > 0.015;
            if (firstFix || moved) renderList();
        }

        function onPositionError(error) {
            if (state.nearby && error.code === 3) return;
            stopNearby();
            notify('Autorisez la géolocalisation pour afficher les lieux proches.');
            renderList();
        }

        function onNearbyClick() {
            if (state.watchId != null) {
                stopNearby();
                return renderList();
            }
            if (!('geolocation' in navigator)) { return notify('La géolocalisation n’est pas disponible sur cet appareil.'); }
            state.watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy: true, timeout: 20_000, maximumAge: 15_000 });
            syncFilterUi();
        }

        function bindEvents() {
            els.seg.innerHTML = CONFIG.PARKS.map((p) => `<button type="button" data-park="${esc(p.value)}" aria-pressed="false">${esc(p.label)}</button>`).join('');
            els.parkBtns = [...els.seg.querySelectorAll('button')];
            els.parkBtns.forEach((btn) => btn.addEventListener('click', () => {
                if (state.watchId != null || state.nearby) stopNearby();
                if (state.showFavorites) { state.showFavorites = false; syncTabsUi(); }
                state.park = btn.dataset.park;
                syncFilterUi();
                goBack(); // ferme toute modale
                renderList();
            }));

            els.search.addEventListener('input', () => { state.query = els.search.value; renderList(); });
            els.chipClosed.addEventListener('click', () => { state.showClosed = !state.showClosed; syncFilterUi(); renderList(); });
            els.chipNearby.addEventListener('click', onNearbyClick);
            els.chipFavs.addEventListener('click', () => {
                goBack();
                state.showFavorites = !state.showFavorites;
                syncFilterUi(); syncTabsUi();
                renderList(); els.list.scrollTop = 0;
            });
            els.btnFav.addEventListener('click', () => { if (state.selectedId) toggleFavorite(state.selectedId); });

            els.tabs.forEach((tab) => tab.addEventListener('click', () => {
                state.tab = tab.dataset.tab;
                if (state.showFavorites) { state.showFavorites = false; syncFilterUi(); }
                goBack();
                syncTabsUi();
                renderList(); els.list.scrollTop = 0;
            }));

            els.list.addEventListener('click', (event) => {
                const favBtn = event.target.closest('.heart');
                if (favBtn) {
                    const id = favBtn.dataset.favId;
                    toggleFavorite(id);
                    els.list.querySelector(`.heart[data-fav-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
                    return;
                }
                const card = event.target.closest('.main');
                if (card) navigateTo('detail', { id: card.dataset.id });
            });

            els.btnBack.addEventListener('click', goBack);
            
            // Événements d'alerte (inchangés, branchés directement via JS plus haut)
            els.alertSave.addEventListener('click', async () => {
                const item = dbById.get(state.selectedId);
                if (!item) return;
                const isWait = item.category === 'attraction';
                let threshold = null; let lead = null;
                if (isWait) {
                    threshold = Number.parseInt(els.alertNum.value, 10);
                    if (!Number.isFinite(threshold) || threshold < 5 || threshold > 180) return notify('Saisissez un seuil entre 5 et 180 minutes.');
                } else lead = Number.parseInt(els.alertLead.value, 10);

                if (!(await ensureNotifications())) return;
                const now = Date.now();
                if (isWait) alerts.set(item.id, { kind: 'wait', threshold, armed: !isBelow(item.live, threshold), firedAt: null, firedWait: null });
                else alerts.set(item.id, { kind: 'show', lead, done: futureSessions(item, now).filter((s) => s.start - now <= lead * 60_000).map((s) => s.key) });
                
                if (saveAlerts()) {
                    const label = isWait ? `Alerte activée : ${item.name} ≤ ${threshold} min` : `Alerte activée : ${lead} min avant chaque séance`;
                    const sync = await syncAlerts({ interactive: true });
                    notify(sync.ok ? label : `${label}. Sans connexion serveur, l'alerte fonctionne uniquement l'app ouverte.`);
                } else alerts.delete(item.id);
                renderAlertBox(item);
            });
            els.alertRemove.addEventListener('click', () => {
                const item = dbById.get(state.selectedId);
                if (!item || !alerts.delete(item.id)) return;
                saveAlerts(); syncAlerts(); notify('Alerte supprimée'); renderAlertBox(item);
            });
            els.alertStatus.addEventListener('change', async () => {
                const item = dbById.get(state.selectedId);
                if (!item || item.category !== 'attraction') return;
                const key = `${item.id}#status`; const enable = els.alertStatus.checked;
                if (enable) {
                    if (!(await ensureNotifications())) { els.alertStatus.checked = false; return; }
                    alerts.set(key, { kind: 'status', down: item.live?.status === 'DOWN' });
                } else if (!alerts.delete(key)) return;

                if (!saveAlerts()) { alerts.delete(key); els.alertStatus.checked = false; }
                else if (enable) {
                    const label = `Alerte activée : panne et réouverture de ${item.name}`;
                    const sync = await syncAlerts({ interactive: true });
                    notify(sync.ok ? label : `${label}. Sans connexion serveur, l'alerte fonctionne uniquement l'app ouverte.`);
                } else { syncAlerts(); notify('Alerte panne et réouverture désactivée'); }
                renderAlertBox(item);
            });

            els.btnRefresh.addEventListener('click', refresh);

            // Thèmes
            els.btnTheme.addEventListener('click', () => navigateTo('themes'));
            els.themeClose.addEventListener('click', goBack);
            els.themeScrim.addEventListener('click', goBack);
            els.themeGrid.addEventListener('click', (event) => {
                const btn = event.target.closest('.th');
                if (!btn) return;
                setTheme(btn.dataset.themeId);
                goBack();
            });

            // Portefeuille
            els.btnWallet.addEventListener('click', () => navigateTo('wallet'));
            els.walletClose.addEventListener('click', goBack);
            els.walletScrim.addEventListener('click', goBack);
            els.walletAddBtn.addEventListener('click', startWalletScanner);
            els.walletScanCancel.addEventListener('click', () => {
                if (html5QrcodeScanner) html5QrcodeScanner.stop();
                els.walletScan.hidden = true;
                els.walletMain.hidden = false;
            });
            els.walletFormCancel.addEventListener('click', () => {
                els.walletForm.hidden = true;
                els.walletMain.hidden = false;
            });
            els.walletSaveBtn.addEventListener('click', saveWalletForm);
            els.walletShowBack.addEventListener('click', () => {
                els.walletShow.hidden = true;
                els.walletMain.hidden = false;
            });
            els.walletList.addEventListener('click', (e) => {
                const delBtn = e.target.closest('.wallet-item-del');
                if (delBtn) { deleteWalletItem(delBtn.dataset.del); return; }
                const itemBtn = e.target.closest('.wallet-item-btn');
                if (itemBtn) { showWalletQR(itemBtn.dataset.id); }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') goBack();
            });

            setInterval(() => { if (!document.hidden || alerts.size) refresh(); }, CONFIG.REFRESH_MS);
            setInterval(() => { if (checkAlerts()) { renderList(); if(history.state?.view === 'detail') _openDetailUI(state.selectedId); } }, 30_000);
            document.addEventListener('visibilitychange', () => {
                const stale = !state.lastSync || Date.now() - state.lastSync.getTime() > CONFIG.REFRESH_MS / 2;
                if (!document.hidden) pullServerState();
                if (!document.hidden && stale) refresh();
            });
        }

        /* ======================================================================
           Démarrage
           ====================================================================== */
        function init() {
            initHistory();
            bindEvents();
            updateThemeLabel();
            syncFilterUi();
            syncTabsUi();
            renderList();
            refresh();
            if (alerts.size) syncAlerts();

            navigator.serviceWorker?.addEventListener('message', (event) => {
                if (event.data?.type === 'open-item') navigateTo('detail', { id: event.data.id });
                if (event.data?.type === 'refresh-data') refresh();
            });
            if (location.hash.length > 1) navigateTo('detail', { id: decodeURIComponent(location.hash.slice(1)) });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch(() => {});
                });
            }
        }

        init();
    })();
    </script>
</body>
</html>
