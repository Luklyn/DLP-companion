    <noscript>Cette application nécessite JavaScript.</noscript>

    <script>
    (async () => {
        'use strict';

        /* ======================================================================
           Configuration
           ====================================================================== */
        const CONFIG = {
            API_LIVE_URL: 'https://api.themeparks.wiki/v1/entity/e8d0207f-da8a-4048-bec8-117aa946b2c2/live',
            API_HISTORY_URL: (id) => `https://api.themeparks.wiki/v1/entity/${encodeURIComponent(id)}/history`,
            DOWN_RETRY_MS: 300_000,      // nouvel essai si l'heure de panne n'a pas pu être déterminée
            REFRESH_MS: 60_000,          // actualisation automatique
            FETCH_TIMEOUT_MS: 10_000,
            NEARBY_RADIUS_KM: 0.2,       // rayon du filtre « Autour de moi »
            WAIT_THRESHOLDS: { low: 30, medium: 50 },   // minutes : vert / orange / rouge
            LOCALE: 'fr-FR',
            TIMEZONE: 'Europe/Paris',
            PARKS: [
                { value: 'Disneyland Park',        label: 'Parc Disneyland' },
                { value: 'Disney Adventure World', label: 'Adventure World' },
            ],
        };

        // Masqués par défaut (affichés avec « Lieux fermés »). Les lieux « DOWN » (panne temporaire) restent visibles.
        const CLOSED_LABELS = { CLOSED: 'Fermé', REFURBISHMENT: 'En réhabilitation' };
        const HIDDEN_BY_DEFAULT = new Set(Object.keys(CLOSED_LABELS));
        const THEMES = window.DLP_THEMES;
        const THEME_KEY = 'dlp-theme';

        /* ======================================================================
           Utilitaires
           ====================================================================== */
        const $ = (selector) => document.querySelector(selector);

        const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);

        const str = (value) => (typeof value === 'string' ? value.trim() : '');

        const toCoord = (value) => {
            const n = parseFloat(String(value ?? '').replace(',', '.'));
            return Number.isFinite(n) ? n : null;
        };

        const safeUrl = (value) => {
            try {
                const url = new URL(value);
                return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : '';
            } catch { return ''; }
        };

        const searchKey = (value) =>
            String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

        function distanceKm(lat1, lon1, lat2, lon2) {
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad;
            const dLon = (lon2 - lon1) * rad;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
            return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        const formatDistance = (km) => (km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`);

        const timeFormat = new Intl.DateTimeFormat(CONFIG.LOCALE, {
            hour: '2-digit', minute: '2-digit', timeZone: CONFIG.TIMEZONE,
        });

        /* ======================================================================
           Données des lieux : fichiers JSON à la racine du site
           ====================================================================== */
        const DATA_FILES = ['attractions.json', 'restaurants.json', 'shows.json'];

        async function loadList(file) {
            const res = await fetch(file, { cache: 'no-cache' });   // revalide auprès du serveur : une mise à jour du JSON est vue tout de suite
            if (!res.ok) throw new Error(`${file} : HTTP ${res.status}`);
            const data = await res.json();
            if (!Array.isArray(data)) throw new Error(`${file} : un tableau est attendu`);
            return data;
        }

        let attractionsRaw, restaurantsRaw, showsRaw;
        try {
            [attractionsRaw, restaurantsRaw, showsRaw] = await Promise.all(DATA_FILES.map(loadList));
        } catch (error) {
            console.error('Chargement des données impossible :', error);
            $('#list').innerHTML = '<div class="empty">Impossible de charger la liste des lieux.<br>Vérifiez votre connexion puis réessayez.<br><br><button type="button" class="btn-alert" id="btn-reload">Réessayer</button></div>';
            $('#btn-reload').addEventListener('click', () => location.reload());
            return;
        }

        /* ======================================================================
           Modèle de données
           ====================================================================== */
        const FIELDS = {
            attraction: { image: 'URL image', minHeight: 'Taille mini' },
            restaurant: { image: 'Photo', menuUrl: 'Menu', price: 'Tarif' },
            spectacle:  { image: 'Photo' },
        };

        function normalize(raw, category) {
            const f = FIELDS[category];
            return {
                id: str(raw['Code']),
                apiId: str(raw['UUID Themeparks.wiki']).toLowerCase() || null,
                name: str(raw['Nom']),
                category,
                type: str(raw['Type']),
                park: str(raw['Parc']),
                land: str(raw['Land']).replace(' - Town Square', '').replace(' - Central Plaza', '') || 'Autre',
                image: f.image ? str(raw[f.image]) : '',
                description: str(raw['Description']),
                minHeight: f.minHeight ? str(raw[f.minHeight]) : '',
                menuUrl: f.menuUrl ? str(raw[f.menuUrl]) : '',
                price: f.price ? str(raw[f.price]) : '',
                lat: toCoord(raw['Coordonnées GPS (lat)']),
                lng: toCoord(raw['Coordonnées GPS (lng)']),
                live: null,   // { status, wait, single, showtimes } une fois synchronisé
            };
        }

        const db = [
            ...attractionsRaw.map((raw) => normalize(raw, 'attraction')),
            ...restaurantsRaw.map((raw) => normalize(raw, 'restaurant')),
            ...showsRaw.map((raw) => normalize(raw, 'spectacle')),
        ];

        /* ======================================================================
           État de l'application
           ====================================================================== */
        const state = {
            tab: 'attraction',
            park: CONFIG.PARKS[0].value,
            query: '',
            showClosed: false,
            showFavorites: false,
            nearby: false,
            location: null,
            watchId: null,
            selectedId: null,
            ready: false,
            loading: false,
            lastSync: null,
            matches: 0,
        };

        const els = {
            list: $('#list'),
            sync: $('#btn-refresh'),
            syncLabel: $('#sync-label'),
            btnRefresh: $('#btn-refresh'),
            btnTheme: $('#btn-theme'),
            seg: $('#park-seg'),
            parkBtns: [],
            search: $('#search'),
            chipFavs: $('#chip-favs'),
            chipNearby: $('#chip-nearby'),
            chipClosed: $('#chip-closed'),
            btnFav: $('#btn-fav'),
            btnFavCta: $('#btn-fav-cta'),
            tabs: document.querySelectorAll('.tabs button'),
            pane: $('#detail-pane'),
            placeholder: $('#detail-placeholder'),
            content: $('#detail-content'),
            btnBack: $('#btn-back'),
            image: $('#d-image'),
            title: $('#d-title'),
            statusBadge: $('#d-badge'),
            statusText: $('#d-status-text'),
            badges: $('#d-badges'),
            desc: $('#d-desc'),
            menu: $('#d-btn'),
            toast: $('#toast'),
            themeLayer: $('#theme-layer'),
            themeScrim: $('#theme-scrim'),
            themeClose: $('#theme-close'),
            themeGrid: $('#theme-grid'),
            alertBox: $('#d-alert'),
            alertHeading: $('#alert-heading'),
            alertLabel: $('#alert-label'),
            alertNum: $('#alert-num'),
            alertLead: $('#alert-lead'),
            alertUnit: $('#alert-unit'),
            alertInfo: $('#alert-info'),
            alertSave: $('#alert-save'),
            alertRemove: $('#alert-remove'),
            alertStatusRow: $('#alert-status-row'),
            alertStatus: $('#alert-status'),
            alertStatusInfo: $('#alert-status-info'),
        };

        /* ======================================================================
           Statuts
           ====================================================================== */
        const statusOf = (item) => item.live?.status ?? null;
        const isHiddenByDefault = (item) => HIDDEN_BY_DEFAULT.has(statusOf(item));

        const waitKind = (wait) => {
            if (wait == null) return 'off';
            if (wait <= CONFIG.WAIT_THRESHOLDS.low) return 'low';
            if (wait <= CONFIG.WAIT_THRESHOLDS.medium) return 'mid';
            return 'high';
        };

        function upcomingShowtimes(item) {
            const now = Date.now();
            return (item.live?.showtimes ?? [])
                .map((s) => new Date(s.startTime))
                .filter((d) => !Number.isNaN(d.getTime()) && d.getTime() >= now);
        }

        // apiId -> { since: Date|null, checkedAt: ms } : heure de passage en panne, lue dans l'historique de l'API
        const downInfo = new Map();
        const downPending = new Set();

        /**
         * Modèle d'affichage d'un lieu : { kind, big, unit, text, cardExtra }
         *  - kind : low | mid | high | open | show | down | off (couleur du badge)
         *  - big/unit : contenu du badge ; text : libellé de la fiche ; cardExtra : complément en liste
         */
        function statusModel(item) {
            const status = statusOf(item);
            const mk = (kind, big, unit = '', text = '', cardExtra = '') => ({ kind, big, unit, text, cardExtra });

            if (status === 'DOWN') {
                const since = downInfo.get(item.apiId)?.since;
                return mk('down', 'Panne', '', since ? `En panne depuis : ${timeFormat.format(since)}` : 'En panne');
            }
            if (isHiddenByDefault(item)) {
                return mk('off', status === 'CLOSED' ? 'Fermé' : 'Travaux', '', CLOSED_LABELS[status]);
            }

            switch (item.category) {
                case 'attraction': {
                    if (!status) return mk('off', '--', '', 'Données indisponibles');
                    if (status !== 'OPERATING') return mk('off', '--', '', 'Actuellement indisponible');
                    const { wait, single } = item.live;
                    const singleText = single != null ? `Single Rider : ${single} min` : '';
                    return mk(waitKind(wait), wait ?? '--', wait == null ? '' : 'min',
                        ['Temps d’attente actuel', singleText].filter(Boolean).join(' · '), singleText);
                }
                case 'spectacle': {
                    const upcoming = upcomingShowtimes(item);
                    if (upcoming.length) {
                        const times = upcoming.map((d) => timeFormat.format(d)).join(' • ');
                        return mk('show', timeFormat.format(upcoming[0]), 'séance', `Prochaines séances : ${times}`, times);
                    }
                    if (item.live?.showtimes?.length) return mk('off', 'Terminé', '', 'Plus de séance aujourd’hui');
                    if (status === 'OPERATING') return mk('show', 'En cours', '', 'En cours');
                    return mk('off', '--', '', 'Horaires indisponibles');
                }
                case 'restaurant':
                    return status === 'OPERATING'
                        ? mk('open', 'Ouvert', '', 'Ouvert actuellement')
                        : mk('off', '--', '', 'Horaires indisponibles');
                default:
                    return mk('off', '--');
            }
        }

        function badgeHtml(m) {
            const big = String(m.big);
            const size = /^(\d{1,3}|--)$/.test(big) ? '' : /^\d\d:\d\d$/.test(big) ? ' tm' : ' sm';
            return `<span class="badge ${m.kind}${size}">${esc(big)}${m.unit ? `<small>${esc(m.unit)}</small>` : ''}</span>`;
        }

        /* ======================================================================
           Synchronisation avec l'API temps réel
           ====================================================================== */
        async function fetchJson(url, timeoutMs) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        function applyLive(liveData) {
            const byId = new Map();
            for (const entry of liveData) {
                if (entry?.id) byId.set(String(entry.id).toLowerCase(), entry);
            }

            let matches = 0;
            for (const item of db) {
                const live = item.apiId && byId.get(item.apiId);
                if (!live) continue;
                matches++;
                item.live = {
                    status: live.status ?? null,
                    wait: live.queue?.STANDBY?.waitTime ?? null,
                    single: live.queue?.SINGLE_RIDER?.waitTime ?? null,
                    showtimes: Array.isArray(live.showtimes) ? live.showtimes : [],
                };
                if (item.live.status !== 'DOWN') downInfo.delete(item.apiId);   // la panne est terminée
            }
            return matches;
        }

        /**
         * Le flux « live » ne donne pas la date de début de panne. L'historique de l'API
         * (une ligne par changement d'état, ordre chronologique) permet de la retrouver :
         * on remonte la dernière série de lignes consécutives en statut DOWN.
         */
        function findDownSince(history) {
            const rows = (history?.history ?? history?.entities?.[0]?.history ?? [])
                .filter((row) => row?.time && !Number.isNaN(new Date(row.time).getTime()))
                .sort((a, b) => new Date(a.time) - new Date(b.time));

            if (!rows.length || rows[rows.length - 1].status !== 'DOWN') return null;
            let i = rows.length - 1;
            while (i > 0 && rows[i - 1].status === 'DOWN') i--;
            return new Date(rows[i].time);
        }

        async function loadDownSince() {
            const now = Date.now();
            const targets = db.filter((item) => {
                if (!item.apiId || statusOf(item) !== 'DOWN' || downPending.has(item.apiId)) return false;
                const info = downInfo.get(item.apiId);
                return !info || (!info.since && now - info.checkedAt > CONFIG.DOWN_RETRY_MS);
            });
            if (!targets.length) return;

            await Promise.all(targets.map(async (item) => {
                downPending.add(item.apiId);
                let since = null;
                try {
                    since = findDownSince(await fetchJson(CONFIG.API_HISTORY_URL(item.apiId), CONFIG.FETCH_TIMEOUT_MS));
                } catch (error) {
                    console.warn(`Historique indisponible pour « ${item.name} » :`, error);
                } finally {
                    downPending.delete(item.apiId);
                    downInfo.set(item.apiId, { since, checkedAt: Date.now() });
                }
            }));
            render();
        }

        function setSync(mode) {
            els.sync.dataset.state = mode;
            if (mode === 'live') {
                els.syncLabel.textContent = `En direct · ${timeFormat.format(state.lastSync)}`;
                els.sync.title = `${state.matches}/${db.length} lieux synchronisés. Appuyez pour actualiser.`;
            } else if (mode === 'error') {
                els.syncLabel.textContent = 'Hors connexion';
                els.sync.title = 'Impossible de joindre le service. Appuyez pour réessayer.';
            } else {
                els.syncLabel.textContent = 'Synchronisation…';
                els.sync.title = '';
            }
        }

        async function refresh() {
            if (state.loading) return;
            state.loading = true;
            els.btnRefresh.disabled = true;
            els.btnRefresh.classList.add('is-spinning');
            if (!state.lastSync) setSync('loading');

            const pulling = alerts.size ? pullServerState() : null;   // en parallèle de l'appel à l'API
            let ok = false;
            try {
                const data = await fetchJson(CONFIG.API_LIVE_URL, CONFIG.FETCH_TIMEOUT_MS);
                state.matches = applyLive(data.liveData ?? []);
                state.lastSync = new Date();
                setSync('live');
                ok = true;
            } catch (error) {
                console.error('Synchronisation impossible :', error);
                setSync('error');
            } finally {
                state.loading = false;
                state.ready = true;
                els.btnRefresh.disabled = false;
                els.btnRefresh.classList.remove('is-spinning');
                await pulling;
                checkAlerts();
                render();
            }
            if (ok) loadDownSince();   // sans bloquer l'affichage
        }

        /* ======================================================================
           Alertes : seuil d'attente (attractions) et avance sur l'horaire (spectacles)
           ====================================================================== */
        const ALERTS_KEY = 'dlp-alerts';
        const dbById = new Map(db.map((item) => [item.id, item]));

        /* ======================================================================
           Favoris (attractions, restaurants, spectacles) : stockés sur l'appareil
           ====================================================================== */
        const FAVORITES_KEY = 'dlp-favorites';
        const favorites = (() => {
            try {
                const saved = JSON.parse(localStorage.getItem(FAVORITES_KEY) ?? '[]');
                return new Set((Array.isArray(saved) ? saved : []).filter((id) => dbById.has(id)));
            } catch { return new Set(); }
        })();

        function saveFavorites() {
            try {
                localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
                return true;
            } catch {
                notify('Impossible d’enregistrer les favoris sur cet appareil.');
                return false;
            }
        }

        const CATEGORY_LABELS = { attraction: 'Attractions', restaurant: 'Restaurants', spectacle: 'Spectacles' };
        const CATEGORY_ORDER = Object.keys(CATEGORY_LABELS);

        // Synchronise l'état visuel des filtres (parcs, puces)
        function syncFilterUi() {
            const locked = state.nearby || state.showFavorites;   // ces modes couvrent les deux parcs
            els.parkBtns.forEach((b) => b.setAttribute('aria-pressed', String(!locked && b.dataset.park === state.park)));
            els.chipNearby.setAttribute('aria-pressed', String(state.watchId != null));
            els.chipClosed.setAttribute('aria-pressed', String(state.showClosed));
            els.chipFavs.setAttribute('aria-pressed', String(state.showFavorites));
        }

        function syncTabsUi() {
            els.tabs.forEach((t) => t.setAttribute('aria-current', String(!state.showFavorites && t.dataset.tab === state.tab)));
        }

        function renderFavButton() {
            els.chipFavs.textContent = favorites.size ? `Favoris (${favorites.size})` : 'Favoris';
            els.chipFavs.setAttribute('aria-pressed', String(state.showFavorites));
        }

        function setShowFavorites(active) {
            state.showFavorites = active;
            syncFilterUi();
            syncTabsUi();
            renderFavButton();
        }

        function toggleFavorite(id) {
            const item = dbById.get(id);
            if (!item) return;
            const wasFavorite = favorites.has(id);
            if (wasFavorite) favorites.delete(id); else favorites.add(id);
            if (!saveFavorites()) {   // échec d'enregistrement : on annule
                if (wasFavorite) favorites.add(id); else favorites.delete(id);
                return;
            }
            notify(wasFavorite ? `${item.name} retiré des favoris` : `${item.name} ajouté aux favoris`);
            renderFavButton();
            renderList();
            renderFavDetailButton(item);
        }

        function renderFavDetailButton(item) {
            const fav = favorites.has(item.id);
            const label = fav ? 'Retirer des favoris' : 'Ajouter aux favoris';
            els.btnFav.setAttribute('aria-pressed', String(fav));
            els.btnFav.setAttribute('aria-label', label);
            els.btnFav.title = label;
            els.btnFavCta.setAttribute('aria-pressed', String(fav));
            els.btnFavCta.textContent = label;
        }

        // id -> { kind: 'wait', threshold, armed, firedAt, firedWait }
        //     | { kind: 'show', lead, done: [startTime, …] }
        const alerts = (() => {
            try {
                const saved = JSON.parse(localStorage.getItem(ALERTS_KEY) ?? '{}');
                return new Map(Object.entries(saved).filter(([id, a]) =>
                    dbById.has(id.split('#')[0]) && ['wait', 'show', 'status'].includes(a?.kind)));
            } catch { return new Map(); }
        })();

        // --- CONFIGURATION PUSH CLOUDFLARE ---
        // Remplacer par votre clé PUBLIQUE générée
        const VAPID_PUBLIC_KEY = 'BF7t3wvEsIR4cELGVe5kJC3T6d3GOUIfwCdZsBMSjBxYyMwU4xBEh0aRXhjQdoTBfSR7o4M3X7fEQznEpumuTIM';
        // Remplacer par l'URL de votre Worker Cloudflare
        const WORKER_URL = 'https://dlp-alert-worker.jordan-sautret.workers.dev/';

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        function saveAlerts() {
            try {
                localStorage.setItem(ALERTS_KEY, JSON.stringify(Object.fromEntries(alerts)));
                return true;
            } catch {
                notify('Impossible d’enregistrer les alertes sur cet appareil.');
                return false;
            }
        }

        /* --- Push à application fermée : abonnement + synchronisation avec le Worker --- */
        const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window;
        const withTimeout = (promise, ms) => Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('délai dépassé')), ms))]);
        const postWorker = (body, timeoutMs = 8000) => fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: AbortSignal.timeout(timeoutMs),
        });

        // Renvoie l'abonnement push de l'appareil (le crée si demandé). Un abonnement créé avec une autre clé VAPID
        // serait rejeté par le service push (403) : on le remplace.
        async function getPushSubscription({ create }) {
            if (!pushSupported()) return null;
            const reg = await withTimeout(navigator.serviceWorker.ready, 4000);
            const key = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
            let sub = await reg.pushManager.getSubscription();
            const current = sub?.options?.applicationServerKey;
            if (sub && current && !(new Uint8Array(current).length === key.length && new Uint8Array(current).every((v, i) => v === key[i]))) {
                await sub.unsubscribe();
                sub = null;
            }
            if (!sub && create) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
            return sub;
        }

        const alertsForServer = () => Object.fromEntries([...alerts].map(([id, a]) => {
            const item = dbById.get(id.split('#')[0]);
            return [id, { ...a, apiId: item?.apiId, name: item?.name, land: item?.land }];
        }));

        async function syncAlerts({ interactive = false } = {}) {
            try {
                const sub = await getPushSubscription({ create: interactive });
                if (!sub) return { ok: false, reason: pushSupported() ? 'pas d’abonnement' : 'non pris en charge' };
                const res = await postWorker({ subscription: sub.toJSON(), alerts: alertsForServer() });
                if (!res.ok) throw new Error(`serveur (HTTP ${res.status})`);
                return { ok: true };
            } catch (error) {
                console.error('Synchronisation des alertes impossible :', error);
                return { ok: false, reason: String(error?.message ?? error) };
            }
        }

        // Le serveur déclenche les alertes quand l'app est fermée : on récupère son état pour ne pas les rejouer en local
        async function pullServerState() {
            if (!alerts.size) return;
            try {
                const sub = await getPushSubscription({ create: false });
                if (!sub) return;
                const res = await postWorker({ action: 'state', subscription: sub.toJSON() }, 3000);
                if (!res.ok) return;
                const remote = (await res.json()).alerts ?? {};
                let changed = false;
                for (const [id, a] of alerts) {
                    const r = remote[id];
                    if (!r || r.kind !== a.kind) continue;
                    if (a.kind === 'wait' && r.threshold === a.threshold && (a.armed !== r.armed || a.firedAt !== r.firedAt)) {
                        Object.assign(a, { armed: r.armed, firedAt: r.firedAt, firedWait: r.firedWait });
                        changed = true;
                    } else if (a.kind === 'show' && r.lead === a.lead) {
                        for (const k of r.done ?? []) if (!a.done.includes(k)) { a.done.push(k); changed = true; }
                    } else if (a.kind === 'status' && a.down !== r.down) {
                        a.down = r.down;
                        changed = true;
                    }
                }
                if (changed) { saveAlerts(); render(); }
            } catch { /* hors connexion : on garde l'état local */ }
        }

        const isIos = () => /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        async function ensureNotifications() {
            if (!('Notification' in window)) {
                notify(isIos()
                    ? 'Sur iPhone/iPad, ajoutez d’abord l’app à l’écran d’accueil pour recevoir des notifications.'
                    : 'Les notifications ne sont pas prises en charge par ce navigateur.');
                return false;
            }
            let permission = Notification.permission;
            if (permission === 'default') permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                notify('Notifications bloquées : autorisez-les dans les réglages du navigateur.');
                return false;
            }
            return true;
        }

        // Passe par le service worker quand il existe (obligatoire sur Android), sinon API Notification directe
        async function sendNotification({ title, body, tag, id }) {
            if (!document.hidden) notify(`${title} — ${body}`);
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const options = { body, tag, renotify: true, data: { id } };
            try {
                const reg = await navigator.serviceWorker?.getRegistration();
                if (reg) return await reg.showNotification(title, options);
            } catch { /* repli ci-dessous */ }
            try { new Notification(title, options); } catch { /* indisponible */ }
        }

        const futureSessions = (item, now) => (item.live?.showtimes ?? [])
            .map((s) => ({ key: s.startTime, start: Date.parse(s.startTime) }))
            .filter((s) => Number.isFinite(s.start) && s.start > now)
            .sort((a, b) => a.start - b.start);

        const isBelow = (live, threshold) =>
            live?.status === 'OPERATING' && live.wait != null && live.wait <= threshold;

        // L'alerte se déclenche au franchissement du seuil, puis se réarme quand l'attente repasse au-dessus
        function checkWaitAlert(item, a) {
            const live = item.live;
            if (isBelow(live, a.threshold)) {
                if (!a.armed) return false;
                a.armed = false;
                a.firedAt = Date.now();
                a.firedWait = live.wait;
                sendNotification({
                    title: `${item.name} : ${live.wait} min d’attente`,
                    body: `Sous votre seuil de ${a.threshold} min, c’est le moment d’y aller !`,
                    tag: `wait-${item.id}`, id: item.id,
                });
                return true;
            }
            if (a.armed) return false;
            a.armed = true;      // attente au-dessus du seuil, ou attraction indisponible : on réarme
            return true;
        }

        function checkShowAlert(item, a, now) {
            let changed = false;
            for (const { key, start } of futureSessions(item, now)) {
                if (a.done.includes(key) || start - now > a.lead * 60_000) continue;
                a.done.push(key);
                changed = true;
                const mins = Math.max(1, Math.round((start - now) / 60_000));
                sendNotification({
                    title: `${item.name} commence dans ${mins} min`,
                    body: `Séance de ${timeFormat.format(start)} · ${item.land}`,
                    tag: `show-${item.id}-${key}`, id: item.id,
                });
            }
            const kept = a.done.filter((key) => Date.parse(key) > now - 86_400_000);
            if (kept.length !== a.done.length) { a.done = kept; changed = true; }
            return changed;
        }

        // Panne (statut DOWN) puis réouverture. Une fermeture du parc remet l'alerte à zéro sans notification.
        function checkStatusAlert(item, a) {
            const status = item.live.status;
            if (status === 'DOWN' && !a.down) {
                a.down = true;
                sendNotification({
                    title: `${item.name} : en panne`,
                    body: 'L’attraction est indisponible. Vous serez prévenu dès sa réouverture.',
                    tag: `status-${item.id}`, id: item.id,
                });
                return true;
            }
            if (status === 'OPERATING' && a.down) {
                a.down = false;
                const wait = item.live.wait;
                sendNotification({
                    title: `${item.name} a rouvert`,
                    body: typeof wait === 'number' ? `Attente actuelle : ${wait} min.` : 'L’attraction est de nouveau disponible.',
                    tag: `status-${item.id}`, id: item.id,
                });
                return true;
            }
            if (a.down && status && status !== 'DOWN' && status !== 'OPERATING') { a.down = false; return true; }
            return false;
        }

        function checkAlerts() {
            if (!alerts.size) return false;
            const now = Date.now();
            let changed = false;
            for (const [key, a] of alerts) {
                const item = dbById.get(key.split('#')[0]);
                if (!item?.live) continue;
                const result = a.kind === 'wait' ? checkWaitAlert(item, a)
                    : a.kind === 'status' ? checkStatusAlert(item, a)
                    : checkShowAlert(item, a, now);
                changed = result || changed;
            }
            if (changed) saveAlerts();
            return changed;
        }

        /* --- Interface de l'alerte dans la fiche détail --- */
        let alertUiFor = null;   // id de la fiche dont les champs ont été initialisés

        function suggestThreshold(item) {
            const wait = item.live?.wait;
            return wait == null ? 30 : Math.max(5, Math.round((wait * 0.7) / 5) * 5);
        }

        function alertInfo(item, a) {
            const now = Date.now();
            if (item.category === 'attraction') {
                const current = item.live?.status === 'OPERATING' && item.live.wait != null
                    ? `Attente actuelle : ${item.live.wait} min.` : 'Attraction actuellement indisponible.';
                if (!a) return `${current} Vous serez prévenu dès que l’attente passe sous le seuil choisi.`;
                if (a.armed) return `Alerte active : notification dès que l’attente est de ${a.threshold} min ou moins. ${current}`;
                return `Notification envoyée à ${timeFormat.format(a.firedAt)} (${a.firedWait} min). ` +
                       `L’alerte se réarme si l’attente repasse au-dessus de ${a.threshold} min.`;
            }
            const sessions = futureSessions(item, now);
            if (!a) {
                return sessions.length
                    ? `Prochaine séance : ${timeFormat.format(sessions[0].start)}. Vous serez prévenu avant chaque séance.`
                    : 'Aucune séance à venir aujourd’hui.';
            }
            const pending = sessions.find((s) => !a.done.includes(s.key));
            if (pending) {
                return `Prochaine alerte à ${timeFormat.format(pending.start - a.lead * 60_000)} ` +
                       `pour la séance de ${timeFormat.format(pending.start)}.`;
            }
            return sessions.length
                ? `Alerte envoyée pour la séance de ${timeFormat.format(sessions[0].start)}.`
                : 'Plus de séance aujourd’hui : l’alerte reprendra à la prochaine séance.';
        }

        function statusInfo(item) {
            const status = item.live?.status;
            if (status === 'DOWN') return 'En panne actuellement : vous serez prévenu dès sa réouverture.';
            if (status === 'OPERATING') return 'En service actuellement : vous serez prévenu en cas de panne.';
            if (status) return 'Actuellement fermée : l’alerte reprendra à l’ouverture.';
            return 'Vous serez prévenu en cas de panne, puis à la réouverture.';
        }

        function renderAlertBox(item) {
            const supported = item.category === 'attraction' || item.category === 'spectacle';
            els.alertBox.hidden = !supported;
            if (!supported) return;

            const isWait = item.category === 'attraction';
            const a = alerts.get(item.id);
            const statusAlert = alerts.get(`${item.id}#status`);

            els.alertHeading.textContent = isWait ? 'Alertes' : 'Alerte avant la séance';
            els.alertLabel.textContent = isWait
                ? 'Me prévenir dès que l’attente est inférieure ou égale à'
                : 'Me prévenir avant chaque séance, à l’avance de';
            els.alertNum.hidden = !isWait;
            els.alertLead.hidden = isWait;
            els.alertUnit.textContent = isWait ? 'min' : 'min avant le début';

            if (alertUiFor !== item.id) {   // n'écrase pas une saisie en cours lors des actualisations
                alertUiFor = item.id;
                if (isWait) els.alertNum.value = a?.threshold ?? suggestThreshold(item);
                else els.alertLead.value = String(a?.lead ?? 45);
            }

            els.alertStatusRow.hidden = !isWait;
            els.alertStatus.checked = Boolean(statusAlert);
            els.alertStatusInfo.hidden = !statusAlert;
            els.alertStatusInfo.textContent = statusAlert ? statusInfo(item) : '';

            els.alertBox.classList.toggle('is-active', Boolean(a || statusAlert));
            els.alertSave.textContent = a ? 'Mettre à jour' : 'Activer l’alerte';
            els.alertRemove.hidden = !a;
            els.alertInfo.textContent = alertInfo(item, a);
        }

        async function onAlertSave() {
            const item = selectedItem();
            if (!item) return;
            const isWait = item.category === 'attraction';

            let threshold = null;
            let lead = null;
            if (isWait) {
                threshold = Number.parseInt(els.alertNum.value, 10);
                if (!Number.isFinite(threshold) || threshold < 5 || threshold > 180) {
                    return notify('Saisissez un seuil entre 5 et 180 minutes.');
                }
            } else {
                lead = Number.parseInt(els.alertLead.value, 10);
            }

            if (!(await ensureNotifications())) return;

            const now = Date.now();
            if (isWait) {
                alerts.set(item.id, {
                    kind: 'wait', threshold,
                    armed: !isBelow(item.live, threshold),   // déjà sous le seuil : on attend la prochaine remontée
                    firedAt: null, firedWait: null,
                });
            } else {
                alerts.set(item.id, {   // les séances déjà dans la fenêtre d'alerte ne déclenchent rien
                    kind: 'show', lead,
                    done: futureSessions(item, now).filter((s) => s.start - now <= lead * 60_000).map((s) => s.key),
                });
            }

            if (saveAlerts()) {
                const label = isWait ? `Alerte activée : ${item.name} ≤ ${threshold} min` : `Alerte activée : ${lead} min avant chaque séance`;
                const sync = await syncAlerts({ interactive: true });
                notify(sync.ok
                    ? label
                    : `${label}. Attention : sans connexion au serveur d’alertes (${sync.reason}), elle ne fonctionnera que l’application ouverte.`);
            } else {
                alerts.delete(item.id);
            }

            renderList();
            renderAlertBox(item);
        }

        // Alerte « panne / réouverture » : s'applique immédiatement, sans bouton de validation
        async function onStatusToggle() {
            const item = selectedItem();
            if (!item || item.category !== 'attraction') return;
            const key = `${item.id}#status`;
            const enable = els.alertStatus.checked;

            if (enable) {
                if (!(await ensureNotifications())) { els.alertStatus.checked = false; return; }
                alerts.set(key, { kind: 'status', down: item.live?.status === 'DOWN' });   // déjà en panne : on prévient à la réouverture
            } else if (!alerts.delete(key)) {
                return;
            }

            if (!saveAlerts()) {
                alerts.delete(key);
                els.alertStatus.checked = false;
            } else if (enable) {
                const label = `Alerte activée : panne et réouverture de ${item.name}`;
                const sync = await syncAlerts({ interactive: true });
                notify(sync.ok
                    ? label
                    : `${label}. Attention : sans connexion au serveur d’alertes (${sync.reason}), elle ne fonctionnera que l’application ouverte.`);
            } else {
                syncAlerts();
                notify('Alerte panne et réouverture désactivée');
            }
            renderList();
            renderAlertBox(item);
        }

        async function onAlertRemove() {
            const item = selectedItem();
            if (!item || !alerts.delete(item.id)) return;

            saveAlerts();
            syncAlerts();
            notify('Alerte supprimée');
            renderList();
            renderAlertBox(item);
        }

        // Ouvre la fiche d'un lieu (clic sur une notification)
        function openFromAlert(id) {
            const item = dbById.get(id);
            if (!item) return;
            if (state.showFavorites) setShowFavorites(false);
            state.tab = item.category;
            if (CONFIG.PARKS.some((p) => p.value === item.park)) state.park = item.park;
            syncFilterUi();
            syncTabsUi();
            openDetail(id);
        }

        /* ======================================================================
           Rendu de la liste
           ====================================================================== */
        function getVisibleEntries() {
            const query = searchKey(state.query);
            const nearbyActive = state.nearby && state.location;
            const entries = [];

            for (const item of db) {
                if (state.showFavorites) {
                    if (!favorites.has(item.id)) continue;   // favoris : toutes catégories, les deux parcs
                } else {
                    if (item.category !== state.tab) continue;
                    if (!nearbyActive && item.park !== state.park) continue;   // « Autour de moi » ignore le parc choisi
                }
                if (!state.showClosed && isHiddenByDefault(item)) continue;
                if (query && !searchKey(item.name).includes(query)) continue;

                let dist = null;
                if (nearbyActive) {
                    if (item.lat == null || item.lng == null) continue;
                    dist = distanceKm(state.location.lat, state.location.lng, item.lat, item.lng);
                    if (dist > CONFIG.NEARBY_RADIUS_KM) continue;
                }
                entries.push({ item, dist });
            }
            return entries;
        }

        // Classement des attractions : temps d'attente décroissant, puis en panne, puis fermées
        function waitRank(item) {
            const live = item.live;
            if (live?.status === 'OPERATING') return live.wait ?? 0;
            return live?.status === 'DOWN' ? -1 : -2;
        }

        function compareEntries(a, b) {
            if (a.dist != null && b.dist != null) return a.dist - b.dist;   // distance croissante
            if (a.item.category === 'attraction' && b.item.category === 'attraction') {
                const diff = waitRank(b.item) - waitRank(a.item);
                if (diff) return diff;
            }
            return a.item.name.localeCompare(b.item.name, CONFIG.LOCALE);
        }

        function cardHtml({ item, dist }) {
            const selected = item.id === state.selectedId;
            const fav = favorites.has(item.id);
            const m = statusModel(item);
            const sub = [
                dist != null ? `à ${formatDistance(dist)}` : '',
                m.kind === 'down' ? m.text : item.type,
                state.showFavorites ? item.park : '',
                m.cardExtra,
            ].filter(Boolean).join(' · ');
            const bell = (alerts.has(item.id) || alerts.has(item.id + '#status'))
                ? '<svg class="icon card-bell" role="img" aria-label="Alerte active"><use href="#i-bell"/></svg>' : '';

            return `
                <div class="card${selected ? ' selected' : ''}">
                    <button type="button" class="main" data-id="${esc(item.id)}"${selected ? ' aria-current="true"' : ''}>
                        ${badgeHtml(m)}
                        <span class="txt">
                            <span class="ttl">${esc(item.name)}${bell}</span>
                            ${sub ? `<span class="sub">${esc(sub)}</span>` : ''}
                        </span>
                    </button>
                    <button type="button" class="heart" data-fav-id="${esc(item.id)}" aria-pressed="${fav}"
                            aria-label="${fav ? 'Retirer' : 'Ajouter'} ${esc(item.name)} ${fav ? 'des' : 'aux'} favoris">
                        <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#i-heart"/></svg>
                    </button>
                </div>`;
        }

        function renderList() {
            if (!state.ready) {
                els.list.innerHTML = '<div class="skeleton"></div>'.repeat(4);
                return;
            }

            const entries = getVisibleEntries();
            if (!entries.length) {
                const hint = state.query
                    ? 'Aucun résultat pour cette recherche.'
                    : state.showFavorites && !favorites.size
                        ? 'Aucun favori pour le moment.<br>Ouvrez la fiche d’un lieu et touchez le cœur pour l’ajouter.'
                    : state.nearby
                        ? `Aucun lieu dans un rayon de ${Math.round(CONFIG.NEARBY_RADIUS_KM * 1000)} m.`
                        : 'Aucun lieu ne correspond à ces critères.';
                els.list.innerHTML = `<div class="empty">${hint}</div>`;
                return;
            }

            // Favoris : regroupés par catégorie ; sinon par land
            const groupOf = (item) => (state.showFavorites ? CATEGORY_LABELS[item.category] : item.land);
            const groups = new Map();
            for (const entry of entries) {
                const key = groupOf(entry.item);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(entry);
            }

            // Lands par ordre alphabétique ; avec « Autour de moi », du plus proche au plus lointain
            const nearest = (land) => Math.min(...groups.get(land).map((e) => e.dist));
            const lands = [...groups.keys()].sort((a, b) => {
                if (state.nearby && state.location) return nearest(a) - nearest(b);
                if (state.showFavorites) {
                    return CATEGORY_ORDER.findIndex((c) => CATEGORY_LABELS[c] === a)
                         - CATEGORY_ORDER.findIndex((c) => CATEGORY_LABELS[c] === b);
                }
                return a.localeCompare(b, CONFIG.LOCALE);
            });

            els.list.innerHTML = lands
                .map((land) => `
                    <section>
                        <h2 class="land">${esc(land)}</h2>
                        ${groups.get(land).sort(compareEntries).map(cardHtml).join('')}
                    </section>`)
                .join('');
        }

        /* ======================================================================
           Détail
           ====================================================================== */
        const selectedItem = () => db.find((item) => item.id === state.selectedId) ?? null;

        function renderDetail() {
            const item = selectedItem();
            els.placeholder.hidden = Boolean(item);
            els.content.hidden = !item;
            if (!item) return;

            els.title.textContent = item.name;
            renderFavDetailButton(item);
            els.desc.textContent = item.description;
            els.desc.hidden = !item.description;

            const m = statusModel(item);
            els.statusBadge.innerHTML = badgeHtml(m);
            els.statusText.textContent = m.text;

            const image = safeUrl(item.image);
            els.image.hidden = !image;
            els.image.alt = '';
            if (image && els.image.getAttribute('src') !== image) els.image.src = image;

            const badges = [
                { text: item.park, kind: 'park' },
                { text: item.land, kind: 'land' },
                { text: item.type },
                item.minHeight && item.minHeight !== 'Pas de restriction'
                    ? { text: `Taille minimale : ${item.minHeight}`, warning: true } : null,
                item.price ? { text: `Tarifs : ${item.price}` } : null,
            ].filter((b) => b && b.text);

            els.badges.innerHTML = badges
                .map((b) => `<li class="pill${b.kind ? ` is-${b.kind}` : ''}${b.warning ? ' is-warning' : ''}">${esc(b.text)}</li>`)
                .join('');

            const menu = safeUrl(item.menuUrl);
            els.menu.hidden = !menu;
            if (menu) els.menu.href = menu;
            renderAlertBox(item);
        }

        function openDetail(id) {
            state.selectedId = id;
            renderList();
            renderDetail();
            els.pane.classList.add('is-open');           // visible uniquement en mobile (cf. CSS)
            els.pane.scrollTop = 0;
            els.btnBack.focus({ preventScroll: true });
        }

        function closeDetail() {
            const previousId = state.selectedId;
            if (previousId == null) return;
            state.selectedId = null;
            alertUiFor = null;
            els.pane.classList.remove('is-open');
            renderList();
            renderDetail();
            els.list.querySelector(`.main[data-id="${CSS.escape(previousId)}"]`)?.focus({ preventScroll: true });
        }

        function render() {
            renderList();
            renderDetail();
        }

        /* ======================================================================
           Thèmes
           ====================================================================== */
        const currentTheme = () => document.documentElement.dataset.theme;

        function updateThemeLabel() {
            els.btnTheme.setAttribute('aria-label', `Changer de thème (actuel : ${THEMES[currentTheme()]?.n ?? ''})`);
        }

        function setTheme(id) {
            window.DLP_applyTheme(id);
            try { localStorage.setItem(THEME_KEY, currentTheme()); } catch { /* stockage indisponible */ }
            updateThemeLabel();
        }

        function renderThemes() {
            const active = currentTheme();
            els.themeGrid.innerHTML = Object.entries(THEMES).map(([id, t]) => `
                <button type="button" class="th" data-theme-id="${esc(id)}" aria-pressed="${id === active}">
                    <span class="sw"><i style="background:${t.ink}"></i><i style="background:${t.gold}"></i><i style="background:${t.acc}"></i><i style="background:${t.bg}"></i></span>
                    <span><span class="th-n">${esc(t.n)}</span><span class="th-f">${esc(t.f)}</span></span>
                </button>`).join('');
        }

        function openThemes() {
            renderThemes();
            els.themeLayer.hidden = false;
            els.themeClose.focus();
        }

        function closeThemes() {
            els.themeLayer.hidden = true;
            els.btnTheme.focus({ preventScroll: true });
        }

        /* ======================================================================
           Interactions
           ====================================================================== */
        let toastTimer;
        function notify(message) {
            els.toast.textContent = message;
            els.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('show'), 4000);
        }

        /* « Autour de moi » : position suivie en continu pour garder les distances à jour */
        function setNearbyUi(active) {
            state.nearby = active;
            syncFilterUi();
        }

        function stopNearby() {
            if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
            state.watchId = null;
            state.location = null;
            setNearbyUi(false);
        }

        function onPosition({ coords }) {
            const previous = state.location;
            state.location = { lat: coords.latitude, lng: coords.longitude };

            const firstFix = !state.nearby;
            if (firstFix) setNearbyUi(true);
            const moved = !previous ||
                distanceKm(previous.lat, previous.lng, state.location.lat, state.location.lng) > 0.015;
            if (firstFix || moved) renderList();
        }

        function onPositionError(error) {
            if (state.nearby && error.code === 3) return;   // délai dépassé : on garde la dernière position
            stopNearby();
            notify('Autorisez la géolocalisation pour afficher les lieux proches.');
            renderList();
        }

        function onNearbyClick() {
            if (state.watchId != null) {
                stopNearby();
                return renderList();
            }
            if (!('geolocation' in navigator)) {
                return notify('La géolocalisation n’est pas disponible sur cet appareil.');
            }
            state.watchId = navigator.geolocation.watchPosition(onPosition, onPositionError,
                { enableHighAccuracy: true, timeout: 20_000, maximumAge: 15_000 });
            syncFilterUi();
        }

        function bindEvents() {
            els.seg.innerHTML = CONFIG.PARKS
                .map((p) => `<button type="button" data-park="${esc(p.value)}" aria-pressed="false">${esc(p.label)}</button>`).join('');
            els.parkBtns = [...els.seg.querySelectorAll('button')];
            els.parkBtns.forEach((btn) => btn.addEventListener('click', () => {
                if (state.watchId != null || state.nearby) stopNearby();   // choisir un parc quitte « Autour de moi » et les favoris
                if (state.showFavorites) setShowFavorites(false);
                state.park = btn.dataset.park;
                syncFilterUi();
                syncTabsUi();
                closeDetail();
                renderList();
            }));

            els.search.addEventListener('input', () => { state.query = els.search.value; renderList(); });
            els.chipClosed.addEventListener('click', () => { state.showClosed = !state.showClosed; syncFilterUi(); renderList(); });
            els.chipNearby.addEventListener('click', onNearbyClick);
            els.chipFavs.addEventListener('click', () => {
                closeDetail();
                setShowFavorites(!state.showFavorites);
                renderList();
                els.list.scrollTop = 0;
            });
            const favFromDetail = () => { if (state.selectedId) toggleFavorite(state.selectedId); };
            els.btnFav.addEventListener('click', favFromDetail);
            els.btnFavCta.addEventListener('click', favFromDetail);

            els.tabs.forEach((tab) => tab.addEventListener('click', () => {
                state.tab = tab.dataset.tab;
                setShowFavorites(false);   // choisir une catégorie quitte la vue favoris
                closeDetail();
                renderList();
                els.list.scrollTop = 0;
            }));

            els.list.addEventListener('click', (event) => {
                const favBtn = event.target.closest('.heart');
                if (favBtn) {
                    const id = favBtn.dataset.favId;
                    toggleFavorite(id);
                    els.list.querySelector(`.heart[data-fav-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
                    return;
                }
                const card = event.target.closest('.main');
                if (card) openDetail(card.dataset.id);
            });

            els.btnBack.addEventListener('click', closeDetail);
            els.alertSave.addEventListener('click', onAlertSave);
            els.alertRemove.addEventListener('click', onAlertRemove);
            els.alertStatus.addEventListener('change', onStatusToggle);
            els.image.addEventListener('error', () => { els.image.hidden = true; });
            els.btnRefresh.addEventListener('click', refresh);

            els.btnTheme.addEventListener('click', openThemes);
            els.themeClose.addEventListener('click', closeThemes);
            els.themeScrim.addEventListener('click', closeThemes);
            els.themeGrid.addEventListener('click', (event) => {
                const btn = event.target.closest('.th');
                if (!btn) return;
                setTheme(btn.dataset.themeId);
                closeThemes();
            });

            document.addEventListener('keydown', (event) => {
                if (event.key !== 'Escape') return;
                if (!els.themeLayer.hidden) return closeThemes();
                closeDetail();
            });

            // Actualisation automatique, uniquement quand l'onglet est visible
            // Avec des alertes actives, on continue d'actualiser même onglet masqué
            setInterval(() => { if (!document.hidden || alerts.size) refresh(); }, CONFIG.REFRESH_MS);
            // Les alertes de spectacles dépendent de l'horloge : vérification plus fréquente sur les données en cache
            setInterval(() => { if (checkAlerts()) render(); }, 30_000);
            document.addEventListener('visibilitychange', () => {
                const stale = !state.lastSync || Date.now() - state.lastSync.getTime() > CONFIG.REFRESH_MS / 2;
                if (!document.hidden) pullServerState();
                if (!document.hidden && stale) refresh();
            });
        }

        /* ======================================================================
           Démarrage
           ====================================================================== */
        function init() {
            bindEvents();
            updateThemeLabel();
            syncFilterUi();
            syncTabsUi();
            renderFavButton();
            render();     // affiche les squelettes de chargement
            refresh();
            if (alerts.size) syncAlerts();   // met à jour le serveur (alertes créées avant la dernière version comprises)

            // Ouverture depuis une notification (service worker ou lien #id)
            navigator.serviceWorker?.addEventListener('message', (event) => {
                if (event.data?.type === 'open-item') openFromAlert(event.data.id);
                if (event.data?.type === 'refresh-data') refresh();
            });
            if (location.hash.length > 1) openFromAlert(decodeURIComponent(location.hash.slice(1)));

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch(() => {});
                });
            }
        }

        init();
    })();
    </script>
</body>
</html>
