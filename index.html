<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disney Companion</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Disney App">
    
    <style>
        /* --- THEMES CLAIR & SOMBRE (Bleu Nuit) --- */
        :root {
            --primary: #007AFF;
            --bg-base: #F2F2F7;
            --bg-surface: #FFFFFF;
            --nav-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --border: #E5E5EA;
            --green: #34C759;
            --orange: #FF9500;
            --red: #FF3B30;
            --shadow: 0 4px 14px rgba(0,0,0,0.05);
            --radius: 16px;
        }

        [data-theme="dark"] {
            --primary: #5AC8FA; 
            --bg-base: #0B132B; /* Bleu nuit très profond */
            --bg-surface: #1C2541; /* Bleu nuit cartes */
            --nav-bg: #141B33;
            --text-main: #F2F2F7;
            --text-muted: #8DA0CB;
            --border: #2A365C;
            --shadow: 0 4px 14px rgba(0,0,0,0.4);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* --- STRUCTURE PRINCIPALE --- */
        .master-pane {
            width: 380px;
            background-color: var(--bg-base);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .header {
            padding: 16px 20px;
            background: color-mix(in srgb, var(--bg-surface) 90%, transparent);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            font-weight: 800; font-size: 20px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .api-status {
            font-size: 11px; padding: 4px 8px; border-radius: 12px;
            background: var(--border); color: var(--text-muted); font-weight: 600;
        }
        .api-status.live { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }

        .btn-icon { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; }

        /* --- FILTRES EPURÉS --- */
        .filters-container {
            padding: 16px; background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }
        
        .park-select {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--bg-base); color: var(--text-main); font-size: 15px; font-weight: 700;
            margin-bottom: 16px; outline: none; appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238E8E93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 14px top 50%; background-size: 10px auto;
        }

        .toggles-row { display: flex; justify-content: space-between; gap: 16px; }
        
        .toggle-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted);}
        
        /* Interrupteur iOS */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border); transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- LISTE --- */
        .list-container { flex: 1; overflow-y: auto; padding: 4px 16px; }
        .group-header {
            font-size: 12px; font-weight: 800; color: var(--text-muted);
            margin: 20px 4px 8px 4px; text-transform: uppercase; letter-spacing: 0.8px;
        }

        .card {
            background: var(--bg-surface); border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer;
            border: 2px solid transparent; transition: transform 0.2s ease, border-color 0.2s;
        }
        .card:hover, .card.selected { border-color: var(--primary); transform: translateY(-2px); }
        .card-title { font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 6px;}
        
        .wait-times { display: flex; flex-direction: column; gap: 4px; font-size: 15px; font-weight: 700; margin-top: 10px;}
        .wait-normal.green { color: var(--green); }
        .wait-normal.orange { color: var(--orange); }
        .wait-normal.red { color: var(--red); }
        .wait-single { color: var(--text-muted); font-size: 13px; font-weight: 600;}
        
        .status-pill { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; width: max-content;}
        .status-closed { background-color: var(--red); color: #FFF; }
        .status-open { background-color: var(--green); color: #FFF; }
        .status-missing { background-color: var(--border); color: var(--text-muted); }

        /* --- NAVIGATION BASSE (Mobile Style) --- */
        .bottom-nav {
            display: flex; background: var(--nav-bg); border-top: 1px solid var(--border);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px 0; color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 600; gap: 4px;
            transition: color 0.2s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; }

        /* --- COLONNE DROITE (Détail) --- */
        .detail-pane {
            flex: 1; background-color: var(--bg-surface); padding: 40px;
            overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }
        .detail-content { width: 100%; max-width: 700px; display: none; }
        .detail-image {
            width: 100%; height: 350px; border-radius: 20px; margin-bottom: 24px;
            object-fit: cover; background-color: var(--bg-base); box-shadow: var(--shadow);
        }
        .detail-title { font-size: 32px; font-weight: 900; margin: 0 0 12px 0; letter-spacing: -0.5px;}
        .badges { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .badge { background: var(--bg-base); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .detail-desc { font-size: 17px; line-height: 1.6; color: var(--text-muted); }
        
        .btn-menu {
            display: block; background: var(--primary); color: white; padding: 16px; border-radius: 12px;
            text-decoration: none; font-weight: 700; font-size: 16px; margin-top: 30px; text-align: center;
            box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 40%, transparent); transition: opacity 0.2s;
        }
        .btn-menu:hover { opacity: 0.8; }

        .btn-back {
            display: none; background: none; border: none; color: var(--primary);
            font-size: 17px; font-weight: 600; padding: 10px 0; margin-bottom: 15px;
            cursor: pointer; text-align: left; width: 100%; align-items: center; gap: 6px;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .master-pane { width: 100%; border-right: none; }
            .detail-pane { display: none; }
            .detail-pane.show-mobile {
                display: flex !important; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
                z-index: 100; padding: 20px; box-sizing: border-box; background: var(--bg-surface);
            }
            .btn-back { display: flex; }
            .detail-image { height: 220px; border-radius: 16px;}
            .detail-title { font-size: 26px; }
            .detail-content { padding-bottom: 40px; }
        }
    </style>
</head>
<body>

    <div class="master-pane">
        <!-- En-tête -->
        <div class="header">
            <span>Disney Companion</span>
            <div style="display:flex; align-items:center; gap: 12px;">
                <span id="api-status" class="api-status">📡 Sync...</span>
                <button class="btn-icon" onclick="toggleTheme()">🌓</button>
            </div>
        </div>
        
        <!-- Panneau de filtres -->
        <div class="filters-container">
            <select class="park-select" id="park-select" onchange="setPark(this.value)">
                <option value="Disneyland Park">Parc Disneyland</option>
                <option value="Disney Adventure World">Disney Adventure World</option>
            </select>
            
            <div class="toggles-row">
                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="toggle-closed" onchange="toggleClosed()">
                        <span class="slider"></span>
                    </label>
                    Lieux fermés
                </div>
                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="toggle-nearby" onchange="toggleNearby()">
                        <span class="slider"></span>
                    </label>
                    📍 -200m
                </div>
            </div>
        </div>

        <!-- Liste Principale -->
        <div class="list-container" id="list"></div>

        <!-- Navigation Mobile Basse -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('attraction', this)">
                <span class="nav-icon">🎢</span>
                <span>Attractions</span>
            </div>
            <div class="nav-item" onclick="switchTab('restaurant', this)">
                <span class="nav-icon">🍔</span>
                <span>Restos</span>
            </div>
            <div class="nav-item" onclick="switchTab('spectacle', this)">
                <span class="nav-icon">🎭</span>
                <span>Shows</span>
            </div>
        </div>
    </div>

    <!-- Panneau Détail -->
    <div class="detail-pane">
        <div id="detail-placeholder" style="color: var(--text-muted); font-size: 16px; margin-top: 30vh; font-weight: 500;">
            Sélectionnez un lieu pour afficher les détails
        </div>
        <div id="detail-content" class="detail-content">
            <button id="btn-back" class="btn-back" onclick="closeDetail()">
                <svg width="12" height="20" viewBox="0 0 12 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.63 1.94L9.69 0L0 9.69L9.69 19.38L11.63 17.44L3.88 9.69L11.63 1.94Z"/>
                </svg>
                Retour
            </button>
            <img id="d-image" class="detail-image" src="" alt="Image">
            <h1 class="detail-title" id="d-title">Titre</h1>
            <div class="wait-times" id="d-wait-times" style="margin-bottom: 24px; font-size: 18px;"></div>
            <div class="badges" id="d-badges"></div>
            <div class="detail-desc" id="d-desc"></div>
            <a href="#" target="_blank" class="btn-menu" id="d-btn">Voir le Menu Officiel</a>
        </div>
    </div>

    <script>
        // --- THEME SOMBRE AUTOMATIQUE ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
        initTheme();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        const showsRaw = [{"Code":"P1MSSH01","UUID Themeparks.wiki":"777518c2-1c65-48ba-94a1-e19583c44bf5","Nom":"Disney Stars On Parade","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/n027586-n027588_2024dec18_world_disney-stars-on-parade_full-width-desktop_bkg-grey-F7F7F7_tcm808-229644.jpg","Description":"Rêvez au passage de Peter Pan sur son trois-mâts volant, laissez-vous porter par le délicieux vent de glace d’Elsa !","Type":"Parade ","Parc":"Disneyland Park","Land":"Main Street U.S.A","Coordonnées GPS (lat)":"48.872405","Coordonnées GPS (lng)":"2.777057"},{"Code":"P1MSSH02","UUID Themeparks.wiki":"7d0660a9-cc08-45c0-9ab7-2699f5369771","Nom":"Disney Tales of Magic","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/N041521_5_2032Jan14_world_disney-tales-of-magic-without-drones_fullwidth-landing-page_desktop_tcm808-292796.jpg","Description":"Sentez votre cœur vibrer au rythme d'une multitude de classiques intemporels.","Type":"Spectacle nocturne","Parc":"Disneyland Park","Land":"Main Street U.S.A","Coordonnées GPS (lat)":"48.872405","Coordonnées GPS (lng)":"2.777057"},{"Code":"P1FRLSH01","UUID Themeparks.wiki":"78abb817-4564-41e2-b0de-fa0df34664c1","Nom":"Le Roi Lion et les Rythmes de la Terre","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/n031658_2026jun28_lion-king-show-cast_16-9_tcm808-225640.jpg","Description":"Revivez les moments cultes du film Le Roi Lion devant ce spectacle exclusif à Disneyland Paris !","Type":"Spectacle sur scène","Parc":"Disneyland Park","Land":"Frontierland","Coordonnées GPS (lat)":"48.870408","Coordonnées GPS (lng)":"2.772633"},{"Code":"P2WPSH01","UUID Themeparks.wiki":"0f5cce1d-69ed-4fad-9505-a1914dd150cb","Nom":"Mickey et le Magicien","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/n024300_2_2023jun30_world_mickey-and-the-magician-show-dlp-30th-anniversay_16-9_tcm808-233264.jpg","Description":"Suivez Mickey dans son apprentissage de tours de magie.","Type":"Spectacle sur scène","Parc":"Disney Adventure World","Land":"World Premiere","Coordonnées GPS (lat)":"48.867944","Coordonnées GPS (lng)":"2.778655"},{"Code":"P2WPSH02","UUID Themeparks.wiki":"f2a48cc2-4dc3-47fd-9992-0c30eeba24f0","Nom":"Stitch Live!","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/n014365_2027mar15_stitch_16-9_tcm808-158820.jpg","Description":"Cowabunga ! Discutez et chantez avec l’attachant petit homme bleu.","Type":"Spectacle intéractif","Parc":"Disney Adventure World","Land":"World Premiere","Coordonnées GPS (lat)":"48.866654","Coordonnées GPS (lng)":"2.780003"},{"Code":"P2WPSH03","UUID Themeparks.wiki":"3bdddd5f-6ec1-4143-a915-2e95b2fa275f","Nom":"Animation Academy","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/n036114_2050dec31_world_animation-celebration-academy-children-drawings-audiovisuel-castmember_16-9_tcm808-227264.jpg","Description":"Rejoignez l’académie et apprenez à dessiner un personnage Disney !","Type":"Spetacle intéractif","Parc":"Disney Adventure World","Land":"World Premiere","Coordonnées GPS (lat)":"48.867585","Coordonnées GPS (lng)":"2.778413"},{"Code":"P2WPSH04","UUID Themeparks.wiki":"72d20d9c-1f46-4866-b9b9-b428d0aaf6e8","Nom":"Together : une Aventure Musicale Pixar","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/n037700_2030jul26_world_together-a-pixar-musical-adventure-show_16-9_tcm808-267370.jpg","Description":"Éveillez ensemble vos sens lors d'une aventure poétique qui vous fera voyager à travers les mondes merveilleux de Pixar.","Type":"Spectacle sur scène","Parc":"Disney Adventure World","Land":"World Premiere","Coordonnées GPS (lat)":"48.867185","Coordonnées GPS (lng)":"2.779754"},{"Code":"P2WPSH05","UUID Themeparks.wiki":"cd486865-9d66-4860-8111-303b3f56c71f","Nom":"La Fabrique des Rêves de Minnie","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/N042980_2033feb16_world_show-minnies-dream-factory_5-2_tcm808-292631.jpg","Description":"Laissez-vous transporter dans un spectacle musical immersif revisité avec Minnie et ses amis.","Type":"Spectacle sur scène","Parc":"Disney Adventure World","Land":"World Premiere","Coordonnées GPS (lat)":"48.866996","Coordonnées GPS (lng)":"2.780283"},{"Code":"P2AWSH01","UUID Themeparks.wiki":"75d60cb3-c95c-4ce2-aeb4-36e4050f14f3","Nom":"Miguel's Fiesta Latina","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/N041843_2032May11_world_disney-music-festival-miguel-fiesta-latina_16-9_tcm808-287978.jpg","Description":"Accompagné de ses mariachis, Miguel est à la recherche de nouveaux musiciens.","Type":"Spectacle en exterieur","Parc":"Disney Adventure World","Land":"Adventure Way","Coordonnées GPS (lat)":"48.866776","Coordonnées GPS (lng)":"2.777963"},{"Code":"P2AWSH02","UUID Themeparks.wiki":"943860c5-c931-4212-a387-9e5cd139179d","Nom":"La Cavalcade des Princesses Disney","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/n043696_2033jul22_world_disney-princess-cavalcade_16-9_tcm808-296294.jpg","Description":"Partez à la poursuite de vos rêves comme Vaiana, Tiana, Raiponce et Raya !","Type":"Parade ","Parc":"Disney Adventure World","Land":"Adventure Way","Coordonnées GPS (lat)":"48.866776","Coordonnées GPS (lng)":"2.777963"},{"Code":"P2AWSH03","UUID Themeparks.wiki":"2c51b641-2398-4833-8e1a-346fd7fe09db","Nom":"Disney Cascade of Lights","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/hd19798_2032sep01_world_cascade-of-lights-key-visual_16-9_tcm808-291191.jpg","Description":"Assistez à un spectacle nocturne unique qui illumine Adventure Bay.","Type":"Spectacle nocturne","Parc":"Disney Adventure World","Land":"Adventure Way","Coordonnées GPS (lat)":"48.865675","Coordonnées GPS (lng)":"2.775986"},{"Code":"P2WOFSH01","UUID Themeparks.wiki":"c122d2e4-7fb7-4360-bb73-f0dc37a38179","Nom":"Célébration à Arendelle","Photo":"https://media.disneylandparis.com/d4th/fr-fr/images/n043243_2033mar13_world_daw-a-celebration-in-arendelle-show-finale_16-9_tcm808-294256.jpg","Description":"Rejoignez les habitants du royaume pour un spectacle festif inédit.","Type":"Spectacle en exterieur","Parc":"Disney Adventure World","Land":"World of Frozen","Coordonnées GPS (lat)":"48.864459","Coordonnées GPS (lng)":"2.773738"}];

        const localDb = [
            ...attractionsRaw.map(item => ({
                id: item["Code"],
                api_id: item["UUID Themeparks.wiki"] ? item["UUID Themeparks.wiki"].trim().toLowerCase() : null,
                name: item["Nom"],
                category: "attraction",
                type: item["Type"],
                park: item["Parc"].trim(),
                land: item["Land"].trim().replace(" - Town Square", "").replace(" - Central Plaza", ""),
                image: item["URL image"],
                description: item["Description"],
                minHeight: item["Taille mini"],
                lat: parseFloat(item["Coordonnées GPS (lat)"].replace(',', '.')),
                lng: parseFloat(item["Coordonnées GPS (lng)"].replace(',', '.'))
            })),
            ...restaurantsRaw.map(item => ({
                id: item["Code"],
                api_id: item["UUID Themeparks.wiki"] ? item["UUID Themeparks.wiki"].trim().toLowerCase() : null,
                name: item["Nom"],
                category: "restaurant",
                type: item["Type"],
                park: item["Parc"].trim(),
                land: item["Land"].trim().replace(" - Town Square", "").replace(" - Central Plaza", ""),
                image: item["Photo"],
                description: item["Description"],
                menuUrl: item["Menu"],
                price: item["Tarif"],
                lat: parseFloat(item["Coordonnées GPS (lat)"].replace(',', '.')),
                lng: parseFloat(item["Coordonnées GPS (lng)"].replace(',', '.'))
            })),
            ...showsRaw.map(item => ({
                id: item["Code"],
                api_id: item["UUID Themeparks.wiki"] ? item["UUID Themeparks.wiki"].trim().toLowerCase() : null,
                name: item["Nom"],
                category: "spectacle",
                type: item["Type"],
                park: item["Parc"].trim(),
                land: item["Land"].trim().replace(" - Town Square", "").replace(" - Central Plaza", ""),
                image: item["Photo"],
                description: item["Description"],
                lat: parseFloat(item["Coordonnées GPS (lat)"].replace(',', '.')),
                lng: parseFloat(item["Coordonnées GPS (lng)"].replace(',', '.'))
            }))
        ];

        // --- ETAT DE L'APPLICATION ---
        let currentTab = 'attraction';
        let currentPark = 'Disneyland Park'; // Parc par défaut
        let showClosed = false; // Masquer les fermés par défaut
        let isNearbyActive = false;
        let userLocation = null;
        let apiData = [];

        const URL_DLP_RESORT = "https://api.themeparks.wiki/v1/entity/e8d0207f-da8a-4048-bec8-117aa946b2c2/live";

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2-lat1) * (Math.PI/180);
            const dLon = (lon2-lon1) * (Math.PI/180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        async function init() {
            try {
                const options = { cache: 'no-store' };
                const res = await fetch(URL_DLP_RESORT, options);
                const data = await res.json();
                
                apiData = data.liveData || [];
                let matches = 0;
                
                localDb.forEach(localItem => {
                    if (localItem.api_id) {
                        const liveItem = apiData.find(api => api.id && api.id.toLowerCase() === localItem.api_id);
                        if (liveItem) {
                            matches++;
                            localItem.status = liveItem.status;
                            if (liveItem.queue?.STANDBY) {
                                localItem.wait = liveItem.queue.STANDBY.waitTime;
                            }
                            if (liveItem.queue?.SINGLE_RIDER) {
                                localItem.single = liveItem.queue.SINGLE_RIDER.waitTime;
                            }
                            if (liveItem.showtimes) {
                                localItem.showtimes = liveItem.showtimes;
                            }
                        }
                    }
                });

                document.getElementById('api-status').innerText = `🟢 Sync (${matches}/${localDb.length})`;
                document.getElementById('api-status').classList.add('live');
                
            } catch (error) {
                console.error("Erreur API:", error);
                document.getElementById('api-status').innerText = "🔴 Erreur Réseau";
            }
            renderList();
        }

        function getColorClass(wait) {
            if (wait == null) return '';
            if (wait <= 30) return 'green';
            if (wait <= 50) return 'orange';
            return 'red';
        }

        function getStatusHtml(item) {
            let html = '';
            
            if (item.status === 'CLOSED' || item.status === 'DOWN' || item.status === 'REFURBISHMENT') {
                const reason = item.status === 'REFURBISHMENT' ? 'En réhabilitation' : 'Fermé';
                return `<div class="status-pill status-closed">${reason}</div>`;
            }

            if (item.category === 'attraction') {
                if (item.status === 'OPERATING') {
                    const color = getColorClass(item.wait);
                    html += `<div class="wait-row wait-normal ${color}">${item.wait !== undefined ? item.wait : '--'} min</div>`;
                    if (item.single !== undefined && item.single !== null) {
                        html += `<div class="wait-row wait-single">Single Rider: ${item.single} min</div>`;
                    }
                } else if (!item.status) {
                    html = `<div class="status-pill status-missing">Données introuvables</div>`;
                }
            } else if (item.category === 'spectacle') {
                if (item.showtimes && item.showtimes.length > 0) {
                    const times = item.showtimes.map(st => {
                        const d = new Date(st.startTime);
                        return d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
                    }).join(' • ');
                    html = `<div style="color: var(--primary); font-size: 14px;">Prochaines séances : ${times}</div>`;
                } else if (item.status === 'OPERATING') {
                    html = `<div style="color: var(--primary);">✨ En cours</div>`;
                }
            } else if (item.category === 'restaurant') {
                if (item.status === 'OPERATING') {
                    html = `<div class="status-pill status-open">Ouvert</div>`;
                }
            }
            return html;
        }

        // --- ACTIONS UTILISATEUR ---
        function setPark(parkName) {
            currentPark = parkName;
            renderList();
        }

        function switchTab(tabCategory, btnElement) {
            currentTab = tabCategory;
            const buttons = btnElement.parentElement.querySelectorAll('.nav-item');
            buttons.forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderList();
        }

        function toggleClosed() {
            showClosed = document.getElementById('toggle-closed').checked;
            renderList();
        }

        function toggleNearby() {
            const checkbox = document.getElementById('toggle-nearby');
            if (checkbox.checked) {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(position => {
                        userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                        isNearbyActive = true;
                        renderList();
                    }, error => {
                        alert("Veuillez autoriser la géolocalisation.");
                        checkbox.checked = false;
                    });
                } else {
                    alert("Géolocalisation non supportée.");
                    checkbox.checked = false;
                }
            } else {
                isNearbyActive = false;
                userLocation = null;
                renderList();
            }
        }

        // --- MOTEUR D'AFFICHAGE ---
        function renderList() {
            const listEl = document.getElementById('list');
            listEl.innerHTML = '';
            
            // 1. Filtrage (Catégorie + Parc)
            let filtered = localDb.filter(item => item.category === currentTab && item.park === currentPark);
            
            // 2. Filtrage des lieux fermés
            if (!showClosed) {
                filtered = filtered.filter(item => {
                    return !(item.status === 'CLOSED' || item.status === 'DOWN' || item.status === 'REFURBISHMENT');
                });
            }

            // 3. Filtrage GPS
            if (isNearbyActive && userLocation) {
                filtered = filtered.filter(item => {
                    if(!item.lat || !item.lng) return false;
                    const dist = getDistanceFromLatLonInKm(userLocation.lat, userLocation.lng, item.lat, item.lng);
                    return dist <= 0.2; 
                });
            }

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="padding: 40px 20px; text-align: center; color: var(--text-muted); font-weight: 500;">Aucun lieu à afficher selon vos critères.</div>';
                return;
            }

            // 4. Regroupement par Land
            const grouped = {};
            filtered.forEach(item => {
                const key = item.land || "Autre";
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(item);
            });

            // 5. Génération HTML
            Object.keys(grouped).sort().forEach(groupKey => {
                const header = document.createElement('div');
                header.className = 'group-header';
                header.innerText = groupKey;
                listEl.appendChild(header);

                grouped[groupKey].forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => showDetail(item, card);
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-title">${item.name}</div>
                        </div>
                        <div class="wait-times">${getStatusHtml(item)}</div>
                    `;
                    listEl.appendChild(card);
                });
            });
        }

        function showDetail(item, cardElement) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');

            document.getElementById('detail-placeholder').style.display = 'none';
            document.getElementById('detail-content').style.display = 'block';

            document.getElementById('d-title').innerText = item.name;
            document.getElementById('d-desc').innerText = item.description || "";
            document.getElementById('d-wait-times').innerHTML = getStatusHtml(item);
            
            const imgEl = document.getElementById('d-image');
            if (item.image) {
                imgEl.src = item.image;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }
            
            let badgesHtml = `<div class="badge park">${item.park}</div>`;
            badgesHtml += `<div class="badge">${item.land}</div>`;
            if(item.type) badgesHtml += `<div class="badge">${item.type}</div>`;
            if(item.minHeight && item.minHeight !== "Pas de restriction") {
                badgesHtml += `<div class="badge red">📏 Min: ${item.minHeight}</div>`;
            }
            if(item.price) {
                badgesHtml += `<div class="badge price">💳 Tarifs: ${item.price}</div>`;
            }
            document.getElementById('d-badges').innerHTML = badgesHtml;

            const btn = document.getElementById('d-btn');
            if (item.menuUrl) {
                btn.href = item.menuUrl;
                btn.style.display = 'inline-block';
            } else {
                btn.style.display = 'none';
            }

            document.querySelector('.detail-pane').classList.add('show-mobile');
        }

        function closeDetail() {
            document.querySelector('.detail-pane').classList.remove('show-mobile');
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        }

        init();
    </script>
