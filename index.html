<!DOCTYPE html>
<html lang="fr" data-theme="chateau">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#12163A">
    <meta name="description" content="Temps d'attente, restaurants et spectacles de Disneyland Paris en temps réel.">
    <title>DLP Companion</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DLP Companion">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">

    <!-- Librairies pour le Portefeuille (Scanner QR et Générateur QR) -->
    <script src="https://unpkg.com/html5-qrcode" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js" defer></script>

    <script>
        window.DLP_THEMES = {
            chateau:     { n: 'Soirée au château',   f: 'Thème par défaut',    ink: '#12163A', gold: '#F2B33D', on: '#12163A', acc: '#6A3FD0', bg: '#F3F2FA', g1: '#2F46D1', g2: '#6A3FD0' },
            toystory:    { n: 'Toy Story',           f: 'Chambre d’Andy',      ink: '#1B3A7A', gold: '#FFCB05', on: '#1A1A2E', acc: '#C8231C', bg: '#EAF3FC', g1: '#2F6FC4', g2: '#1B3A7A' },
            raiponce:    { n: 'Raiponce',            f: 'Nuit des lanternes',  ink: '#2B1B5A', gold: '#F6C945', on: '#2B1B5A', acc: '#8A2BA0', bg: '#FAF3FF', g1: '#4B2E9B', g2: '#8A2BA0' },
            reineneiges: { n: 'La Reine des Neiges', f: 'Royaume d’Arendelle', ink: '#14315F', gold: '#9BE7FF', on: '#0E2347', acc: '#1C6FB8', bg: '#EEF8FF', g1: '#1C6FB8', g2: '#5B4BC4' },
            ratatouille: { n: 'Ratatouille',         f: 'Bistrot de Gusteau',  ink: '#2F3A4C', gold: '#F2B134', on: '#2A2418', acc: '#B3261E', bg: '#FBF6EE', g1: '#4A5A73', g2: '#B3261E' },
            avengers:    { n: 'Avengers',            f: 'QG des Avengers',     ink: '#101628', gold: '#F2B01E', on: '#101628', acc: '#C4161C', bg: '#F2F3F7', g1: '#1F3C88', g2: '#C4161C' },
            roilion:     { n: 'Le Roi Lion',         f: 'Terres du Roi',       ink: '#3A1D12', gold: '#F59E1B', on: '#3A1D12', acc: '#A63A0A', bg: '#FFF4E3', g1: '#A63A0A', g2: '#3A1D12' },
            sirene:      { n: 'La Petite Sirène',    f: 'Royaume d’Atlantica', ink: '#0B3B4F', gold: '#FF7A59', on: '#0B2A38', acc: '#7B3FA3', bg: '#EAF8F7', g1: '#0F7B8A', g2: '#7B3FA3' },
        };
        window.DLP_applyTheme = function (id) {
            var themes = window.DLP_THEMES;
            if (!themes[id]) id = 'chateau';
            var t = themes[id], root = document.documentElement;
            ['ink', 'gold', 'on', 'acc', 'bg', 'g1', 'g2'].forEach(function (k) { root.style.setProperty('--' + k, t[k]); });
            root.dataset.theme = id;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) { 
                var fresh = meta.cloneNode();
                fresh.content = t.ink;
                meta.replaceWith(fresh);
            }
            return id;
        };
        try { window.DLP_applyTheme(localStorage.getItem('dlp-theme')); }
        catch (e) { window.DLP_applyTheme('chateau'); }
    </script>

    <style>
        /* ==========================================================================
           1. Design tokens
           ========================================================================== */
        :root {
            color-scheme: light;
            --ink: #12163A; --gold: #F2B33D; --on: #12163A; --acc: #6A3FD0;
            --bg: #F3F2FA; --g1: #2F46D1; --g2: #6A3FD0;
            --mut: #565A76;
            --line: #D9D8EA;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --font: 'DM Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --font-display: Sora, 'DM Sans', system-ui, sans-serif;
        }

        /* ==========================================================================
           2. Base
           ========================================================================== */
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body { height: 100%; }
        html { background: var(--bg); }
        body {
            margin: 0; display: flex;
            height: 100vh; height: 100dvh; overflow: hidden;
            font-family: var(--font);
            background: var(--bg); color: var(--ink);
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; border: 0; background: none; padding: 0; }
        ul { list-style: none; margin: 0; padding: 0; }
        h1, h2, h3, p { margin: 0; }

        :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

        .icon { flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        /* ==========================================================================
           3. Colonne gauche
           ========================================================================== */
        .master-pane {
            position: relative; display: flex; flex-direction: column;
            width: 400px; min-width: 0; flex: none;
            background: var(--bg);
            border-right: 1px solid var(--line);
            overflow: hidden;
        }

        .hero {
            display: flex; flex-direction: column; gap: 14px;
            padding: calc(22px + var(--safe-top)) 20px 18px;
            border-radius: 0 0 28px 28px; color: #fff;
            background: var(--ink);
        }
        .hero :focus-visible { outline-color: #fff; }
        .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .hero h1 { min-width: 0; font-family: var(--font-display); font-weight: 800; font-size: 19px; white-space: nowrap; }
        .hero-actions { display: flex; align-items: center; gap: 8px; flex: none; }

        .sync {
            display: inline-flex; align-items: center; gap: 6px;
            min-height: 40px; padding: 0 12px; border-radius: 999px;
            background: rgb(255 255 255 / .14); color: #fff;
            font-size: 12px; font-weight: 700; white-space: nowrap;
        }
        .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .8; }
        .sync[data-state="live"] .dot  { background: #5EE08A; opacity: 1; }
        .sync[data-state="error"] .dot { background: #FF8A80; opacity: 1; }
        .sync:disabled { cursor: default; }
        .is-spinning .icon { animation: spin .9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .round {
            display: grid; place-items: center; flex: none;
            width: 44px; height: 44px; border-radius: 22px;
            background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgb(0 0 0 / .2);
        }
        .round.acc { color: var(--acc); }
        .round.acc[aria-pressed="true"] .icon { fill: currentColor; }
        .hero .round { background: rgb(255 255 255 / .14); color: #fff; box-shadow: none; }

        .seg { display: flex; padding: 3px; border-radius: 14px; background: rgb(255 255 255 / .12); }
        .seg button { flex: 1; min-height: 40px; border-radius: 11px; font-weight: 700; font-size: 14px; color: #E4E6FF; }
        .seg button[aria-pressed="true"] { background: var(--gold); color: var(--on); }

        .search-field {
            width: 100%; min-height: 46px; padding: 0 16px;
            border: 0; border-radius: 14px; outline-offset: 2px;
            background: rgb(255 255 255 / .14); color: #fff;
            font: 500 16px var(--font);
            -webkit-appearance: none; appearance: none;
        }
        .search-field::placeholder { color: #C9CCF0; opacity: 1; }
        .search-field::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }

        .chips { display: flex; gap: 8px; padding: 14px 20px 4px; overflow-x: auto; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; min-height: 44px; padding: 0 14px; border-radius: 22px;
            background: #fff; border: 1.5px solid var(--line);
            font-weight: 700; font-size: 13px;
        }
        .chip[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }

        .list { flex: 1; overflow-y: auto; padding: 4px 20px 110px; overscroll-behavior: contain; }
        .land { margin: 18px 0 8px; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--acc); }

        .card { display: flex; align-items: center; margin-bottom: 10px; border-radius: 18px; background: #fff; box-shadow: 0 2px 10px rgb(30 30 90 / .06); }
        .card.selected { box-shadow: 0 0 0 2px var(--acc), 0 2px 10px rgb(30 30 90 / .06); }
        .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 4px 12px 12px; text-align: left; border-radius: 18px; }
        .txt { flex: 1; min-width: 0; }
        .ttl { display: block; font-weight: 700; font-size: 15px; line-height: 1.25; }
        .sub { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.35; color: var(--mut); }
        .card-bell { width: .85em; height: .85em; margin-left: 6px; color: var(--acc); vertical-align: -1px; }

        .heart { flex: none; display: grid; place-items: center; width: 48px; height: 48px; margin-right: 4px; color: var(--acc); }
        .heart[aria-pressed="true"] .icon { fill: currentColor; }

        .badge {
            flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 66px; height: 66px; border-radius: 16px;
            font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1; text-align: center;
        }
        .badge small { margin-top: 3px; font: 700 11px var(--font); }
        .badge.low, .badge.open { background: #DDF3E4; color: #14692E; }
        .badge.mid, .badge.down { background: #FFE9C7; color: #8A4B00; }
        .badge.high { background: #FFD9D6; color: #A3121F; }
        .badge.show { background: #E6E3FA; color: #44309E; }
        .badge.off  { background: #E8E8EF; color: var(--mut); }
        .badge.tm { font-size: 17px; }
        .badge.sm { font-size: 13px; }

        .skeleton { margin-bottom: 10px; border-radius: 18px; background: #fff; opacity: .7; animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .35; } }
        .empty { padding: 40px 10px; text-align: center; color: var(--mut); line-height: 1.5; }

        .tabs {
            position: absolute; left: 16px; right: 16px; bottom: calc(16px + var(--safe-bottom)); z-index: 5;
            display: flex; gap: 4px; padding: 6px; border-radius: 26px;
            background: var(--ink); box-shadow: 0 10px 24px rgb(18 22 58 / .35);
        }
        .tabs button {
            flex: 1; min-height: 52px; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            font-size: 11.5px; font-weight: 700; color: #D4D7FA;
        }
        .tabs button[aria-current="true"] { background: var(--gold); color: var(--on); }
        .tabs :focus-visible { outline-color: var(--gold); outline-offset: -2px; }

        /* ==========================================================================
           4. Détail & Modals
           ========================================================================== */
        .detail-pane { flex: 1; display: flex; flex-direction: column; align-items: center; overflow-y: auto; background: var(--bg); }
        .detail-placeholder { margin-top: 30vh; color: var(--mut); font-size: 16px; font-weight: 500; }
        .detail-content { width: 100%; }

        .d-hero { position: relative; height: 250px; background: linear-gradient(160deg, var(--g1), var(--g2)); }
        .d-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .d-img-skeleton { position: absolute; inset: 0; background: #C9CCF0; opacity: 0.6; animation: pulse 1.4s ease-in-out infinite; border-radius: 0; }
        
        .d-bar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 2;
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: calc(20px + var(--safe-top)) 20px 0;
        }
        .btn-back { display: none; }

        .d-sheet {
            position: relative; z-index: 1; margin-top: -28px; padding: 24px 20px 28px;
            display: flex; flex-direction: column; gap: 16px;
            border-radius: 28px 28px 0 0; background: var(--bg);
        }
        .d-title { font-family: var(--font-display); font-weight: 800; font-size: 25px; line-height: 1.15; }
        .d-status { display: flex; align-items: center; gap: 14px; }
        .status-text { font-size: 14px; line-height: 1.4; color: var(--mut); }
        .d-st { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
        
        .show-info { background: #fff; padding: 16px; border-radius: 16px; border: 1.5px solid var(--line); margin-bottom: 4px; }
        .show-type { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--acc); display: block; margin-bottom: 8px; }
        .show-times { font-size: 14px; font-weight: 600; color: var(--mut); line-height: 1.5; }

        .sr {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 4px 10px;
            border-radius: 10px; white-space: nowrap;
            background: color-mix(in srgb, var(--acc) 11%, #fff);
            border: 1px solid color-mix(in srgb, var(--acc) 30%, #fff);
        }
        .sr-l { font-size: 12px; font-weight: 700; color: var(--acc); }
        .sr-t { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--ink); }
        .d-st .sr { margin-top: 0; }
        .pills { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill { padding: 6px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; }
        .pill.is-park { color: var(--g1); }
        .pill.is-land { color: var(--acc); }
        .pill.is-warning { color: #A3121F; }
        .d-desc { max-width: 60ch; font-size: 16px; line-height: 1.6; color: var(--mut); }

        .cta {
            display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 54px;
            border-radius: 16px; background: var(--ink); color: #fff !important;
            font-weight: 700; font-size: 15px; text-decoration: none; text-align: center;
        }
        .cta.alt { background: #fff; color: var(--ink) !important; border: 1.5px solid var(--line); }

        /* Alertes */
        .alert-box { padding: 16px; border-radius: 18px; background: #fff; border: 1.5px solid var(--line); }
        .alert-box.is-active { border-color: var(--acc); }
        .alert-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; font-weight: 800; }
        .alert-box.is-active .alert-title .icon { color: var(--acc); }
        .alert-label { margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--mut); }
        .alert-control { display: flex; align-items: center; gap: 10px; }
        .field { min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 16px; }
        .alert-field { width: 96px; font-weight: 700; text-align: center; }
        .alert-unit { font-size: 14px; font-weight: 600; color: var(--mut); }
        .alert-info { margin-top: 10px; font-size: 13px; line-height: 1.45; color: var(--mut); }
        .alert-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .btn-alert { min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 700; }
        .btn-alert.is-secondary { background: transparent; color: var(--mut); border: 1.5px solid var(--line); }
        .alert-toggle { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
        .alert-check { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; font-weight: 600; line-height: 1.4; cursor: pointer; }
        .alert-check input { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--acc); }

        /* Panels (Thème / Portefeuille) */
        .scrim { position: fixed; inset: 0; z-index: 300; background: rgb(10 12 30 / .55); border: 0; padding: 0; width: 100%; height: 100%; cursor: pointer; }
        .panel {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 301;
            width: 100%; max-width: 480px; margin: 0 auto;
            max-height: 90dvh; overflow-y: auto;
            padding: 20px 20px calc(28px + var(--safe-bottom));
            border-radius: 28px 28px 0 0; background: var(--bg);
        }
        .panel-full { max-height: 96dvh; height: 96dvh; display: flex; flex-direction: column; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex: none; }
        .panel-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 19px; }
        .panel-head .round { box-shadow: none; }
        
        .themes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .th { display: flex; flex-direction: column; gap: 10px; min-height: 84px; padding: 12px; text-align: left; border-radius: 16px; background: #fff; border: 2px solid var(--line); }
        .th[aria-pressed="true"] { border-color: var(--acc); }
        .sw { display: flex; padding-left: 6px; }
        .sw i { width: 24px; height: 24px; margin-left: -6px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .12); }
        .th-n { display: block; font-weight: 700; font-size: 14px; line-height: 1.2; }
        .th-f { display: block; margin-top: 2px; font-size: 12px; color: var(--mut); }

        /* Wallet specific styles */
        .wallet-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
        .wallet-item { display: flex; align-items: center; background: #fff; border-radius: 16px; border: 1.5px solid var(--line); overflow: hidden; }
        .wallet-item-btn { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 16px; text-align: left; }
        .wallet-item-text strong { font-size: 15px; color: var(--ink); }
        .wallet-item-text small { font-size: 13px; color: var(--mut); display: block; margin-top: 4px; }
        .wallet-item-btn .icon { color: var(--acc); }
        .wallet-item-del { flex: none; width: 54px; height: 100%; display: grid; place-items: center; color: #A3121F; border-left: 1px solid var(--line); border-radius: 0; background: #FFF4F4; }
        .wallet-label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--ink); }

        /* Message temporaire */
        .toast {
            position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); z-index: 400;
            max-width: min(90vw, 420px); padding: 10px 16px; border-radius: 12px;
            background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; text-align: center;
            transform: translate(-50%, 8px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ==========================================================================
           5. Responsive
           ========================================================================== */
        @media (min-width: 769px) {
            .detail-pane { padding: 32px; background: color-mix(in srgb, var(--ink) 7%, var(--bg)); }
            .detail-content { max-width: 560px; align-self: flex-start; overflow: hidden; border-radius: 28px; background: var(--bg); box-shadow: 0 8px 30px rgb(30 30 90 / .12); }
            .d-bar { padding-top: 20px; justify-content: flex-end; }
        }
        @media (max-width: 768px) {
            .master-pane { width: 100%; border-right: 0; }
            .detail-pane { display: none; }
            .detail-pane.is-open { display: flex; position: fixed; inset: 0; z-index: 100; animation: slide-in .25s ease-out; }
            .detail-content { min-height: 100%; background: var(--bg); }
            .btn-back { display: grid; }
        }
        @media (max-width: 400px) {
            .hero h1 { font-size: 17px; }
            .sync { padding: 0 10px; }
        }
        @keyframes slide-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

        <symbol id="i-attraction" viewBox="0 0 24 24"><path d="M19 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0zM12 3v14M5 10h14M8 21l4-4 4 4"/></symbol>
        <symbol id="i-restaurant" viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M17 21V3c-2 1-3.5 3.5-3.5 7 0 2 1 3 3.5 3"/></symbol>
        <symbol id="i-show" viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.8 4.2L17.6 20 12 16.8 6.4 20l1.4-6.2L3 9.6 9.4 9z"/></symbol>
        <symbol id="i-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><path d="M7.5 11h.01M10 7.5h.01M14 7.5h.01"/></symbol>
